# Color filters, applied to a color before it is matched to the map palette. Operations run in
# the order they are written. Names shown to players are in lang/<language>.yml (filter.<ID>).
# Operations and examples: https://zypec.github.io/izomap/wiki/#filters
#
#   brightness: 1.2                       contrast: 1.15
#   saturation: 0.8                       rgb-offset: {r: 25, g: 8, b: -20}
#   grayscale: true                       tint: {color: "#FFD9A0", strength: 0.25}
#   invert: true                          posterize: 6

version: 1

filters:
  ORIGINAL:
    ops: []

  WARM:
    ops:
      - rgb-offset: {r: 25, g: 8, b: -20}

  COOL:
    ops:
      - rgb-offset: {r: -20, g: 6, b: 25}

  GRAYSCALE:
    ops:
      - grayscale: true

  SEPIA:
    ops:
      - grayscale: true
      - tint: {color: "#C0955F", strength: 0.55}

  VIVID:
    ops:
      - saturation: 1.35
      - contrast: 1.1

  NOIR:
    ops:
      - grayscale: true
      - contrast: 1.4
