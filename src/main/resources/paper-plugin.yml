name: Izomap
version: '${version}'
main: dev.zypec.izomap.Izomap
api-version: '${apiVersion}'
description: Isometric photography for Minecraft servers, printed onto maps
authors:
  - zypec
website: https://zypec.github.io/izomap/
permissions:
  izomap.camera:
    description: Create and adjust cameras, and take photos
    default: true
  izomap.admin:
    description: Manage other players' cameras and photos, and reload the configuration
    default: op
  izomap.editor:
    description: Open the web editor with /izocam editor
    default: op
  izomap.export:
    description: Write a photo to disk as a PNG
    default: op
  izomap.style.sharp:
    description: The sharp style (a ray per pixel); the fast style needs no permission
    default: op
  izomap.style.shader:
    description: The shader style (sun shadows, haze, grading, bloom); the most expensive one
    default: op
  izomap.focus:
    description: Depth of field
    default: op
  izomap.fog:
    description: Distance fog
    default: op
  izomap.filter:
    description: Every color filter; izomap.filter.<ID> for a single one
    default: op
  izomap.sky:
    description: Every sky; izomap.sky.<NAME> for a single one
    default: op
  izomap.sky.bodies:
    description: The sun, the moon and the stars in the sky
    default: op
  izomap.frame:
    description: Every decoration frame; izomap.frame.<ID> for a single one
    default: op
  izomap.backing:
    description: Build a block behind a photo's frames where they have nothing to hang on
    default: op
  izomap.ratio:
    description: Every aspect ratio; izomap.ratio.<NAME> for a single one
    default: true
