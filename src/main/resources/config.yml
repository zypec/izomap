# ============================================================
#  Izomap - Ana Yapılandırma
# ============================================================

settings:
  # TEK MALİYET AYARI: bir fotoğrafın kapsayabileceği en geniş alanın kenar
  # uzunluğu (blok). Aşırı uzaklaştırmanın sunucuyu dondurmasını engeller;
  # aşılırsa çekim yapılmaz ve oyuncuya yakınlaşması söylenir.
  # Hem kopyalanacak chunk sayısını hem de ışınların kat edebileceği mesafeyi
  # sınırlar. Maliyet bununla KARESEL büyür: 512 -> ~1024 chunk,
  # 1024 -> ~4096 chunk. Aralık: 64-4096.
  max-capture-area: 512
  # Işınların, referans zeminden kaç blok daha AŞAĞIYA ulaşacağı.
  # Işın mesafesi ayar değil, hesaplanan bir sonuçtur:
  #   mesafe = (kadrajın üst kenarının hedef tabana dikey inişi) / sin(pitch)
  # Referans zemin, deniz seviyesi ile kameranın altındaki zeminden ALÇAK olanıdır
  # (kamera ikisinin de altındaysa kendi yüksekliği). Kameranın kendi sütunu tek
  # başına kullanılamaz: kamera bir kulenin/uzun ağacın üstündeyse taban yüzlerce
  # blok yukarı kayar ve uzaktaki deniz menzil dışında kalarak fotoğrafın üstünde
  # dümdüz bir boşluk şeridi bırakır. Bu değer ise kadrajın uzak ucu bir vadiye/
  # uçuruma denk geldiğinde ne kadar derinini göreceğini belirler.
  # Yüzey manzarası için varsayılan yeterlidir. Aralık: 0-1024.
  render-depth: 64
  # Render'ın kaç iş parçacığına bölüneceği. Görüntü yatay bantlara ayrılıp
  # paralel işlenir. Aralık: 1-16.
  render-threads: 4
  # Her çekimin ne kadar sürdüğü konsola yazılsın mı? Süre ikiye ayrılır:
  # chunk kopyalama (ana thread, diske bağlı) ve ışın yürüyüşü (render havuzu, saf CPU).
  # Render'a yeni bir aşama eklendiğinde maliyetini ölçmenin yoludur.
  # Varsayılan kapalı: canlı önizleme sürekli render ettiği için log'u doldurur.
  render-timing: false
  # Kadraja giren ama yüklü olmayan chunk'lar diskten yüklensin mi?
  # Kapalıysa sunucunun görüş mesafesi dışındaki her yer boş (şeffaf) çıkar.
  # Yükleme asenkrondur; ana thread donmaz.
  load-missing-chunks: true
  # Hiç üretilmemiş chunk'lar çekim için üretilsin mi? Varsayılan kapalı:
  # fotoğraf çekmek dünyayı büyütmemelidir.
  generate-missing-chunks: false
  # Bir oyuncunun aynı anda sahip olabileceği maksimum kamera sayısı.
  max-cameras-per-player: 5

camera:
  # Kamera modeli tipi: ITEM_DISPLAY veya BLOCK_DISPLAY
  display-type: ITEM_DISPLAY
  # ITEM_DISPLAY için kullanılacak model eşyası (Material adı).
  model-material: SPYGLASS
  # ITEM_DISPLAY modelinin duruşu. Eşyanın hangi bağlamda çizileceğini seçer ve
  # görünümü belirgin biçimde değiştirir: NONE, THIRDPERSON_RIGHTHAND,
  # THIRDPERSON_LEFTHAND, FIRSTPERSON_RIGHTHAND, FIRSTPERSON_LEFTHAND, HEAD, GUI,
  # GROUND, FIXED. Varsayılan FIXED = duvara asılı eşya görünümü (spyglass için en
  # makulü). Geçersiz değer varsayılana düşer ve log'a uyarı yazılır.
  # BLOCK_DISPLAY seçiliyken yok sayılır.
  item-display-transform: FIXED
  # Tık kutusunun model ölçeği 1.0'ken kenar uzunluğu. Gerçek kutu bununla
  # model-scale'in çarpımıdır (0.25-3.0 arasına sıkıştırılır): büyütülen kamerada
  # modelin gövdesine tıklamak çalışsın, küçültülende de görünmeyen bir alan
  # tıklanabilir kalmasın. Aralık: 0.1-3.0.
  interaction-size: 0.6
  # Sol/sağ tık ile yakınlaştırma adımı. ÇARPANDIR, eklenen bir miktar değil:
  # 1.25 = her tık %25 yakınlaştırır/uzaklaştırır. Aralık: 1.01-4.0.
  zoom-step: 1.25
  # Dünyada duran kamera modelinin görsel boyutu. Fotoğrafın yakınlaştırmasıyla
  # ilgisi YOKTUR; sadece modeli büyütüp küçültür. Aralık: 0.1-8.0.
  model-scale: 1.0
  # Yaw/Pitch ayar adımı (derece).
  angle-step: 15.0
  # Hareket modlarında (Hareket(x)/Hareket(y)) her tıkın kamerayı kaç blok
  # taşıyacağı. Hareket(x) kameranın bakış yönünün yatay izdüşümünde ileri/geri,
  # Hareket(y) dikey olarak yukarı/aşağı taşır. Aralık: 0.05-16.0.
  move-step: 1.0
  # Yeni kurulan kameranın dikey açısı (derece, pozitif = aşağı bakış).
  # 30 klasik izometrik açıdır. Ortografik projeksiyonda ışınlar paralel olduğu
  # için 0'a (yatay bakış) yaklaştıkça kamera arazi YÜZEYİNİ göremez hale gelir:
  # kadrajın üstü gökyüzü, altı toprak kesiti olur. 20-45 arasında kal.
  default-pitch: 30.0
  # Bir kamerayı aynı anda yalnızca tek oyuncu ayarlayabilir. Bu süre boyunca
  # kameraya dokunmayan oyuncunun kilidi düşer ve sıradaki tıklayan devralır;
  # aksi halde bir kez tıklayıp giden biri kamerayı kalıcı olarak kilitlerdi.
  # Diğerleri bu sırada önizlemeyi izleyebilir, yalnızca ayar yapamaz.
  # Saniye. Aralık: 1-3600.
  edit-lock-seconds: 30
  # Model rotasyon düzeltmesi (derece), üç eksende serbest. Farklı bir model
  # kullanılırsa, modelin baktığı yön ile çekim yönü hizalanana kadar elle ayarlanır.
  # Uygulanma sırası Y -> X -> Z olduğundan z, modelin kendi bakış ekseni etrafında
  # yatırma (roll) sağlar.
  model-rotation:
    x: 0.0   # pitch: öne/arkaya eğme
    y: 0.0   # yaw:   sağa/sola çevirme
    z: 0.0   # roll:  kendi ekseninde yatırma
  # Kameranın üstünde duran bilgi hologramı (TextDisplay).
  # HANGİ BİLGİNİN görüneceğini burası değil, messages.yml -> camera.hologram.lines
  # belirler; oradaki bir satırı silmek onu hologramdan kaldırır.
  hologram:
    # Kapatılırsa mevcut hologramlar da silinir (chunk yüklendikçe).
    enabled: true
    # Hologramın çıpanın kaç blok üstünde duracağı. Gerçek yükseklik bununla
    # model-scale'in çarpımıdır: büyütülmüş kamerada hologram modelin içine gömülmesin,
    # küçültülmüşte de havada asılı kalmasın. Aralık: -4.0 - 8.0.
    offset-y: 0.6
    # Görünme mesafesi çarpanı. Aralık: 0.1 - 10.0.
    view-range: 1.0
    # Hologramın nasıl duracağı: FIXED, VERTICAL, HORIZONTAL, CENTER.
    # CENTER = her zaman oyuncuya dönük. Geçersiz değer CENTER'a düşer.
    billboard: CENTER
    # Arka plan: "default" (vanilla koyu şerit), "none" / "transparent" (arka plan yok)
    # ya da #AARRGGBB / #RRGGBB hex renk (örn. #80000000 = yarı saydam siyah).
    # Geçersiz değer "default"a düşer ve log'a uyarı yazılır.
    background: default

photo:
  # Varsayılan en-boy oranı: RATIO_1_1, RATIO_16_9, RATIO_4_3
  default-aspect-ratio: RATIO_1_1
  # KADRAJ GENİŞLİĞİ: görüntünün üst kenarı ile alt kenarı arasına kaç blok
  # sığacağı. Kameranın zoom'u bunu böler:
  #   kapsanan alan = frame-height / zoom   (0.25x -> 192 blok, 2x -> 24 blok)
  # Ortografik (izometrik) projeksiyonda nesne boyutunu YALNIZCA bu belirler;
  # kameranın hedefe uzaklığı boyutu DEĞİŞTİRMEZ. "Daha çok yer görsün"
  # istiyorsan burayı büyüt ya da kameranın zoom'unu küçült
  # (settings.max-capture-area izin verdiği kadar). Aralık: 4-512.
  frame-height: 48
  # KADRAJIN DİKEY KAYMASI, kadraj yüksekliğinin oranı olarak.
  #   0.0 = kamera kadrajın tam ortasında -> kameranın baktığı nokta fotoğrafın
  #         merkezidir. Normal kullanım budur.
  #   0.5 = kamera kadrajın alt kenarında -> kadrajın TAMAMI kameranın üstünde
  #         kalır. DİKKAT: ortografik projeksiyonda ışınlar paraleldir, yani
  #         yatay (pitch ~0) ya da yukarı bakan bir kamerada hiçbir ışın araziye
  #         inmez ve fotoğraf TAMAMEN BOŞ çıkar.
  # Kadrajın kameranın altına düşen kısmının toprak kesiti basmasını bu ayar
  # çözmez; o iş, ışınların bakış yönünde geriye çekilmesiyle otomatik yapılır
  # (kameranın yatay düzleminin altından hiçbir ışın başlamaz).
  frame-shift: 0.0
  # KENAR YUMUŞATMA: piksel başına NxN ışın gönderilip ortalaması alınır.
  # 1 = kapalı (en hızlı), 2 = önerilen, 3-4 = daha temiz kenar, N² kat maliyet.
  supersampling: 2

placement:
  # Fotoğraf duvarının oyuncunun kaç blok önüne kurulacağı. Hayalet önizleme de bu
  # mesafede durur; oyuncu bakışını çevirdikçe onu takip eder.
  distance: 3
  # Harita çerçevelerini görünmez yap (kenarlıksız, kesintisiz görsel).
  invisible-frames: true
  # Çerçevelerin arkasına destek bloğu inşa et (yeniden başlatmada kalıcılık).
  # KAPALIYSA: fotoğraf yalnızca her çerçevenin arkasında zaten katı bir blok varsa
  # asılabilir; hayalet önizleme uygun olmayan yerde kırmızı yanar.
  build-backing-wall: true
  # Destek bloğu materyali (çerçeve arkasında, oyuncuya görünmez).
  # Hayalet önizlemenin blokları da bundan alınır; blok değilse WHITE_CONCRETE kullanılır.
  backing-material: STONE
  # Hayalet önizleme, oyuncu onaylamazsa kaç saniye sonra kendiliğinden iptal olur.
  # Aralık: 5-600.
  timeout-seconds: 60
