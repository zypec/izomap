# Izomap configuration. Every key is explained on the wiki:
# https://zypec.github.io/izomap/wiki/#configuration

settings:
  # Widest area one photo may cover, in blocks per side. The main cost limit. 64-4096.
  max-capture-area: 512
  # How far below the reference ground the rays may reach, in blocks. 0-1024.
  render-depth: 64
  # Threads one render is split across. 1-16.
  render-threads: 4
  # Log how long each capture took (chunk copy and ray walk).
  render-timing: false
  # Load chunks the frame covers that are not loaded (asynchronously).
  load-missing-chunks: true
  # Generate chunks that were never generated, so a photo can be taken of them.
  generate-missing-chunks: false
  # Replace vanilla map colors that look nothing like their block (tuff, flowers).
  correct-vanilla-colors: true
  # Cameras one player may own. Permission: izomap.max_cameras_by_player.<n>
  max-cameras-per-player: 5
  # Photos one camera may take. Permission: izomap.max_photos_by_camera.<n>
  max-photos-per-camera: 5
  # Map tiles one photo may span (4x2 = 8). Permission: izomap.max_map_tiles.<n>
  max-map-tiles: 12

camera:
  # ITEM_DISPLAY or BLOCK_DISPLAY.
  display-type: ITEM_DISPLAY
  # Item the camera model is drawn with (material name).
  model-material: SPYGLASS
  # How the item is held: NONE, THIRDPERSON_RIGHTHAND, HEAD, GUI, GROUND, FIXED and the rest.
  item-display-transform: NONE
  # Side of the click box at model scale 1.0. 0.1-3.0.
  interaction-size: 0.6
  # Zoom factor per click (1.25 = 25%). 1.01-4.0.
  zoom-step: 1.25
  # Size of the camera model in the world; does not change the photo. 0.1-8.0.
  model-scale: 1.0
  # Degrees per click when turning the camera.
  angle-step: 15.0
  # Blocks per click in move mode, along the player's view. 0.05-16.0.
  move-step: 1.0
  # Pitch of a new camera, in degrees down. Keep it between 20 and 45.
  default-pitch: 30.0
  # Seconds an idle editor keeps a camera before someone else can take it over. 1-3600.
  edit-lock-seconds: 30
  # Model rotation correction in degrees, for a custom model.
  model-rotation:
    x: 0.0
    y: 0.0
    z: 0.0
  # The info hologram above a camera. Its lines are in messages.yml (camera.hologram.lines).
  hologram:
    enabled: true
    # Blocks above the camera, times model-scale. -4.0-8.0.
    offset-y: 0.6
    # View range multiplier. 0.1-10.0.
    view-range: 1.0
    # FIXED, VERTICAL, HORIZONTAL or CENTER.
    billboard: CENTER
    # "default", "none" or a #AARRGGBB / #RRGGBB color.
    background: default

dialog:
  # Width of the capture screen's text and fields, in pixels. 100-1024.
  body-width: 380

photo:
  # Aspect ratio of a new camera: RATIO_1_1, RATIO_16_9 or RATIO_4_3.
  default-aspect-ratio: RATIO_1_1
  # Blocks from the top of the frame to the bottom at zoom 1. 4-512.
  frame-height: 48
  # Vertical frame offset, as a fraction of its height. 0.0 keeps the camera centered.
  frame-shift: 0.0
  # Anti-aliasing: NxN rays per pixel. Costs N squared. 1-4.
  supersampling: 2
  # Extra darkening beyond a surface's own face. Each step is one of the palette's four shades.
  shading:
    # A second ray towards the sun; a blocked surface goes one shade darker.
    sun-shadow: false
    # Direction and height of the sun, in degrees. Pitch 1-89.
    sun-yaw: 135.0
    sun-pitch: 60.0
    # How far a shadow ray travels, in blocks. 1-256.
    shadow-distance: 24
    # Darken inner corners whose neighbors close them in.
    ambient-occlusion: false
    # Darken surfaces that get little light (caves, interiors).
    block-light: false
    # Light levels (0-15) below which a surface loses one, then two shades.
    light-dim-below: 8
    light-dark-below: 4
  # Thin blocks (grass, flowers, rails) blend into what is behind them instead of filling the cell.
  coverage:
    enabled: true
  # Grass, leaves and water take their biome's color, read from the server.
  biome-tint:
    enabled: true
    # How much of the biome color is applied. 0.0-1.0.
    strength: 1.0
  # FLAT, DEPTH or TRANSLUCENT.
  water:
    mode: DEPTH
    # Cells of water after which the surface loses one, then two shades. 1-256.
    dim-deeper-than: 2
    dark-deeper-than: 5
    # TRANSLUCENT only: share the shallowest water keeps for itself. 0.0-1.0.
    surface-min: 0.35
    # TRANSLUCENT only: cells after which the bottom is hidden. 1-256.
    opaque-depth: 8
  # Depth of field, switched on per camera. Permission: izomap.focus
  focus:
    # Depth of the sharp band, as a fraction of the frame height. 0.02-8.0.
    range: 0.5
    # Widest blur, as a fraction of the image height. 0 turns it off. 0.0-0.05.
    max-radius: 0.015
    # Samples per pixel; the cost of the effect. 4-128.
    samples: 24
    # Dithering of the blurred tones. 0 turns it off. 0-128.
    dither: 24.0
  frames:
    # Bake a decoration frame into the photo for good instead of drawing it on the way out.
    embed: false
  # How a sky is drawn. Which sky a photo has is chosen per camera.
  sky:
    colors:
      dawn: "#FF9E6B"
      day: "#78A7FF"
      dusk: "#FF7A4D"
      night: "#0B1026"
    # Lighten towards the horizon.
    gradient: true
    # How close the lowest row gets to white. 0.0-1.0.
    horizon-blend: 0.45
    # Dithering of the gradient. 0 turns it off. 0-128.
    dither: 24.0
    # Sun, moon and stars, switched on per camera. Permission: izomap.sky.bodies
    bodies:
      sun: true
      moon: true
      stars: true
      # Diameter as a fraction of the image height. 0.0-1.0.
      sun-size: 0.07
      moon-size: 0.06
      # Share of the sky that holds a star. 0.0-0.5.
      star-density: 0.004
      sun-color: "#FFF6D0"
      moon-color: "#E6E9F0"
      star-color: "#FFFFFF"
  style:
    # Scale the FAST style renders at before it is enlarged. 0.5 casts a quarter of the rays.
    fast-scale: 0.5

placement:
  # Blocks in front of the player the photo wall is put.
  distance: 3
  # Make the item frames invisible.
  invisible-frames: true
  # Build a block behind each frame that has none.
  build-backing-wall: true
  # Block the backing wall is built from.
  backing-material: STONE
  # Seconds before an unconfirmed placement is cancelled. 5-600.
  timeout-seconds: 60
