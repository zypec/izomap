# ============================================================
#  Izomap - Ana Yapılandırma
# ============================================================

settings:
  # TEK MALİYET AYARI: bir fotoğrafın kapsayabileceği en geniş alanın kenar
  # uzunluğu (blok). Aşırı uzaklaştırmanın sunucuyu dondurmasını engeller;
  # aşılırsa çekim yapılmaz ve oyuncuya yakınlaşması söylenir.
  # Hem kopyalanacak chunk sayısını hem de ışınların kat edebileceği mesafeyi
  # sınırlar. Maliyet bununla KARESEL büyür: 512 -> ~1024 chunk, 1024 -> ~4096 chunk.
  # Aralık: 64-4096.
  max-capture-area: 512
  # Işınların, referans zeminden kaç blok daha AŞAĞIYA ulaşacağı.
  # Işın mesafesi ayar değil, hesaplanan bir sonuçtur:
  #   mesafe = (kadrajın üst kenarının hedef tabana dikey inişi) / sin(pitch)
  # Referans zemin, deniz seviyesi ile kameranın altındaki zeminden ALÇAK olanıdır
  # (kamera ikisinin de altındaysa kendi yüksekliği). Kameranın kendi sütunu tek
  # başına kullanılamaz: kamera bir kulenin/uzun ağacın üstündeyse taban yüzlerce
  # blok yukarı kayar ve uzaktaki deniz menzil dışında kalarak fotoğrafın üstünde
  # dümdüz bir boşluk şeridi bırakır. Bu değer ise kadrajın uzak ucu bir vadiye/
  # uçuruma denk geldiğinde ne kadar derinini göreceğini belirler.
  # Yüzey manzarası için varsayılan yeterlidir. Aralık: 0-1024.
  render-depth: 64
  # Render'ın kaç iş parçacığına bölüneceği. Görüntü yatay bantlara ayrılıp
  # paralel işlenir. Aralık: 1-16.
  render-threads: 4
  # Her çekimin ne kadar sürdüğü konsola yazılsın mı? Süre ikiye ayrılır:
  # chunk kopyalama (ana thread, diske bağlı) ve ışın yürüyüşü (render havuzu, saf CPU).
  # Render'a yeni bir aşama eklendiğinde maliyetini ölçmenin yoludur.
  # Varsayılan kapalı: canlı önizleme sürekli render ettiği için log'u doldurur.
  render-timing: false
  # Kadraja giren ama yüklü olmayan chunk'lar diskten yüklensin mi?
  # Kapalıysa sunucunun görüş mesafesi dışındaki her yer boş (şeffaf) çıkar.
  # Yükleme asenkrondur; ana thread donmaz.
  load-missing-chunks: true
  # Hiç üretilmemiş chunk'lar çekim için üretilsin mi? Varsayılan kapalı:
  # fotoğraf çekmek dünyayı büyütmemelidir.
  generate-missing-chunks: false
  # Vanilla'nın harita rengi her zaman bloğa benzemez: renk dokudan üretilmiş bir
  # ortalama değil, elle atanmış bir değerdir. En belirgin örnek tuff ailesi — on dört
  # tuff bloğunun tamamı TERRACOTTA_GRAY (#392923, siyaha yakın kahve) bildirir, oysa
  # tuff dokusunun ortalaması #6C6D66 (açık gri-yeşil). Bu ayar açıkken o bloklar
  # dokusuna en yakın temel renge çekilir (tuff -> DEEPSLATE).
  # Kapatırsan fotoğraf vanilla haritayla birebir aynı olur, bu kusur dahil.
  # block-colors.yml her iki durumda da son sözü söyler.
  correct-vanilla-colors: true
  # Bir oyuncunun aynı anda sahip olabileceği maksimum kamera sayısı.
  # İzinle geçersiz kılınabilir: izomap.max_cameras_by_player.<sayı>
  max-cameras-per-player: 5
  # Bir kamerayla çekilebilecek maksimum fotoğraf sayısı (asılı olsun olmasın).
  # İzinle geçersiz kılınabilir: izomap.max_photos_by_camera.<sayı>
  #
  # İzin varsa buradaki değer TAMAMEN yok sayılır — izindeki sayı daha küçük olsa bile
  # geçerlidir, böylece bir grubu genel sınırın altında tutmak da mümkün olur.
  # Birden çok izin varsa EN BÜYÜĞÜ geçerlidir (izinler gruplardan toplandığı için
  # küçüğü almak, cömert bir gruba girmeyi cezaya çevirirdi).
  # izomap.max_photos_by_camera.0 → hiç çekemez.
  # izomap.max_photos_by_camera.unlimited → sınırsız.
  max-photos-per-camera: 5
  # Bir fotoğrafın kaplayabileceği maksimum harita karesi (1x1 = 1, 4x2 = 8, 16x9 = 144).
  # Render maliyetini asıl belirleyen ayar budur; başka hiçbir seçenek bu kadar hızlı
  # büyümez. Varsayılan 12, küçük ızgaraların tamamına (4x3'e kadar) izin verir, büyük
  # üçünü (8x4, 8x6, 16x9) izne bırakır.
  # İzinle geçersiz kılınabilir: izomap.max_map_tiles.<sayı> (aynı kurallar: izin varsa
  # buradaki değer yok sayılır, birden çoksa en büyüğü geçerlidir, .unlimited sınırsız).
  # Bir en-boy oranının EN KÜÇÜK ızgarası sınırın üstünde bile olsa seçilebilir kalır;
  # yoksa 16:9 (en küçüğü 8 kare) hiç kullanılamayan bir oran olurdu.
  max-map-tiles: 12

camera:
  # Kamera modeli tipi: ITEM_DISPLAY veya BLOCK_DISPLAY
  display-type: ITEM_DISPLAY
  # ITEM_DISPLAY için kullanılacak model eşyası (Material adı).
  model-material: SPYGLASS
  # ITEM_DISPLAY modelinin duruşu. Eşyanın hangi bağlamda çizileceğini seçer ve
  # görünümü belirgin biçimde değiştirir: NONE, THIRDPERSON_RIGHTHAND,
  # THIRDPERSON_LEFTHAND, FIRSTPERSON_RIGHTHAND, FIRSTPERSON_LEFTHAND, HEAD, GUI,
  # GROUND, FIXED.
  # Varsayılan: NONE.
  # Geçersiz değer varsayılana düşer ve log'a uyarı yazılır.
  # BLOCK_DISPLAY seçiliyken yok sayılır.
  item-display-transform: NONE
  # Tık kutusunun model ölçeği 1.0'ken kenar uzunluğu. Gerçek kutu bununla
  # model-scale'in çarpımıdır (0.25-3.0 arasına sıkıştırılır): büyütülen kamerada
  # modelin gövdesine tıklamak çalışsın, küçültülende de görünmeyen bir alan
  # tıklanabilir kalmasın. Aralık: 0.1-3.0.
  interaction-size: 0.6
  # Sol/sağ tık ile yakınlaştırma adımı. ÇARPANDIR, eklenen bir miktar değil:
  # 1.25 = her tık %25 yakınlaştırır/uzaklaştırır. Aralık: 1.01-4.0.
  zoom-step: 1.25
  # Dünyada duran kamera modelinin görsel boyutu. Fotoğrafın yakınlaştırmasıyla
  # ilgisi YOKTUR; sadece modeli büyütüp küçültür. Aralık: 0.1-8.0.
  model-scale: 1.0
  # Yaw/Pitch ayar adımı (derece).
  angle-step: 15.0
  # Hareket modunda her tıkın kamerayı kaç blok taşıyacağı. Yön OYUNCUNUN bakış
  # vektörüdür: sağ tık baktığı yöne, sol tık zıt yöne. Bakış pitch'i de taşıdığı
  # için yükseklik ayrı bir moda gerek kalmadan gelir. Aralık: 0.05-16.0.
  move-step: 1.0
  # Yeni kurulan kameranın dikey açısı (derece, pozitif = aşağı bakış).
  # 30 klasik izometrik açıdır. Ortografik projeksiyonda ışınlar paralel olduğu
  # için 0'a (yatay bakış) yaklaştıkça kamera arazi YÜZEYİNİ göremez hale gelir:
  # kadrajın üstü gökyüzü, altı toprak kesiti olur. 20-45 arasında kal.
  default-pitch: 30.0
  # Bir kamerayı aynı anda yalnızca tek oyuncu ayarlayabilir. Bu süre boyunca
  # kameraya dokunmayan oyuncunun kilidi düşer ve sıradaki tıklayan devralır;
  # aksi halde bir kez tıklayıp giden biri kamerayı kalıcı olarak kilitlerdi.
  # Diğerleri bu sırada önizlemeyi izleyebilir, yalnızca ayar yapamaz.
  # Saniye. Aralık: 1-3600.
  edit-lock-seconds: 30
  # Model rotasyon düzeltmesi (derece), üç eksende serbest. Farklı bir model
  # kullanılırsa, modelin baktığı yön ile çekim yönü hizalanana kadar elle ayarlanır.
  # Uygulanma sırası Y -> X -> Z olduğundan z, modelin kendi bakış ekseni etrafında
  # yatırma (roll) sağlar.
  model-rotation:
    x: 0.0   # pitch: öne/arkaya eğme
    y: 0.0   # yaw:   sağa/sola çevirme
    z: 0.0   # roll:  kendi ekseninde yatırma
  # Kameranın üstünde duran bilgi hologramı (TextDisplay).
  # HANGİ BİLGİNİN görüneceğini burası değil, messages.yml -> camera.hologram.lines
  # belirler; oradaki bir satırı silmek onu hologramdan kaldırır.
  hologram:
    # Kapatılırsa mevcut hologramlar da silinir (chunk yüklendikçe).
    enabled: true
    # Hologramın çıpanın kaç blok üstünde duracağı. Gerçek yükseklik bununla
    # model-scale'in çarpımıdır: büyütülmüş kamerada hologram modelin içine gömülmesin,
    # küçültülmüşte de havada asılı kalmasın. Aralık: -4.0 - 8.0.
    offset-y: 0.6
    # Görünme mesafesi çarpanı. Aralık: 0.1 - 10.0.
    view-range: 1.0
    # Hologramın nasıl duracağı: FIXED, VERTICAL, HORIZONTAL, CENTER.
    # CENTER = her zaman oyuncuya dönük. Geçersiz değer CENTER'a düşer.
    billboard: CENTER
    # Arka plan: "default" (vanilla koyu şerit), "none" / "transparent" (arka plan yok)
    # ya da #AARRGGBB / #RRGGBB hex renk (örn. #80000000 = yarı saydam siyah).
    # Geçersiz değer "default"a düşer ve log'a uyarı yazılır.
    background: default

# Fotoğraf çekim ekranı (Dialog).
dialog:
  # Gövde metninin ve giriş alanlarının genişliği (piksel). Bilgi satırı kamera adı ve
  # beş ayar taşıdığı için vanilla genişlikte üç satıra sarıyor. Aralık: 100-1024.
  body-width: 380

photo:
  # Varsayılan en-boy oranı: RATIO_1_1, RATIO_16_9, RATIO_4_3
  default-aspect-ratio: RATIO_1_1
  # KADRAJ GENİŞLİĞİ: görüntünün üst kenarı ile alt kenarı arasına kaç blok
  # sığacağı. Kameranın zoom'u bunu böler:
  #   kapsanan alan = frame-height / zoom   (0.25x -> 192 blok, 2x -> 24 blok)
  # Ortografik (izometrik) projeksiyonda nesne boyutunu YALNIZCA bu belirler;
  # kameranın hedefe uzaklığı boyutu DEĞİŞTİRMEZ. "Daha çok yer görsün"
  # istiyorsan burayı büyüt ya da kameranın zoom'unu küçült
  # (settings.max-capture-area izin verdiği kadar). Aralık: 4-512.
  frame-height: 48
  # KADRAJIN DİKEY KAYMASI, kadraj yüksekliğinin oranı olarak.
  #   0.0 = kamera kadrajın tam ortasında -> kameranın baktığı nokta fotoğrafın
  #         merkezidir. Normal kullanım budur.
  #   0.5 = kamera kadrajın alt kenarında -> kadrajın TAMAMI kameranın üstünde
  #         kalır. DİKKAT: ortografik projeksiyonda ışınlar paraleldir, yani
  #         yatay (pitch ~0) ya da yukarı bakan bir kamerada hiçbir ışın araziye
  #         inmez ve fotoğraf TAMAMEN BOŞ çıkar.
  # Kadrajın kameranın altına düşen kısmının toprak kesiti basmasını bu ayar
  # çözmez; o iş, ışınların bakış yönünde geriye çekilmesiyle otomatik yapılır
  # (kameranın yatay düzleminin altından hiçbir ışın başlamaz).
  frame-shift: 0.0
  # KENAR YUMUŞATMA: piksel başına NxN ışın gönderilip ortalaması alınır.
  # 1 = kapalı (en hızlı), 2 = önerilen, 3-4 = daha temiz kenar, N² kat maliyet.
  supersampling: 2
  # GÖLGELENDİRME. Bugün bir yüzeyin parlaklığı yalnızca ışının girdiği yüzden gelir
  # (üst 255, yan 220/180, alt 135). Aşağıdakiler buna komşuları ve güneşi katar.
  #
  # ÖNEMLİ: harita paletinde renk başına yalnızca DÖRT parlaklık var. "Biraz daha koyu"
  # diye bir şey yok; her teknik yüzeyi bir sonraki tona indirir ya da indirmez.
  # İkisi de varsayılan KAPALI: görüntüyü değiştirirler, yani sunucunun zevkidir.
  # Maliyetleri IZOMAP.md -> "Gelişmiş gölgelendirme" başlığında ölçülmüş hâlde.
  shading:
    # Isabet noktasından güneşe doğru ikinci bir ışın atar; yolda blok varsa yüzey bir
    # ton koyulaşır. Görsel kazancı en yüksek olan bu: kapalıyken duvar ile önündeki
    # zemin aynı parlaklıkta çıkıyor ve kadrajda ışığın nereden geldiğini söyleyen
    # hiçbir şey olmuyor. Maliyeti de en yüksek olan bu (isabet başına ikinci ışın).
    sun-shadow: false
    # Güneşin yönü ve ufuktan yüksekliği (derece). Oyun saatine bağlamak yerine sabit
    # tutuluyor: sabit açı daha "render" gibi durur ve aynı manzaranın iki çekimi
    # birbirini tutar. Aralık: pitch 1-89.
    sun-yaw: 135.0
    sun-pitch: 60.0
    # Gölge ışınının pes etmeden önce kat ettiği mesafe (blok). Küçük değer ucuzdur ama
    # uzak bir kulenin gölgesi yere düşmez. Aralık: 1-256.
    shadow-distance: 24
    # Yüzeyin önü komşularıyla kapatılmışsa bir ton koyulaşır (iç köşeler). Işın atmaz,
    # isabet başına dört blok okur. Etkisi ince ama iç köşeleri köşe gibi gösteren şey
    # budur; kapalıyken düz rengin içinde bir kıvrım gibi durur.
    ambient-occlusion: false
    # Az ışık alan yüzeyler koyulaşır. Üçünün en ucuzu: ışık zaten chunk kopyasının
    # içinde, isabet başına tek okuma. Kapalıyken mağara ve iç mekân, dışarıdaki tarlayla
    # aynı gün ışığında çıkar; güneş gölgesinin oraya sözü geçmez. Açıkken chunk kopyası
    # ışık dizilerini de taşır, yani kopyalama biraz pahalılaşır (kapalıyken artık hiç
    # taşımıyor).
    block-light: false
    # Eşikler (0-15): bu değerin altında bir ton, ikincisinin altında iki ton iner.
    # Gök ışığı saate bağlı DEĞİLDİR — açık havadaki yüzey gece de 15 okur; buradaki
    # sabit güneşle tutarlı olan budur. İkinci eşik birincisinden büyük verilirse
    # birincisine çekilir.
    light-dim-below: 8
    light-dark-below: 4
  # ALAN DERİNLİĞİ (odak). Oyuncu çekim ekranından açar ve slider ile odak uzaklığını
  # (blok) seçer; odaktaki uzaklık net kalır, ondan uzaklaşan her şey bulanıklaşır.
  # İzin: izomap.focus. Kapalıyken hiçbir maliyeti yoktur.
  #
  # ÖNEMLİ: projeksiyon ortografiktir, yani ortada mercek YOKTUR. Bu gerçek bir bokeh
  # simülasyonu değil, seçilmiş bir görünümdür (eğimli kamerada "tilt-shift", yatay
  # kamerada özneyi arka planından ayırma). Aşağıdaki değerler efektin fiziği değil,
  # sunucunun ona izin verdiği ölçüdür.
  focus:
    # NETLİK BANDININ DERİNLİĞİ: odaktan ne kadar uzaklaşınca bulanıklık tavana vurur.
    # Blok değil, KADRAJ YÜKSEKLİĞİNİN ORANI olarak verilir (0.5 = yarım kadraj boyu),
    # böylece zoom'la birlikte kendiliğinden ölçeklenir. Küçük değer = ince odak bandı,
    # güçlü ayrışma. Aralık: 0.02-8.0.
    range: 0.5
    # EN GENİŞ BULANIKLIK YARIÇAPI, görüntü YÜKSEKLİĞİNİN oranı olarak (0.015 = 1152px
    # bir fotoğrafta ~17 piksel). Piksel yerine oran: aynı çekim 128px'lik önizlemede de
    # 2048px'lik fotoğrafta da aynı görünsün. 0 = efekt kapalı. Aralık: 0.0-0.05.
    max-radius: 0.015
    # MALİYET AYARI. Bulanıklık diski her piksel için bu kadar noktadan örneklenir;
    # maliyet yarıçapla değil, YALNIZCA bu sayıyla artar (piksel başına sabit iş).
    # Az örnek = disk üzerinde noktacıklar görünür, çok örnek = daha pürüzsüz ve pahalı.
    # Aralık: 4-128.
    samples: 24
    # DITHERING, gökyüzündekiyle aynı sebep: bulanıklık ara tonlar üretir, palette 244
    # renk vardır ve doğrudan snap edilirse yumuşak geçiş bantlaşır. Değer, bir pikselin
    # gerçek renkten kaç kanal basamağı sapabileceğidir. 0 = kapalı. Aralık: 0-128.
    dither: 24.0
  # ÇERÇEVELER. Çerçeveler frames.yml'de tanımlıdır; buradaki tek soru, taktıktan sonra
  # değiştirilebilir olup olmadıklarıdır.
  frames:
    # false (varsayılan): fotoğraf kaydında yalnızca çerçevenin kimliği durur, kenar
    #   haritalara giderken çizilir. Maliyeti zaten okunan piksellerin üzerinden bir
    #   geçiş; karşılığında çerçeve değiştirilebilir ve kaldırılabilir kalır.
    # true: kenar fotoğrafın ön bellek dosyasına işlenir. Fotoğraf kendi dosyasından
    #   başka hiçbir şeye ihtiyaç duymaz, ama çerçeve resmin parçası olur ve geri
    #   alınamaz — istenen tam olarak buysa açılır.
    # Ayar, çerçeve TAKILDIĞI anda fotoğrafa donar; sonradan değiştirmek, gömülü
    # çerçeveyle asılmış fotoğrafları geri döndürmez.
    embed: false
  # GÖKYÜZÜ. Hiçbir bloğa çarpmayan ışın normalde şeffaf piksel bırakır; gökyüzü
  # açıksa o pikseller boyanır. HANGİ gökyüzünü oyuncu Dialog'dan seçer (Şeffaf, Oyun
  # saati, Şafak, Gündüz, Gün batımı, Gece); buradakiler gökyüzünün NASIL çizildiğidir.
  # Renk çekim anında çözülüp fotoğrafa donar, yani yeniden render'da saat kaymaz.
  sky:
    # Renk oyun saatine göre bu dört kareden interpolasyonla gelir.
    # Saatler: şafak 23000, gündüz 6000, gün batımı 12500, gece 18000.
    colors:
      dawn: "#FF9E6B"
      day: "#78A7FF"
      dusk: "#FF7A4D"
      night: "#0B1026"
    # Aşağı indikçe ufka doğru açılsın mı? Kapalıysa düz tek renk gökyüzü.
    gradient: true
    # Gradyanın en alt satırının beyaza ne kadar yaklaşacağı. Aralık: 0.0-1.0.
    horizon-blend: 0.45
    # DITHERING. Harita paletinde mavi az olduğu için gradyan bantlaşır; bu ayar
    # komşu iki paleti 4x4 damalı karıştırıp aradaki tonu göz için üretir.
    # Değer, bir pikselin gerçek renkten kaç kanal basamağı sapabileceğidir.
    # 0 = kapalı (temiz ama bantlı). Aralık: 0-128.
    dither: 24.0
  # ÇEKİM MALİYETİ. Stil, fotoğrafın ne kadarının gerçekten ışınla çizildiğini belirler;
  # oyuncu Dialog'dan seçer. "Keskin" her piksel için ışın atar, "Hızlı" görüntüyü küçük
  # çizip büyütür — ışın sayısı aşağıdaki oranın KARESİYLE azalır (0.5 -> dörtte bir).
  # Karşılığında görüntü o oranda yumuşar; bu bir efekt değil, atılmayan ışınların bedeli.
  # Büyük ızgaralarda (4x3 ve üstü) işe yarar.
  style:
    fast-scale: 0.5

placement:
  # Fotoğraf duvarının oyuncunun kaç blok önüne kurulacağı. Hayalet önizleme de bu
  # mesafede durur; oyuncu bakışını çevirdikçe onu takip eder.
  distance: 3
  # Harita çerçevelerini görünmez yap (kenarlıksız, kesintisiz görsel).
  invisible-frames: true
  # Çerçevelerin arkasına destek bloğu inşa et (yeniden başlatmada kalıcılık).
  # KAPALIYSA: fotoğraf yalnızca her çerçevenin arkasında zaten katı bir blok varsa
  # asılabilir; hayalet önizleme uygun olmayan yerde kırmızı yanar.
  build-backing-wall: true
  # Destek bloğu materyali (çerçeve arkasında, oyuncuya görünmez).
  # Hayalet önizlemenin destek katmanı da bundan çizilir — ama yalnızca gerçekten blok
  # örülecek hücrelerde; blok değilse WHITE_CONCRETE kullanılır.
  backing-material: STONE
  # Hayalet önizleme, oyuncu onaylamazsa kaç saniye sonra kendiliğinden iptal olur.
