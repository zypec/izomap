# ============================================================
#  Izomap - Fotoğraf Çerçeveleri
#
#  Bir çerçeveyi ÜÇ ŞEKİLDE yazabilirsin; üçü de aynı çizim yoluna derlenir:
#
#  1) rings  — iç içe halkalar: renk + kalınlık. Basit çerçevelerin tamamı bu.
#  2) edge / corner — KARAKTERLE PİKSEL SANATI. edge satırları kenar boyunca
#     tekrarlanır (desen, çizgi, halat), corner ise dört köşeye çizilir (aynalanır).
#     Halkaların yapamadığı her şey burada. Nokta (ya da palette'te tanımsız bir
#     karakter) SAYDAM demektir: orada fotoğraf görünür.
#  3) texture — frames/ klasöründeki bir PNG, "inset" değerinde nine-slice edilir:
#     sol üst inset x inset kare KÖŞE, üst kenarda iki inset arasında kalan şerit
#     TEKRARLANAN KENAR olur. Görsel düzenleyicide çizmek isteyenler için.
#
#  scale: bir sanat pikselinin kaç fotoğraf pikseli kaplayacağı. Sayı verebilirsin
#  (scale: 2) ya da yazmazsan "auto" olur: fotoğraf büyüdükçe çerçeve de büyür
#  (128 px kısa kenar -> 1x, 768 px -> 3x). Auto sayesinde aynı çerçeve 1x1'de de
#  16x9'da da çerçeve gibi durur, kıl gibi bir çizgiye dönüşmez.
#
#  - Renkler harita paletine yuvarlanır (palette 244 renk var); yazdığın hex'in
#    en yakın karşılığı kullanılır.
#  - Çerçeve fotoğrafın DIŞ piksellerinin ÜSTÜNE çizilir, fotoğrafı küçültmez.
#  - Toplam kalınlık, kısa kenarın %20'sini geçemez (iki kenara bölününce %40);
#    aşan halkalar kırpılır, böylece 1x1 fotoğrafta da kullanılabilir kalır.
#  - Buradaki sıra, çerçeve seçme ekranındaki sıradır.
#  - İzin: izomap.frame (hepsi) ya da izomap.frame.<KIMLIK> (tek çerçeve).
#  - Görünen adlar messages.yml -> frame.<KIMLIK> altındadır; karşılığı olmayan
#    çerçeve kimliğiyle görünür.
#
#  Sürüm alanı ileride göç gerekirse diye duruyor; şu an okunmuyor.
# ============================================================

version: 1

frames:
  # Ahşap: sıcak, kalın, klasik tablo çerçevesi.
  WOOD:
    rings:
      - { color: "#2B1D0E", width: 2 }
      - { color: "#7A5A32", width: 6 }
      - { color: "#3B2A16", width: 2 }

  # Altın: parlak gövde, koyu dış hat.
  GOLD:
    rings:
      - { color: "#3B2A16", width: 2 }
      - { color: "#E5C34C", width: 5 }
      - { color: "#8A6B1F", width: 2 }

  # Siyah: modern, ince, fotoğrafın önüne geçmez.
  BLACK:
    rings:
      - { color: "#1A1A1A", width: 4 }

  # Paspartu: beyaz iç kenar + ince koyu dış hat; belge/harita görünümü.
  MAT:
    rings:
      - { color: "#2B2B2B", width: 1 }
      - { color: "#E8E4DC", width: 7 }
      - { color: "#9A9A9A", width: 1 }

  # Taş: gri, ağır, kale duvarına asılan çerçeve.
  STONE:
    rings:
      - { color: "#4A4A4A", width: 2 }
      - { color: "#8C8C8C", width: 5 }
      - { color: "#5C5C5C", width: 2 }

  # --- Piksel sanatı örnekleri (edge / corner) ---

  # Halat: kenar boyunca dört pikselde bir dönen bir örgü. Halkalarla yapılamaz,
  # çünkü desen kenar boyunca DEĞİŞİYOR.
  ROPE:
    palette:
      a: "#C8A96A"
      b: "#8A6B3A"
    edge:
      - "bbbb"
      - "aabb"
      - "bbbb"

  # İşlemeli altın: köşeleri kesik, kenarında altı pikselde bir çıkıntı olan çerçeve.
  # Köşedeki "." saydamdır: orada fotoğrafın kendi köşesi görünür.
  ORNATE:
    palette:
      x: "#E5C34C"
      o: "#8A6B1F"
    edge:
      - "oooooo"
      - "xxxxxx"
      - "xoxxox"
      - "oooooo"
    corner:
      - "..oo"
      - ".oxo"
      - "oxxo"
      - "oooo"

  # --- PNG örneği (kapalı) ---
  # Kendi çerçeveni bir görsel düzenleyicide çizmek istersen: PNG'yi
  # plugins/Izomap/frames/ altına koy ve aşağıdaki bloğun başındaki # işaretlerini sil.
  # inset, köşe karesinin kenarıdır; üst kenarda iki inset arasında kalan şerit
  # tekrarlanır. Yarı saydam pikseller saydam sayılır (harita paletinde alfa yok).
  # CUSTOM:
  #   texture: "my-frame.png"
  #   inset: 8
  #   scale: auto
