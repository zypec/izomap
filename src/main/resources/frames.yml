# Decoration frames for photos on the wall, in the order the frame screen lists them.
# Names shown to players are in messages.yml (frame.<ID>). Permission: izomap.frame.<ID>
# The three ways to write one (rings, pixel art, PNG): https://zypec.github.io/izomap/wiki/#frames

version: 1

frames:
  WOOD:
    rings:
      - { color: "#2B1D0E", width: 2 }
      - { color: "#7A5A32", width: 6 }
      - { color: "#3B2A16", width: 2 }

  GOLD:
    rings:
      - { color: "#3B2A16", width: 2 }
      - { color: "#E5C34C", width: 5 }
      - { color: "#8A6B1F", width: 2 }

  BLACK:
    rings:
      - { color: "#1A1A1A", width: 4 }

  MAT:
    rings:
      - { color: "#2B2B2B", width: 1 }
      - { color: "#E8E4DC", width: 7 }
      - { color: "#9A9A9A", width: 1 }

  STONE:
    rings:
      - { color: "#4A4A4A", width: 2 }
      - { color: "#8C8C8C", width: 5 }
      - { color: "#5C5C5C", width: 2 }

  # Pixel art: edge rows repeat along each side; "." is transparent.
  ROPE:
    palette:
      a: "#C8A96A"
      b: "#8A6B3A"
    edge:
      - "bbbb"
      - "aabb"
      - "bbbb"

  # The corner is drawn at all four corners, mirrored.
  ORNATE:
    palette:
      x: "#E5C34C"
      o: "#8A6B1F"
    edge:
      - "oooooo"
      - "xxxxxx"
      - "xoxxox"
      - "oooooo"
    corner:
      - "..oo"
      - ".oxo"
      - "oxxo"
      - "oooo"

  # A PNG from plugins/Izomap/frames/, nine-sliced at the inset.
  # CUSTOM:
  #   texture: "my-frame.png"
  #   inset: 8
  #   scale: auto
