# Decoration frames for photos on the wall, in the order the frame screen lists them.
# Names shown to players are in lang/<language>.yml (frame.<ID>). Permission: izomap.frame.<ID>
# The three ways to write one (rings, pixel art, PNG), bevel and shadow: https://zypec.github.io/izomap/wiki/#frames

version: 1

frames:
  # A walnut moulding: grain along the strip, a dark lip on each side.
  WOOD:
    bevel: 0.22
    shadow: 3
    palette:
      d: "#24170B"
      m: "#4E3519"
      w: "#7A5A32"
      l: "#9A7444"
    edge:
      - "dddddddddddd"
      - "mmmmmmmmmmmm"
      - "wwwlwwwwwwlw"
      - "wlwwwwwmwwww"
      - "wwwwmwwwwlww"
      - "lwwwwwwlwwww"
      - "wwmwwwwwwwmw"
      - "mmmmmmmmmmmm"
      - "dddddddddddd"

  # A rounded gilt profile: dark rims, a bright crest, a highlight line along it.
  GOLD:
    bevel: 0.18
    shadow: 3
    rings:
      - { color: "#3B2A10", width: 1 }
      - { color: "#8A6B1F", width: 2 }
      - { color: "#C9A23A", width: 2 }
      - { color: "#F2D86A", width: 1 }
      - { color: "#E5C34C", width: 2 }
      - { color: "#A9852A", width: 2 }
      - { color: "#5E4614", width: 1 }

  # Thin and modern: satin black with a grey edge where it meets the photo.
  BLACK:
    bevel: 0.12
    shadow: 2
    rings:
      - { color: "#101010", width: 4 }
      - { color: "#2E2E2E", width: 1 }
      - { color: "#5A5A5A", width: 1 }

  # A white mat in a slim black frame; the cut edge catches the light on one side.
  MAT:
    shadow: 2
    rings:
      - { color: "#141414", width: 2 }
      - { color: "#EDE9E1", width: 8 }
      - { color: "#FFFFFF", width: 1 }
      - { color: "#B9B4AA", width: 1 }

  # Weathered stone blocks, mortar between them.
  STONE:
    bevel: 0.25
    shadow: 3
    palette:
      o: "#3A3A3A"
      a: "#7C7C7C"
      b: "#8E8E8E"
      c: "#6A6A6A"
      j: "#555555"
    edge:
      - "oooooooooooooooo"
      - "aabaacaajbbabaca"
      - "abaacabajababcaa"
      - "caababaajaacabab"
      - "jjjjjjjjjjjjjjjj"
      - "oooooooooooooooo"

  # Pixel art: edge rows repeat along each side; "." is transparent.
  ROPE:
    bevel: 0.15
    shadow: 2
    palette:
      d: "#5E4724"
      a: "#C8A96A"
      b: "#8A6B3A"
    edge:
      - "dddd"
      - "abba"
      - "aabb"
      - "baab"
      - "dddd"

  # The corner is drawn at all four corners, mirrored.
  ORNATE:
    bevel: 0.2
    shadow: 3
    palette:
      x: "#E5C34C"
      h: "#F6E08A"
      o: "#8A6B1F"
      d: "#4A3610"
    edge:
      - "dddddddd"
      - "oooooooo"
      - "xhxxxhxx"
      - "xoxxoxxo"
      - "xxxxxxxx"
      - "oooooooo"
    corner:
      - "dddddd"
      - "dooooo"
      - "dohhxx"
      - "dohxox"
      - "doxoxx"
      - "doxxxo"

  # A PNG from plugins/Izomap/frames/, nine-sliced at the inset.
  # CUSTOM:
  #   texture: "my-frame.png"
  #   inset: 8
  #   scale: auto
