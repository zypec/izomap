# Izomap messages in Turkish, in MiniMessage: https://docs.advntr.dev/minimessage/format.html
# Every key is explained in en.yml; how to add a language: https://zypec.github.io/izomap/wiki/#messages

version: 1

prefix: "<#d9a60c><bold>Izomap</bold></#d9a60c> <dark_gray>»</dark_gray> "

