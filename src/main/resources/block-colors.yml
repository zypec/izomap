# ============================================================
#  Izomap - Blok Renk Override'ları
#
#  Bloklar artık Minecraft'ın kendi harita renk sistemini birebir kullanır:
#  her blok için sunucudan "temel renk" (base color) okunur ve çekimde
#  bloğun görünen yüzüne göre vanilla parlaklık çarpanı uygulanır
#  (üst yüz 255, yan yüzler 220 / 180, alt yüz 135).
#  Ayrıntı: https://minecraft.wiki/w/Map_item_format#Base_colors
#
#  Dolayısıyla burada varsayılan bir renk tablosu YOKTUR; bu dosya yalnızca
#  bilinçli olarak değiştirmek istediğin bloklar içindir.
#
#  Değer olarak temel renk adı ya da hex verebilirsin:
#    - Ad  : GRASS, SAND, WOOL, STONE, WATER, WOOD, QUARTZ, COLOR_ORANGE,
#            TERRACOTTA_RED, CRIMSON_STEM, DEEPSLATE, RAW_IRON, GLOW_LICHEN ...
#            (tam liste yukarıdaki wiki sayfasındaki "Base colors" tablosu)
#    - Hex : "#7FB238" (en yakın temel renge eşlenir)
#    - NONE: blok fotoğrafta tamamen saydam olur (ışın arkasını görür)
# ============================================================

version: 2

#  DİKKAT: vanilla'nın temel rengi her zaman bloğa BENZEMEZ. Renk tablosu bloğun
#  dokusundan üretilmiş bir ortalama değil, elle atanmış bir değerdir; bazı bloklarda
#  ikisi ayrışır. En bilineni tuff ailesi: on dört tuff bloğunun tamamı (ve kiraz
#  kütüğü) TERRACOTTA_GRAY (#392923) bildirir — neredeyse siyaha yakın bir kahve —
#  oysa tuff dokusu açık gri-yeşildir. Fotoğrafta vanilla haritayla birebir aynı çıkar,
#  ama bloğa bakan göze yanlış gelir. Düzeltmek istersen aşağıdaki satırları aç:
#  dokunun ortalamasına en yakın temel renkler DEEPSLATE (#646464) ve STONE (#707070).

overrides:
  # Tuff ailesi: vanilla TERRACOTTA_GRAY der, doku açık gri-yeşildir.
  # TUFF: DEEPSLATE
  # TUFF_SLAB: DEEPSLATE
  # TUFF_STAIRS: DEEPSLATE
  # TUFF_WALL: DEEPSLATE
  # POLISHED_TUFF: DEEPSLATE
  # POLISHED_TUFF_SLAB: DEEPSLATE
  # POLISHED_TUFF_STAIRS: DEEPSLATE
  # POLISHED_TUFF_WALL: DEEPSLATE
  # CHISELED_TUFF: DEEPSLATE
  # TUFF_BRICKS: DEEPSLATE
  # TUFF_BRICK_SLAB: DEEPSLATE
  # TUFF_BRICK_STAIRS: DEEPSLATE
  # TUFF_BRICK_WALL: DEEPSLATE
  # CHISELED_TUFF_BRICKS: DEEPSLATE
  # Örnek: cam blokları haritada renksizdir; görünmelerini istersen:
  # GLASS: QUARTZ
  # Örnek: suyu daha koyu göstermek:
  # WATER: COLOR_BLUE
