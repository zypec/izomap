# ============================================================
#  Izomap - Blok Renk Override'ları
#
#  Bloklar artık Minecraft'ın kendi harita renk sistemini birebir kullanır:
#  her blok için sunucudan "temel renk" (base color) okunur ve çekimde
#  bloğun görünen yüzüne göre vanilla parlaklık çarpanı uygulanır
#  (üst yüz 255, yan yüzler 220 / 180, alt yüz 135).
#  Ayrıntı: https://minecraft.wiki/w/Map_item_format#Base_colors
#
#  Dolayısıyla burada varsayılan bir renk tablosu YOKTUR; bu dosya yalnızca
#  bilinçli olarak değiştirmek istediğin bloklar içindir.
#
#  Değer olarak temel renk adı ya da hex verebilirsin:
#    - Ad  : GRASS, SAND, WOOL, STONE, WATER, WOOD, QUARTZ, COLOR_ORANGE,
#            TERRACOTTA_RED, CRIMSON_STEM, DEEPSLATE, RAW_IRON, GLOW_LICHEN ...
#            (tam liste yukarıdaki wiki sayfasındaki "Base colors" tablosu)
#    - Hex : "#7FB238" (en yakın temel renge eşlenir)
#    - NONE: blok fotoğrafta tamamen saydam olur (ışın arkasını görür)
# ============================================================

# Sürüm alanı ileride göç (migration) gerekirse diye duruyor; şu an okunmuyor.
version: 1

#  DİKKAT: vanilla'nın temel rengi her zaman bloğa BENZEMEZ. Renk, bloğun dokusundan
#  üretilmiş bir ortalama değil, elle atanmış bir değerdir. En belirgin örnek tuff
#  ailesiydi: on dört tuff bloğunun tamamı TERRACOTTA_GRAY (#392923, siyaha yakın kahve)
#  bildiriyor, oysa doku ortalaması #6C6D66. Bu blokların rengi artık eklenti tarafından
#  dokusuna en yakın olana çekiliyor (tuff -> DEEPSLATE); kapatmak için
#  config.yml -> settings.correct-vanilla-colors. Buradaki override her ikisini de ezer.
#
#  Aynı düzeltme ÇİÇEKLERİ de kapsıyor: vanilla hepsine PLANT (düz yeşil) verir, eklenti
#  her birine taçyaprağının ölçülmüş rengine en yakın girdiyi verir (gelincik ->
#  CRIMSON_NYLIUM, karahindiba -> COLOR_YELLOW, mor lale -> COLOR_PINK ...). Vanilla
#  haritanın yeşilini geri istiyorsan tek tek buradan yazabilirsin:  POPPY: PLANT

overrides:
  # Örnek: cam blokları haritada renksizdir; görünmelerini istersen:
  # GLASS: QUARTZ
  # Örnek: suyu daha koyu göstermek:
  # WATER: COLOR_BLUE
  # Örnek: ot ve eğrelti tutamları fotoğrafta zeminden ayrışıp gürültü gibi durur —
  # eşleme yanlış olduğu için değil, izometrikte her tutamın bir blok yüzünü komple
  # boyaması yüzünden. NONE vermek ışının arkasını görmesini sağlar, yani renk araziyi
  # kendiliğinden takip eder (çim üstünde çim, podzol üstünde podzol, kar üstünde kar):
  # SHORT_GRASS: NONE
  # TALL_GRASS: NONE
  # FERN: NONE
  # LARGE_FERN: NONE
  # ...ama artık daha iyisi var: aşağıdaki coverage bölümü aynı bloğu hem gösterir hem
  # arkasını gösterir. NONE'a düşürmek yalnızca bloğu fotoğraftan tamamen silmek içindir.

# ============================================================
#  KAPLAMA ORANI (coverage)
#
#  Bir bloğun kendi hücresinin ne kadarını gerçekten doldurduğu: 1.0 = dolu küp
#  (bloklarin neredeyse tamamı), 0.3 = hücrenin üçte biri. Işın ince bloklarda DURMAZ,
#  rengi bu oranla arkasındaki bloğa karıştırıp geçer. 0.0, NONE ile aynı şeydir.
#
#  Eklentinin kendi listesi vardır (ot, eğrelti, çiçek, fide, şeker kamışı, mantar,
#  örümcek ağı → 0.30; sarmaşık, glow lichen, sculk damarı, merdiven, zincir, ray → 0.15)
#  ve buradaki her satır o listeyi EZER. Tümünü kapatmak için config.yml ->
#  photo.coverage.enabled: false.
#
#  Renkler gibi bu liste sunucudan okunamaz: BlockData#getCollisionShape ÇARPIŞMA
#  kutusunu verir, görsel şekli değil — ve tam da dertli bloklarda (ot, çiçek, glow
#  lichen, sarmaşık) o kutu BOŞTUR. Otomatik türetim düzeltmek istediğimiz blokların
#  hepsini kaçırırdı, o yüzden liste elle tutuluyor.
#
#  Listede bilerek OLMAYANLAR:
#    - Yarım bloklar (slab, stairs, duvar, çit): kapladıkları yarı hacim gerçekten
#      taştır; zeminle harmanlamak rengi boşuna soldurur. Rahatsız etmemelerinin sebebi
#      de bu, rengi zaten çevresindeki taşla aynı.
#    - Halı, kar tabakası, nilüfer, redstone tozu: bastıkları YÜZÜ tam kaplarlar, yalnızca
#      yandan bakınca incedirler. Tek bir sayı ikisine de yanlış cevap verir (kar tarlası
#      yeşile çalardı); bunlar yüze duyarlı kaplamayı bekliyor.
#    - Su altı bitkileri (deniz otu, yosun): su sütunu tek parça ölçülür, ortasındaki ince
#      bir hücre o ölçümü ikiye böler. Su için photo.water var.
# ============================================================

coverage:
  # Örnek: otu daha da silik yap (varsayılan 0.30):
  # SHORT_GRASS: 0.2
  # Örnek: buğday tarlası da tutam tutam olsun — varsayılan listede DEĞİL, çünkü
  # vanilla haritada tarla dolu sarı bir alan olarak okunur:
  # WHEAT: 0.4
  # Örnek: bakır zincirler de ince sayılsın (varsayılan listede yalnızca IRON_CHAIN var):
  # COPPER_CHAIN: 0.15
  # WAXED_COPPER_CHAIN: 0.15
  # Örnek: sarmaşığı eski hâline döndür (hücrenin tamamını boyasın):
  # VINE: 1.0
