# Block color overrides. Blocks use Minecraft's own map colors; this file only changes the ones
# you want different. How it works: https://zypec.github.io/izomap/wiki/#block-colors

version: 1

# A map base color name (GRASS, SAND, STONE, COLOR_ORANGE ...), a hex color ("#7FB238", matched
# to the nearest base color) or NONE (the block is invisible and rays see past it).
overrides:
  # GLASS: QUARTZ
  # POPPY: PLANT

# How much of its cell a block fills, 0.0-1.0. Thin blocks blend into what is behind them.
# A line here replaces the built-in value for that block; {top, side} for one lying flat.
coverage:
  # SHORT_GRASS: 0.2
  # WHEAT: 0.4
  # MOSS_CARPET: {top: 1.0, side: 0.1}

# Which biome color a block takes: GRASS, FOLIAGE, WATER or NONE.
tint:
  # MANGROVE_LEAVES: FOLIAGE
  # WATER: NONE
