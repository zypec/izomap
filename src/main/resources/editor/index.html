<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Izomap editor</title>
<script>
try {
  const theme = localStorage.getItem('zypec-theme');
  if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
} catch (unavailable) {}
</script>
<link rel="stylesheet" href="kit/ui/ui.css">
<style>
/* The editor is a phone's camera app: a black body, glass bars floating over it, the world from above on one side
   and the viewfinder on the other, the modes along the foot and the shutter under them. It speaks the design
   language of the site's try-it page. One radius for every corner (--r); the shutter alone is round, as a
   shutter is. The relay serves this page and carries its calls to the plugin through the editor kit's tunnel
   (kit/net/relay.js); with no relay, the plugin serves it and every call carries the link's session key.
   Windows, dropdowns, switches, toasts and the theme of the sheets are the kit's (kit/ui). */
:root{--r:12px;--radius:var(--r);--yellow:#ffd60a;--hud:ui-monospace,SFMono-Regular,Menlo,monospace;
  --accent:#7a5600;--accent-soft:#7a560014;--on-accent:#fff;
  --glass:rgba(40,40,44,.55);--glass-line:rgba(255,255,255,.14);--glass-ink:#f5f5f7;--glass-dim:rgba(245,245,247,.58)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--accent:#e3b12a;--accent-soft:#e3b12a1c;--on-accent:#1a1300}}
:root[data-theme=dark]{--accent:#e3b12a;--accent-soft:#e3b12a1c;--on-accent:#1a1300}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:14px/1.45 var(--sans)}
body{background:#000;color:var(--glass-ink)}
button,input,select,.choicebtn,.choicelist,.iconbtn,.toast,.slotpick,#dialog .sheet,#ask .sheet,kbd{border-radius:var(--r)}
.caps{font:600 10.5px/1 var(--hud);letter-spacing:.1em;text-transform:uppercase;color:var(--glass-dim)}

/* The glass: blurred, faintly lit along its rim, floating over the black. */
.glass{background:var(--glass);border:1px solid var(--glass-line);border-radius:var(--r);backdrop-filter:blur(22px) saturate(1.6);
  -webkit-backdrop-filter:blur(22px) saturate(1.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 8px 24px rgba(0,0,0,.25)}
.glass button,.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:38px;height:36px;padding:0 12px;border:0;
  background:transparent;color:var(--glass-dim);font:500 12px/1 var(--hud);letter-spacing:.05em;cursor:pointer;transition:color .2s,background .25s,opacity .25s}
.glass button:hover,.gbtn:hover{color:var(--glass-ink);background:rgba(255,255,255,.06)}
.glass button[aria-pressed=true]{color:#1a1500;background:var(--yellow)}
.glass button:disabled{opacity:.3;cursor:default}
.glass button svg,.gbtn svg{width:18px;height:18px;flex:none}

.app{display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px 14px;height:100vh;padding:12px 14px 14px}

/* the top: which camera, the quick settings, undo, and the room for the server's settings */
.top{grid-column:1/-1;position:relative;display:flex;align-items:center;gap:10px;min-height:48px}
.brand{font-weight:800;font-size:16px;letter-spacing:-.03em;display:flex;align-items:center;gap:7px;margin-right:4px}
.brand i{width:8px;height:8px;border-radius:50%;background:#ff3b30;box-shadow:0 0 0 3px #ff3b3026}
.pick{display:flex;align-items:center;gap:2px;padding:4px}
.pick .who{color:var(--glass-dim);font:500 12px var(--hud);padding:0 6px 0 8px;white-space:nowrap}
.pick .choice{min-width:150px}
.pick .choicebtn{height:36px;border:0;background:transparent;color:var(--glass-ink);font-weight:600}
.pick .choicebtn:hover{background:rgba(255,255,255,.06)}
.quick{display:flex;align-items:center;gap:2px;padding:4px;margin:0 auto}
.quick button b{font-weight:500;color:var(--glass-ink);text-transform:uppercase;letter-spacing:.06em}
.quick button[aria-pressed=true] b{color:#1a1500}
.quick button[aria-expanded=true]{box-shadow:inset 0 0 0 1px var(--yellow)}
/* The filters as the site's front page has them: an island, each filter an icon, the chosen one named on yellow. */
.filterisland{position:relative;display:flex;align-items:center;gap:2px;padding:5px;border-radius:var(--r);background:var(--sunk);overflow-x:auto;scrollbar-width:none}
.filterisland .glide{position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:calc(var(--r) - 3px);background:var(--yellow);
  transition:transform .42s cubic-bezier(.3,1.3,.5,1),width .42s cubic-bezier(.3,1.3,.5,1);pointer-events:none}
.filterisland button{position:relative;display:inline-flex;align-items:center;height:38px;padding:0 10px;border:0;background:none;color:var(--dim);flex:none;transition:color .3s}
.filterisland button:hover{color:var(--ink);background:none}
.filterisland button[aria-pressed=true]{color:#1a1500}
.filterisland button:disabled{opacity:.35}
.filterisland svg{width:18px;height:18px;flex:none}
.filterisland .label{max-width:0;opacity:0;overflow:hidden;white-space:nowrap;font:500 12px/1 var(--hud);letter-spacing:.05em;text-transform:uppercase;
  transition:max-width .42s cubic-bezier(.2,.8,.2,1),opacity .25s,margin .42s}
.filterisland button[aria-pressed=true] .label{max-width:var(--w,120px);opacity:1;margin-left:8px}
.slotpick.izpop.wide{width:min(520px,calc(100vw - 16px))}
.presets{display:grid;gap:6px;margin-top:8px}
.preset{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:2px 10px;text-align:left;padding:8px 10px}
.preset b{font-size:13px}
.preset small{grid-column:1/3;color:var(--dim);font-size:12px}
.preset code{grid-row:1/3;grid-column:3;font:12px var(--hud);color:var(--dim)}
.preset.on{border-color:var(--accent);background:var(--accent-soft)}
.depth{display:flex;justify-content:space-between;gap:8px;margin:2px 2px 6px;font:11.5px var(--hud);color:var(--dim)}
.depth b{color:var(--ink);font-weight:600}
.right{display:flex;align-items:center;gap:6px}
.right .glass{display:flex;padding:4px;gap:2px}

/* the island: shown while a photo is shot, grown to say where it is in line and how far along */
#island{position:fixed;left:50%;top:6px;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:10px;
  height:30px;max-width:220px;padding:0 14px 0 11px;border-radius:var(--r);background:#000;color:#f2f2f4;overflow:hidden;
  box-shadow:0 10px 30px -12px #000c,inset 0 0 0 1px #ffffff1a;white-space:nowrap;pointer-events:none;
  transition:max-width .45s cubic-bezier(.2,.9,.2,1),height .45s cubic-bezier(.2,.9,.2,1),padding .45s,background-color .3s,opacity .3s}
#island.idle{opacity:0}
#island .dot{width:7px;height:7px;border-radius:50%;background:#30d158;flex:none}
#island .what{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
#island .aside{font:11.5px var(--hud);color:#a1a1aa}
#island .ring{display:none;width:22px;height:22px;flex:none}
#island .ring circle{fill:none;stroke-width:3}
#island .ring .track{stroke:#ffffff26}
#island .ring .fill{stroke:var(--yellow);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .35s ease}
#island .bar{position:absolute;left:14px;right:14px;bottom:7px;height:3px;border-radius:2px;background:#ffffff1f;overflow:hidden;opacity:0;transition:opacity .3s}
#island .bar i{display:block;height:100%;width:0;background:var(--yellow);transition:width .35s ease}
#island .tick{display:none;width:20px;height:20px;border-radius:50%;background:#30d158;color:#04210d;font-weight:800;font-size:13px;line-height:20px;text-align:center;flex:none}
#island .thumb{display:none;width:44px;height:28px;border-radius:6px;object-fit:cover;flex:none}
#island.busy{max-width:420px;height:52px;padding:0 20px 8px 14px}
#island.busy .ring{display:block}
#island.busy .dot{display:none}
#island.busy .bar{opacity:1}
#island.done{max-width:440px;height:46px}
#island.done .dot{display:none}
#island.done .tick{display:block;animation:tick .5s cubic-bezier(.2,1.6,.4,1)}
#island.done .thumb[src]{display:block}
#island.bad{max-width:480px;height:46px;background:#3a0d0b}
#island.bad .dot{background:#ff453a}
#island.queued .ring .fill{stroke:#a1a1aa}
#island.waiting .ring{animation:spin 1.1s linear infinite}
@keyframes tick{0%{transform:scale(0)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes spin{to{transform:rotate(1turn)}}

/* the world from above */
.screen{position:relative;min-height:0;border-radius:calc(var(--r) + 6px);padding:6px;background:#0b0b0c;box-shadow:inset 0 0 0 1px #ffffff12}
.lcd{position:relative;width:100%;height:100%;overflow:hidden;border-radius:var(--r);background:#0a0a0b;cursor:grab;touch-action:none}
.lcd.dragging{cursor:grabbing}
.lcd.placing{cursor:crosshair}
.lcd canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.lcd .glass{position:absolute;z-index:2;display:flex;gap:2px;padding:4px}
#tools{top:10px;left:10px}
#zoomkeys{right:10px;bottom:10px}
#zoomkeys button{font-size:16px;min-width:36px;padding:0}
.lcdtext{position:absolute;z-index:2;font:500 11.5px/1 var(--hud);color:#c7c7cc;letter-spacing:.04em;text-shadow:0 1px 2px #000;pointer-events:none}
#coords{left:14px;bottom:18px}
#hint{left:14px;top:60px;color:#a1a1aa}
#mapbusy{position:absolute;right:16px;top:18px;z-index:2}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.2);border-top-color:var(--yellow);
  animation:spin .8s linear infinite;opacity:0;transition:opacity .2s;pointer-events:none}
.spin.on{opacity:1}
#zoomtip{position:absolute;z-index:3;pointer-events:none;padding:4px 8px;border-radius:var(--r);background:#000c;color:var(--yellow);font:600 12px var(--hud);display:none}

/* the side: the viewfinder held in place at the top, the dials and the look under it */
.side{min-height:0;overflow-y:auto;scrollbar-width:thin;display:flex;flex-direction:column;gap:12px}
.finder{position:sticky;top:0;z-index:5;flex:none;padding-bottom:2px;background:#000}
/* A tall photo is held to a part of the window's height and narrowed to its ratio, so the settings keep their room. */
.stage{--ar:1.7778;width:min(100%,calc(42vh * var(--ar)));margin:0 auto;position:relative;border-radius:var(--r);overflow:hidden;background:conic-gradient(#1d1d20 25%,#141416 0 50%,#1d1d20 0 75%,#141416 0) 0 0/22px 22px}
.stage img{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;transition:opacity .3s,filter .3s}
.stage img:not([src]){visibility:hidden}
.stage.loading img{opacity:.6;filter:saturate(.6)}
.stage .spin{position:absolute;right:12px;top:12px}
.thirds{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,transparent calc(33.33% - .5px),#fff9 calc(33.33% - .5px) calc(33.33% + .5px),transparent 0,transparent calc(66.66% - .5px),#fff9 calc(66.66% - .5px) calc(66.66% + .5px),transparent 0),
  linear-gradient(transparent calc(33.33% - .5px),#fff9 calc(33.33% - .5px) calc(33.33% + .5px),transparent 0,transparent calc(66.66% - .5px),#fff9 calc(66.66% - .5px) calc(66.66% + .5px),transparent 0)}
.hud{position:absolute;left:0;right:0;padding:0 12px;display:flex;gap:14px;font:500 11px/1 var(--hud);letter-spacing:.07em;
  text-transform:uppercase;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);pointer-events:none}
.hud.top{top:12px}.hud.foot{bottom:12px}
.hud span{opacity:.75}.hud b{font-weight:500;margin-left:6px;color:var(--yellow)}
#panel{display:grid;gap:12px}
.card{padding:12px 14px}
.card > header{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dial{display:grid;grid-template-columns:70px minmax(0,1fr) 64px;align-items:center;gap:10px;margin:4px 0}
.dial label{color:var(--glass-dim);font-size:12.5px}
.dial input.num{padding:4px 7px;font:13px var(--hud);text-align:right;background:rgba(0,0,0,.35);border-color:var(--glass-line);color:var(--glass-ink)}
.card .dial input[type=range]{--ink:#f5f5f7}
.rows{display:grid}
.row{display:flex;align-items:center;gap:10px;width:100%;padding:10px 4px;border:0;border-bottom:1px solid var(--glass-line);border-radius:0;
  background:transparent;color:var(--glass-ink);text-align:left;cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:rgba(255,255,255,.04)}
.row span{flex:1}
.row b{font-weight:500;color:var(--glass-dim);max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.on b{color:var(--yellow)}
.row .chev{background:var(--glass-dim);transform:rotate(-90deg)}
.row[aria-expanded=true] .chev{background:var(--yellow);transform:rotate(90deg)}

/* boxes, the move bubble and the sheets, in the kit's look */
.slotpick.izpop{width:300px}
.izpop h4{margin:2px 2px 8px;font-size:13px}
.izpop .dial{grid-template-columns:64px minmax(0,1fr) 54px}
.izpop .dial label{color:var(--dim)}
.izpop .dial input.num{background:var(--bg);color:var(--ink);border-color:var(--line)}
.opts{display:grid;gap:2px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;border-color:transparent;background:transparent;padding:7px 9px}
.opt.on{color:var(--accent);font-weight:600;background:var(--accent-soft)}
.opt .lock{font:11px var(--hud);color:var(--faint)}
.hint{color:var(--dim);font-size:12px;margin:6px 2px}
.suggest{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.line{display:flex;align-items:center;gap:8px;margin:4px 0 8px}
.switch .word{display:none}
.xyz{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:6px 0 8px}
.xyz label{display:grid;gap:3px;font:600 10.5px var(--hud);color:var(--faint)}
.xyz input{font:12.5px var(--hud);padding:6px 8px}

/* the foot: the modes, then the last photo, the shutter, the layout, save and copy */
.deck{grid-column:1/-1;display:grid;gap:8px}
.modes{position:relative;height:30px;overflow:hidden;touch-action:pan-y;
  mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent)}
.modes .track{position:absolute;left:50%;top:0;display:flex;gap:28px;transition:transform .45s cubic-bezier(.2,.9,.25,1)}
.modes button{border:0;background:none;padding:8px 2px;color:var(--glass-dim);font:500 13px/1 var(--hud);letter-spacing:.14em;
  text-transform:uppercase;cursor:pointer;transition:color .3s;white-space:nowrap}
.modes button[aria-pressed=true]{color:var(--yellow)}
.controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding:0 6px}
.last{justify-self:start;display:flex;align-items:center;gap:10px;padding:0;border:0;background:transparent;color:var(--glass-ink);text-align:left;cursor:pointer}
.last img{width:58px;height:58px;border-radius:var(--r);border:2px solid rgba(255,255,255,.75);object-fit:cover;background:#1b1b1d;opacity:.35;transition:opacity .3s}
.last img[src]{opacity:1}
.last.pop img{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.last b{display:block;font-size:12.5px}
.last small{color:var(--glass-dim);font:11px var(--hud)}
.shutter{width:76px;height:76px;border-radius:50%;border:4px solid #fff;background:transparent;padding:4px;cursor:pointer}
.shutter span{display:block;width:100%;height:100%;border-radius:50%;background:#fff;transition:transform .12s,background .2s,border-radius .2s}
.shutter:active span{transform:scale(.88)}
.shutter.busy span{background:#ff3b30;transform:scale(.55);border-radius:var(--r)}
.shutter:disabled{opacity:.4}
.outs{justify-self:end;display:flex;align-items:center;gap:8px}
.outs .choice{min-width:132px}
.outs .choicebtn{height:44px;background:var(--glass);border-color:var(--glass-line);color:var(--glass-ink)}
.outs .gbtn{flex-direction:column;height:44px;min-width:56px;padding:4px 10px;gap:2px;border:1px solid var(--glass-line);background:var(--glass);font-size:10px;text-transform:uppercase}
.outs .gbtn svg{width:16px;height:16px}
.outs .gbtn:disabled{opacity:.35;cursor:default}
.gbtn.busy,.iconbtn.busy{opacity:.55;pointer-events:none}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:60}
.flash.go{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:.8}100%{opacity:0}}

/* the sheets: the camera's photos on the left, the server's settings on the right */
.sheet{position:fixed;z-index:22;top:70px;bottom:150px;width:min(440px,calc(100vw - 48px));display:flex;flex-direction:column;
  border-radius:calc(var(--r) + 6px);background:var(--raise);color:var(--ink);border:1px solid var(--line);box-shadow:0 30px 60px -20px #000a;
  transition:transform .42s cubic-bezier(.2,.9,.2,1)}
#gallery{left:20px;transform:translateX(-115%)}
#settings{right:20px;width:min(580px,calc(100vw - 48px));transform:translateX(115%)}
#gallery.open,#settings.open{transform:none}
.sheet > header{display:flex;align-items:center;gap:8px;padding:14px 16px 10px}
.sheet .list{overflow-y:auto;padding:0 16px 16px;display:grid;gap:14px;align-content:start;flex:1}
.photo{display:grid;grid-template-columns:128px minmax(0,1fr);gap:12px;align-items:start}
.photo .thumb{width:128px;height:80px;border-radius:var(--r);background:var(--sunk);object-fit:contain;image-rendering:pixelated}
.photo .thumb:not([src]){visibility:hidden}
.photo b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.photo small{color:var(--faint);font:11px var(--hud)}
.photo .acts{display:flex;align-items:center;gap:4px;margin-top:8px}
.photo .acts .choice{flex:1;min-width:0}
.photo .acts .choicebtn{padding:4px 8px;font-size:12px}
/* A frame in the list is drawn round its own name, as it will be round the photo. */
.framepic{display:grid;place-items:center;width:180px;height:48px;margin:3px 0;border-radius:3px;background:center/100% 100% no-repeat;
  image-rendering:pixelated;color:#fff;font-size:12px;font-weight:600;text-shadow:0 1px 2px #000}
.framepic.none{background:var(--sunk);color:var(--dim);text-shadow:none}
.choicenow .framepic{width:120px;height:30px;margin:0;font-size:11px}
.choicelist .choiceopt{padding:4px 6px}
#settings .find{margin:0 16px 8px;width:auto}
.group{display:grid;gap:2px}
.group > h4{margin:8px 0 4px;font:600 11px var(--hud);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.setting{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:6px 12px;align-items:center;padding:8px 10px;border-radius:var(--r)}
.setting:hover{background:var(--sunk)}
.setting.changed{background:var(--accent-soft)}
.setting code{font:12px var(--hud);color:var(--ink);word-break:break-all}
.setting p{grid-column:1/-1;margin:0;color:var(--dim);font-size:12px}
.setting .detail{grid-column:1/-1;margin:0;color:var(--dim);font-size:12px;display:none;white-space:pre-line}
.setting.open .detail{display:block}
.setting .ctl{display:flex;align-items:center;gap:4px;justify-content:flex-end}
.setting .ctl input:not([type=checkbox]){width:100%;padding:5px 8px;font:12.5px var(--hud)}
.setting .ctl .choice{width:100%}
.pending{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}

.gate{position:fixed;inset:0;display:none;place-items:center;background:#000;text-align:center;padding:24px;z-index:50}
.gate.on{display:grid}
.gate p{color:var(--glass-dim);max-width:460px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
@media (min-width:981px){#toasts{left:calc((100% - 414px) / 2);bottom:150px;width:min(560px,calc(100vw - 480px))}}
@media (max-width:980px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto 52vh auto;height:auto}
  .side{display:contents}
  .finder{grid-row:2;position:sticky;top:0}
  .screen{grid-row:3}
  .deck{position:sticky;bottom:0;background:#000;padding:6px 0 10px;z-index:6}
  .last span,#hint,#coords,.quick .word{display:none}
  .quick{margin:0}
  .top{flex-wrap:wrap}
  .outs .choice{min-width:96px}
  .sheet{left:10px!important;right:10px!important;width:auto!important;top:10px;bottom:10px}
}
@media (prefers-reduced-motion:reduce){#island,#island *,.modes .track,.sheet{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="gate" id="gate"><div><h2 id="gate-title">This link has ended</h2><p id="gate-why">Run /izocam editor in the game for a new one.</p></div></div>
<div class="flash" id="flash"></div>
<div id="island" class="idle" role="status" aria-live="polite">
  <span class="dot"></span>
  <svg class="ring" viewBox="0 0 24 24"><circle class="track" cx="12" cy="12" r="9"/><circle class="fill" cx="12" cy="12" r="9" stroke-dasharray="56.5" stroke-dashoffset="56.5"/></svg>
  <span class="tick">✓</span><img class="thumb" alt="">
  <span class="what" id="islandwhat"></span><span class="aside" id="islandaside"></span>
  <span class="bar"><i></i></span>

}

}

}

}

/* --- the server's settings: config.yml, changed here, applied together --- */
let settingsNow = [], pendingValues = {}, settingsOpen = null;
$('opensettings').onclick = async () => {
  try { settingsNow = (await api('config')).settings; drawSettings(); openSheet('settings', true); $('settingsfind').focus(); }
  catch (e) { failed(e); }
};
$('closesettings').onclick = () => openSheet('settings', false);
$('settingsfind').oninput = () => drawSettings();
/** The wiki's words, as plain text: code without its marks, a link as its words. */
const words = text => esc(String(text || '').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')).replace(/`([^`]+)`/g, '<code>$1</code>');

function control(s) {
  const v = valueOf(s), attr = `data-key="${esc(s.key)}"`;
  if (s.kind === 'boolean') return switchField(null, v, attr);
  if (s.choices) return select2(attr, s.choices, String(v));
  const range = s.min !== undefined ? ` placeholder="${s.min} to ${s.max}"` : '';
  return `<input ${attr} value="${esc(v)}"${range} inputmode="${s.kind === 'text' ? 'text' : 'decimal'}" spellcheck="false">`;
}
function drawSettings() {
  const find = $('settingsfind').value.trim().toLowerCase(), root = $('settinglist');
  const groups = new Map();
  for (const s of settingsNow) {
    if (find && !(s.key + ' ' + s.summary).toLowerCase().includes(find)) continue;
    const group = s.key.split('.')[0];
    if (!groups.has(group)) groups.set(group, []);
    groups.get(group).push(s);
  }
  root.innerHTML = [...groups].map(([group, list]) => `<div class="group"><h4>${esc(group)}</h4>` + list.map(s => {
    const off = JSON.stringify(valueOf(s)) !== JSON.stringify(s.default);
    return `<div class="setting${pendingHas(s.key) ? ' changed' : ''}${settingsOpen === s.key ? ' open' : ''}">
      <code>${esc(s.key)}</code><div class="ctl">${control(s)}${off ? iconButton('reset', `data-default="${esc(s.key)}"`, 'tiny', `Back to the default, ${s.default}`) : ''}</div>
      <p>${words(s.summary)}${s.detail ? ` <a href="#" data-more="${esc(s.key)}">More</a>` : ''}</p>${s.detail ? `<div class="detail">${words(s.detail)}</div>` : ''}</div>`;
  }).join('') + '</div>').join('') || '<div class="note">No setting matches.</div>';
  wireChoices(root); wireSwitches(root);
  for (const field of root.querySelectorAll('[data-key]')) field.onchange = () => {
    const s = settingsNow.find(x => x.key === field.dataset.key);
    const typed = s.kind === 'boolean' ? field.checked : s.kind === 'text' ? field.value : field.value.trim() === '' ? NaN : Number(field.value);
    if (typeof typed === 'number' && (!Number.isFinite(typed) || (s.min !== undefined && (typed < s.min || typed > s.max)))) {
      toast('bad', s.min !== undefined ? `${s.key} goes from ${s.min} to ${s.max}` : `${s.key} is a number`); drawSettings(); return;
    }
    if (s.kind === 'integer' && !Number.isInteger(typed)) { toast('bad', `${s.key} is a whole number`); drawSettings(); return; }
    edit(s.key, typed);
  };
  for (const b of root.querySelectorAll('[data-default]')) b.onclick = () => { const s = settingsNow.find(x => x.key === b.dataset.default); edit(s.key, s.default); };
  for (const a of root.querySelectorAll('[data-more]')) a.onclick = e => { e.preventDefault(); settingsOpen = settingsOpen === a.dataset.more ? null : a.dataset.more; drawSettings(); };

  put(value);
  remember({label: `changing ${key}`,
    undo: async () => { openSheet('settings', true); if (had) put(was); else { delete pendingValues[key]; drawSettings(); } },
    redo: async () => { openSheet('settings', true); put(value); }});

async function applySettings(values, record) {
  const before = {};

  $('apply').classList.add('busy');
  try {
    const answer = await api('config', {method: 'PATCH', body: {values}});
    settingsNow = answer.settings;
    for (const k of Object.keys(values)) delete pendingValues[k];
    drawSettings();
    islandDone('Applied', `${answer.applied.length} setting${answer.applied.length === 1 ? '' : 's'}, reloaded`);
    if (record) remember({label: 'applying the settings', undo: () => applySettings(before, false), redo: () => applySettings(values, false)});
    // Settings shape what the editor offers and how the world is drawn, so it asks again.
    const state = await api('state' + (console_ ? `?world=${encodeURIComponent(console_.world)}` : ''));

}

/* --- keys --- */
const KEYS = [
  ['← →', 'Turn the camera (Shift: 15° at a time)'], ['↑ ↓', 'Tilt it'], ['+ −', 'Zoom the camera in and out'],
  ['Space', 'Take the photo'], ['Ctrl+Z', 'Undo'], ['Ctrl+Shift+Z', 'Redo'], ['T', 'Rule of thirds'], ['P', 'Place a camera'],

}
let nudgeTimer = null, nudged = {}, nudgedFrom = null;
function nudge(fields) {
  const c = selected;

  if (fields.yaw !== undefined) turn(c, fields.yaw);
  Object.assign(c, fields);
  Object.assign(nudged, fields);
  drawMarks(); refresh();
  clearTimeout(nudgeTimer);
  nudgeTimer = setTimeout(() => {
    const sent = nudged, was = nudgedFrom;

    change({...sent, ...(sent.yaw !== undefined || sent.pitch !== undefined ? {orbit: true} : {})}, 'aiming with the keys', was);
  }, 300);
}

  if ((e.metaKey || e.ctrlKey) && !typing && (e.key === 'z' || e.key === 'Z' || e.key === 'y')) { e.preventDefault(); step(!(e.shiftKey || e.key === 'y')); return; }
  if (typing || dialogOpen || asking || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '?') { e.preventDefault(); return showKeys(); }
  if (e.key === 'Escape') { closeSlotPick(); openSheet('gallery', false); openSheet('settings', false); if (mode) setMode(mode); return; }
  if (e.key === 'p' || e.key === 'P') return setMode('place');
  if (!selected) return;
  const by = e.shiftKey ? 15 : 5;
  const keys = {
    ArrowLeft: () => nudge({yaw: Math.round(selected.yaw - by)}), ArrowRight: () => nudge({yaw: Math.round(selected.yaw + by)}),
    ArrowUp: () => nudge({pitch: Math.min(90, selected.pitch + (e.shiftKey ? 10 : 2))}), ArrowDown: () => nudge({pitch: Math.max(-10, selected.pitch - (e.shiftKey ? 10 : 2))}),
    '+': () => nudge({zoom: Math.min(ZOOM_MAX, selected.zoom * 1.25)}), '=': () => nudge({zoom: Math.min(ZOOM_MAX, selected.zoom * 1.25)}),
    '-': () => nudge({zoom: Math.max(ZOOM_MIN, selected.zoom / 1.25)}),
    ' ': () => takePhoto(),
    t: () => change({thirds: !selected.thirds}, 'the rule of thirds'), T: () => change({thirds: !selected.thirds}, 'the rule of thirds'),
    g: () => openSheet('gallery', !$('gallery').classList.contains('open')), G: () => openSheet('gallery', !$('gallery').classList.contains('open')),
    m: () => setMode('move'), M: () => setMode('move'),
    '[': () => pickNext(-1), ']': () => pickNext(1),
  };
  if (keys[e.key]) { e.preventDefault(); keys[e.key](); }
});
function pickNext(by) {
  if (!cameras.length) return;
  const next = cameras[(cameras.indexOf(selected) + by + cameras.length) % cameras.length];
  choose(next.id); goTo(next);
}

async function enter(world) {
  try {
    const state = await api('state' + (world ? `?world=${encodeURIComponent(world)}` : ''));
    options = state.options; cameras = state.cameras; me = {x: state.x, z: state.z};
    selected = null; worldKey = state.world; tiles.clear(); tileQueue = [];
    $('opensettings').hidden = !options.may.config;
    if (state.console) {
      console_ = {world: state.world, worlds: state.worlds, owners: state.owners, owner: console_ && console_.owner};
      $('who').textContent = 'Console';
      $('worldpick').innerHTML = select('worldsel', state.worlds, state.world);
      wireChoices($('worldpick'));
      $('worldsel').onchange = () => enter($('worldsel').value);
    } else $('who').textContent = `${state.player}, ${state.world}`;
    $('panel').innerHTML = ''; $('finder').hidden = $('foot').hidden = true;
    view.x = me.x; view.z = me.z; view.size = 256;
    cameraPicker(); paintHistory();
    if (cameras.length) { choose(cameras[0].id); goTo(cameras[0], true); } else redraw();
  } catch (e) { failed(e); }
}

if (!tunneled) enter();
else {
  let entered = false;
  relay.on('hello', () => { $('gate').classList.remove('on'); if (!entered) { entered = true; enter(); } });
  relay.on('lost', () => gate('Connecting', 'Waiting for your server...'));
  relay.on('back', () => $('gate').classList.remove('on'));
  relay.on('refused', text => gate('This link has ended', text));
  gate('Connecting', 'Waiting for your server...');
  relay.start();
}
</script>
