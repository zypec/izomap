<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Izomap editor</title>
<script>
try {
  const theme = localStorage.getItem('zypec-theme');
  if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
} catch (unavailable) {}
</script>
<link rel="stylesheet" href="kit/ui/ui.css">
<style>
/* The editor as a camera: the world from above is its screen, the photo it will take shows in its viewfinder,
   the dials and modes beside it, the shutter on the deck below, and an island on top that grows while a photo
   is being shot. The relay serves this page and carries its calls to the plugin through the editor kit's tunnel
   (kit/net/relay.js); with no relay, the plugin serves it and every call carries the session key from the link.
   Windows, dropdowns, switches, toasts and the theme are the kit's (kit/ui). */
:root{--accent:#7a5600;--accent-soft:#7a560014;--on-accent:#fff;--sky:#ffd60a;
  --body:linear-gradient(180deg,#ecebe8,#dedcd7);--panel:#f7f6f3cc;--glass:rgba(255,255,255,.62);--glass-line:rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--accent:#e3b12a;--accent-soft:#e3b12a1c;--on-accent:#1a1300;
  --body:linear-gradient(180deg,#19191b,#0e0e10);--panel:#1b1b1ecc;--glass:rgba(38,38,42,.66);--glass-line:rgba(255,255,255,.09)}}
:root[data-theme=dark]{--accent:#e3b12a;--accent-soft:#e3b12a1c;--on-accent:#1a1300;
  --body:linear-gradient(180deg,#19191b,#0e0e10);--panel:#1b1b1ecc;--glass:rgba(38,38,42,.66);--glass-line:rgba(255,255,255,.09)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;color:var(--ink);font:14px/1.45 var(--sans)}
body{background:var(--body)}
.mono{font-family:var(--mono)}
.caps{font:600 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}

.camera{display:grid;grid-template-columns:minmax(0,1fr) 392px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;height:100vh;padding:12px}

/* the top: brand, the cameras, the island, the world and the theme */
.top{grid-column:1/-1;position:relative;display:flex;align-items:center;gap:10px;min-height:44px}
.brand{font-weight:800;font-size:17px;letter-spacing:-.03em;display:flex;align-items:center;gap:7px}
.brand i{width:9px;height:9px;border-radius:50%;background:#ff3b30;box-shadow:0 0 0 3px #ff3b3026}
.cams{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:38vw}
.cams button{flex:none;display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:12.5px;background:var(--glass);border-color:var(--glass-line)}
.cams button small{color:var(--faint);font:11px var(--mono)}
.cams button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.who{color:var(--dim);font-size:12.5px;white-space:nowrap}
#worldpick .choicebtn{padding:3px 9px;font-size:12px;border-radius:999px;background:var(--glass)}
.top .themebtn,.top .iconbtn{background:var(--glass)}

/* the island: a pill that says which camera is on, and grows while a photo is shot */
#island{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;display:flex;align-items:center;gap:10px;
  height:36px;max-width:300px;padding:0 16px 0 12px;border-radius:999px;background:#0c0c0e;color:#f2f2f4;overflow:hidden;
  box-shadow:0 10px 30px -12px #0009,inset 0 0 0 1px #ffffff14;white-space:nowrap;cursor:default;
  transition:max-width .45s cubic-bezier(.2,.9,.2,1),height .45s cubic-bezier(.2,.9,.2,1),padding .45s,border-radius .45s,background-color .3s}
#island .dot{width:8px;height:8px;border-radius:50%;background:#30d158;flex:none;transition:background .3s}
#island .what{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
#island .aside{font:11.5px var(--mono);color:#a1a1aa}
#island .ring{display:none;width:22px;height:22px;flex:none}
#island .ring circle{fill:none;stroke-width:3}
#island .ring .track{stroke:#ffffff26}
#island .ring .fill{stroke:var(--sky);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .35s ease}
#island .bar{position:absolute;left:14px;right:14px;bottom:7px;height:3px;border-radius:2px;background:#ffffff1f;overflow:hidden;opacity:0;transition:opacity .3s}
#island .bar i{display:block;height:100%;width:0;background:var(--sky);border-radius:2px;transition:width .35s ease}
#island .tick{display:none;width:20px;height:20px;border-radius:50%;background:#30d158;color:#04210d;font-weight:800;font-size:13px;line-height:20px;text-align:center;flex:none}
#island .thumb{display:none;width:44px;height:28px;border-radius:5px;object-fit:cover;flex:none}
#island.busy{max-width:420px;height:52px;padding:0 20px 8px 14px;border-radius:26px}
#island.busy .ring{display:block}
#island.busy .dot{display:none}
#island.busy .bar{opacity:1}
#island.done{max-width:420px;height:46px;border-radius:23px}
#island.done .dot{display:none}
#island.done .tick{display:block;animation:tick .5s cubic-bezier(.2,1.6,.4,1)}
#island.done .thumb[src]{display:block}
#island.bad{max-width:460px;height:46px;border-radius:23px;background:#3a0d0b}
#island.bad .dot{background:#ff453a}
#island.queued .ring .fill{stroke:#a1a1aa}
@keyframes tick{0%{transform:scale(0)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes spin{to{transform:rotate(1turn)}}
#island.waiting .ring{animation:spin 1.1s linear infinite}
@media (prefers-reduced-motion:reduce){#island,#island *{transition:none!important;animation:none!important}}

/* the screen: the world from above, in a bezel */
.screen{position:relative;min-height:0;border-radius:22px;padding:10px;background:#050506;
  box-shadow:inset 0 0 0 1px #ffffff10,0 24px 50px -30px #000c,0 0 0 1px #0000004d}
.lcd{position:relative;width:100%;height:100%;overflow:hidden;border-radius:14px;background:#0a0a0b;cursor:grab;touch-action:none}
.lcd::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:14px;
  background:linear-gradient(155deg,#ffffff0f 0%,transparent 28%);box-shadow:inset 0 0 0 1px #ffffff12}
.lcd.dragging{cursor:grabbing}
.lcd.placing{cursor:crosshair}
.lcd canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.glassbar{position:absolute;z-index:2;display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(18,18,20,.66);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.12)}
.glassbar button{height:32px;padding:0 13px;border:0;border-radius:999px;background:transparent;color:#c7c7cc;
  font:600 11.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.glassbar button:hover{color:#fff;background:transparent}
.glassbar button[aria-pressed=true]{background:var(--sky);color:#1a1500}
.glassbar button:disabled{opacity:.4}
#tools{top:12px;left:12px}
#zoomkeys{right:12px;bottom:12px}
#zoomkeys button{width:32px;padding:0;font-size:16px}
.lcdtext{position:absolute;z-index:2;font:500 11.5px/1 var(--mono);color:#c7c7cc;letter-spacing:.04em;text-shadow:0 1px 2px #000}
#coords{left:16px;bottom:20px}
#hint{left:16px;top:58px;color:#a1a1aa}
#mapbusy{position:absolute;right:16px;top:20px;z-index:2}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.2);border-top-color:var(--sky);
  animation:spin .8s linear infinite;opacity:0;transition:opacity .2s;pointer-events:none}
.spin.on{opacity:1}
#zoomtip{position:absolute;z-index:3;pointer-events:none;padding:3px 8px;border-radius:6px;background:#000c;color:var(--sky);font:600 12px var(--mono);display:none}

/* the side: viewfinder, dials, modes */
.side{min-height:0;display:flex;flex-direction:column;gap:12px;overflow-y:auto;scrollbar-width:thin;padding-right:2px}
.finder{flex:none;padding:10px;border-radius:20px;background:#09090a;box-shadow:inset 0 0 0 1px #ffffff12,0 18px 40px -26px #000c}
.finder .eye{position:relative;border-radius:12px;overflow:hidden;background:conic-gradient(#ffffff08 25%,#ffffff12 0 50%,#ffffff08 0 75%,#ffffff12 0) 0 0/18px 18px}
.finder img{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;transition:opacity .25s,filter .25s}
.finder img:not([src]){visibility:hidden}
.finder.loading img{opacity:.6;filter:saturate(.6)}
.finder .af{position:absolute;inset:10%;pointer-events:none;
  background:linear-gradient(var(--sky),var(--sky)) top left/16px 2px,linear-gradient(var(--sky),var(--sky)) top left/2px 16px,
  linear-gradient(var(--sky),var(--sky)) top right/16px 2px,linear-gradient(var(--sky),var(--sky)) top right/2px 16px,
  linear-gradient(var(--sky),var(--sky)) bottom left/16px 2px,linear-gradient(var(--sky),var(--sky)) bottom left/2px 16px,
  linear-gradient(var(--sky),var(--sky)) bottom right/16px 2px,linear-gradient(var(--sky),var(--sky)) bottom right/2px 16px;
  background-repeat:no-repeat;opacity:.55}
.finder .spin{position:absolute;right:10px;top:10px}
.thirds{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,transparent calc(33.33% - .5px),#fff9 calc(33.33% - .5px) calc(33.33% + .5px),transparent 0,transparent calc(66.66% - .5px),#fff9 calc(66.66% - .5px) calc(66.66% + .5px),transparent 0),
  linear-gradient(transparent calc(33.33% - .5px),#fff9 calc(33.33% - .5px) calc(33.33% + .5px),transparent 0,transparent calc(66.66% - .5px),#fff9 calc(66.66% - .5px) calc(66.66% + .5px),transparent 0)}
.finder .readout{display:flex;align-items:center;gap:8px;padding:8px 4px 0;font:11.5px var(--mono);color:#a1a1aa}
.finder .readout .iconbtn{background:#ffffff12;color:#c7c7cc}
.finder .readout .iconbtn.on{background:var(--sky);color:#1a1500}
.finder .tag{color:var(--sky);font-weight:600;letter-spacing:.08em}

.card{border-radius:16px;background:var(--panel);border:1px solid var(--glass-line);padding:12px 14px;backdrop-filter:blur(10px)}
.card > header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.dial{display:grid;grid-template-columns:70px minmax(0,1fr) 64px;align-items:center;gap:10px;margin:3px 0}
.dial label{color:var(--dim);font-size:12.5px}
.dial input.num{padding:3px 6px;font:13px var(--mono);text-align:right;background:transparent;border-color:var(--glass-line)}
.dial input[type=range]{background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 10%) center/100% 8px no-repeat}
.xyz{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:6px;margin-top:8px}
.xyz input{font:12px var(--mono);padding:5px 7px}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.chip{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:8px 11px;border-radius:11px;text-align:left;min-width:0;background:var(--raise)}
.chip small{font:600 10px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.chip span{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chip.on span{color:var(--accent);font-weight:600}
.chip[aria-expanded=true]{border-color:var(--accent)}
.slotpick.izpop{width:300px;border-radius:14px}
.izpop h4{margin:2px 2px 8px;font-size:13px}
.izpop .dial{grid-template-columns:64px minmax(0,1fr) 54px}
.opts{display:grid;gap:2px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;border-color:transparent;background:transparent;padding:6px 8px}
.opt.on{color:var(--accent);font-weight:600;background:var(--accent-soft)}
.opt .lock{font:11px var(--mono);color:var(--faint)}
.hint{color:var(--dim);font-size:12px;margin:6px 2px}
.suggest{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.line{display:flex;align-items:center;gap:8px;margin:4px 0 8px}
.switch .word{display:none}
.empty{color:var(--dim);font-size:13px;padding:4px 0}

/* the deck: the last photo, the shutter, what the shot is and where it goes */
.deck{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:16px;
  padding:10px 16px;border-radius:22px;background:var(--panel);border:1px solid var(--glass-line);backdrop-filter:blur(12px)}
.deck .left,.deck .right{display:flex;align-items:center;gap:10px;min-width:0}
.deck .right{justify-content:flex-end}
.lastshot{display:flex;align-items:center;gap:10px;padding:4px 12px 4px 4px;border-radius:14px;background:var(--raise);min-width:0}
.lastshot img{width:56px;height:38px;border-radius:9px;object-fit:cover;background:var(--sunk);flex:none}
.lastshot img:not([src]){visibility:hidden}
.lastshot b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lastshot small{color:var(--faint);font:11px var(--mono)}
.field{display:grid;gap:4px;min-width:0}
.field .choice{min-width:120px}
.field .choicebtn{padding:5px 9px}
#photoname{width:150px}
.shutter{position:relative;width:72px;height:72px;border-radius:50%;padding:0;border:0;background:transparent;cursor:pointer}
.shutter::before{content:"";position:absolute;inset:0;border-radius:50%;border:4px solid var(--ink);opacity:.9}
.shutter::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--ink);transition:transform .12s,background .2s}
.shutter:hover::after{transform:scale(.95)}
.shutter:active::after{transform:scale(.86)}
.shutter.busy::after{background:#ff3b30;transform:scale(.6);border-radius:30%}
.shutter:disabled{opacity:.4}
.shutterwrap{display:grid;justify-items:center;gap:4px}
.round{display:grid;justify-items:center;gap:4px;padding:0;border:0;background:transparent;color:var(--dim);font-size:11.5px}
.round span{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--raise);border:1px solid var(--line);color:var(--ink)}
.round:hover span{border-color:var(--accent)}
.round:disabled{opacity:.4}
.round svg{width:18px;height:18px}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:60}
.flash.go{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:.8}100%{opacity:0}}

/* the gallery: the camera's photos, in a drawer over the screen */
#gallery{position:fixed;z-index:22;left:24px;bottom:120px;top:76px;width:min(420px,calc(100vw - 48px));display:flex;flex-direction:column;
  border-radius:20px;background:var(--raise);border:1px solid var(--line);box-shadow:0 30px 60px -20px #0008;transform:translateX(-120%);
  transition:transform .4s cubic-bezier(.2,.9,.2,1)}
#gallery.open{transform:none}
#gallery header{display:flex;align-items:center;gap:8px;padding:14px 16px 10px}
#gallery .list{overflow-y:auto;padding:0 16px 16px;display:grid;gap:12px}
.photo{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:center}
.photo .thumb{width:120px;height:72px;border-radius:9px;background:var(--sunk);object-fit:contain;image-rendering:pixelated}
.photo .thumb:not([src]){visibility:hidden}
.photo b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.photo small{color:var(--faint);font:11px var(--mono)}
.photo .acts{display:flex;align-items:center;gap:4px;margin-top:6px}
.photo .acts .choice{width:150px}
.photo .acts .choicebtn{padding:2px 8px;font-size:12px}
button.busy{pointer-events:none;opacity:.6}

.gate{position:fixed;inset:0;display:none;place-items:center;background:var(--bg);text-align:center;padding:24px;z-index:50}
.gate.on{display:grid}
.gate p{color:var(--dim);max-width:460px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
@media (min-width:981px){#toasts{left:calc((100% - 404px) / 2);bottom:118px;width:min(560px,calc(100vw - 480px))}}
@media (max-width:980px){
  .camera{grid-template-columns:1fr;grid-template-rows:auto auto 56vh auto auto;height:auto}
  .side{display:contents}
  .finder{grid-row:2}
  .screen{grid-row:3}
  .card{grid-row:auto}
  .deck{position:sticky;bottom:8px;grid-template-columns:auto auto auto;justify-content:space-between;flex-wrap:wrap}
  .deck .right .field,#photoname{display:none}
  #island{position:static;transform:none;margin-left:auto}
  .cams{max-width:none}
  .top{flex-wrap:wrap}
  #gallery{left:12px;right:12px;width:auto;top:12px;bottom:12px}
  #zoomkeys{top:12px;right:12px;bottom:auto}
  #tools button{padding:0 9px;font-size:10.5px}
  #hint,#coords{display:none}
  .lastshot{padding:4px}
  .lastshot span{display:none}
  .deck{gap:8px;padding:10px 12px}
}
</style>
</head>
<body>
<div class="gate" id="gate"><div><h2 id="gate-title">This link has ended</h2><p id="gate-why">Run <b>/izocam editor</b> in the game for a new one.</p></div></div>
<div class="flash" id="flash"></div>
<div class="camera">
  <header class="top">
    <span class="brand"><i></i>Izomap</span>
    <span class="who" id="who"></span><span id="worldpick"></span>
    <div class="cams" id="list"></div>
    <div id="island" role="status" aria-live="polite">
      <span class="dot"></span>
      <svg class="ring" viewBox="0 0 24 24"><circle class="track" cx="12" cy="12" r="9"/><circle class="fill" cx="12" cy="12" r="9" stroke-dasharray="56.5" stroke-dashoffset="56.5"/></svg>
      <span class="tick">✓</span><img class="thumb" alt="">
      <span class="what" id="islandwhat">Izomap</span><span class="aside" id="islandaside"></span>
      <span class="bar"><i></i></span>
    </div>
    <span class="grow"></span>
    <button type="button" class="themebtn quiet small" data-themebtn><span data-themetext></span></button>
    <button type="button" class="iconbtn" id="keyhelp" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">?</button>
  </header>

  <section class="screen">
    <div class="lcd" id="map">
      <canvas id="ground"></canvas>
      <canvas id="marks"></canvas>
      <div class="glassbar" id="tools">
        <button type="button" id="place" aria-pressed="false" title="Then click where the camera should stand (P)">Place camera</button>
        <button type="button" id="moveto" aria-pressed="false" disabled title="Then click where the chosen camera should look (A)">Aim here</button>
        <button type="button" id="recentre" title="Back to the chosen camera, or where you stand">Recenter</button>
      </div>
      <div class="glassbar" id="zoomkeys"><button type="button" id="zoomin" title="Closer">+</button><button type="button" id="zoomout" title="Farther">−</button></div>
      <span class="spin" id="mapbusy"></span>
      <div class="lcdtext" id="coords"></div>
      <div class="lcdtext" id="hint">Drag the yellow frame to aim, its edges to zoom, its handle to turn</div>
      <div id="zoomtip"></div>
    </div>
  </section>

  <aside class="side">
    <div class="finder" id="finder" hidden>
      <div class="eye" id="eye"><img id="previewimg" alt="What the camera sees"><div class="af"></div><div class="thirds" id="thirds" hidden></div><span class="spin" id="previewbusy"></span></div>
      <div class="readout"><span class="tag">VIEWFINDER</span><span id="readout"></span><span class="grow"></span>
        <button type="button" class="iconbtn" id="thirdsbtn" title="Rule of thirds (T)" aria-label="Rule of thirds"></button></div>
    </div>
    <div id="panel"></div>
  </aside>

  <footer class="deck" id="deck" hidden>
    <div class="left">
      <button type="button" class="lastshot" id="lastshot" title="The camera's photos"><img id="lastimg" alt=""><span><b id="lastname">No photos yet</b><small id="lastcount">Photos</small></span></button>
    </div>
    <div class="shutterwrap"><button type="button" class="shutter" id="shutter" title="Take the photo, into the camera's list to hang in the game" aria-label="Take photo"></button><span class="caps">Take photo</span></div>
    <div class="right">
      <div class="field"><span class="caps">Name</span><input id="photoname" aria-label="Photo name"></div>
      <div class="field" id="gridfield"></div>
      <div class="field" id="framefield"></div>
      <button type="button" class="round" id="saveshot" title="Shoot it at full size and save it as a PNG"><span id="saveicon"></span>Save</button>
      <button type="button" class="round" id="copyshot" title="Shoot it at full size and copy the picture"><span id="copyicon"></span>Copy</button>
    </div>
  </footer>
</div>

<div id="gallery" aria-hidden="true">
  <header><b>Photos</b><span class="note" id="photocount"></span><span class="grow"></span><button type="button" class="iconbtn" id="closegallery" title="Close">×</button></header>
  <div class="list" id="photolist"></div>
</div>

<script src="kit/ui/base.js"></script>
<script src="kit/ui/icons.js"></script>
<script src="kit/ui/controls.js"></script>
<script src="kit/ui/popups.js"></script>
<script src="kit/ui/ask.js"></script>
<script src="kit/ui/dialog.js"></script>
<script src="kit/ui/toasts.js"></script>
<script src="kit/ui/theme.js"></script>
<script src="kit/net/relay.js"></script>
<script>
relay.configure({product: 'Izomap', command: '/izocam editor', api: 3, storage: 'izomap-relay'});
/** Through the relay when the link is one of its links, otherwise straight to the plugin that served the page. */
const tunneled = relay.linked() || (!location.hash && !!sessionStorage.getItem('izomap-relay'));
const key = tunneled ? '' : (location.hash || '').slice(1) || sessionStorage.getItem('izomap-editor') || '';
if (!tunneled && location.hash) { sessionStorage.setItem('izomap-editor', key); history.replaceState(null, '', location.pathname); }
$('thirdsbtn').innerHTML = ico('grid');

function gate(title, why) {
  $('gate-title').textContent = title;
  $('gate-why').textContent = why;
  $('gate').classList.add('on');

async function api(path, options = {}) {
  const ask = tunneled ? relay.fetch : (url, init) => fetch(url, init);
  const response = await ask(`/api/${path}`, {
    method: options.method || 'GET',
    headers: {...(tunneled ? {} : {'X-Izomap-Session': key}), ...(options.body ? {'Content-Type': 'application/json'} : {})},
    body: options.body ? JSON.stringify(options.body) : undefined,
  });
  if (response.status === 401) { gate('This link has ended', 'Run /izocam editor in the game for a new one.'); throw new Error('ended'); }
  if (options.raw) {
    if (!response.ok) throw new Error((await response.json()).error);
    return new Blob([await response.arrayBuffer()], {type: 'image/png'});
  }
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || 'The server said no.');
  return data;
}

    cameras.push(camera); toast('ok', `Camera ${camera.name} placed`, ['Aim it with the frame on the screen.']);
    choose(camera.id);
  } catch (e) { failed(e); }
}

/* --- the chosen camera --- */
const zoomOf = slider => Math.pow(2, slider);
const sliderOf = zoom => Math.log2(zoom);
const named = (list, id) => ((options[list] || []).find(o => o.id === id) || {name: id}).name;
/** What the deck was last set to, per camera: a layout, a frame and a name. */
const shot = {};
const shotOf = c => shot[c.id] || (shot[c.id] = {grid: ((options.grids[c.ratio] || [])[0] || {}).id || '', frame: '', name: c.name});

function list() {
  $('list').innerHTML = cameras.length ? '' : '<span class="empty">No cameras here yet: Place camera, then click the screen.</span>';
  for (const c of cameras) {
    const b = document.createElement('button');
    b.type = 'button'; b.setAttribute('aria-pressed', String(!!selected && selected.id === c.id));
    b.innerHTML = `<span>${esc(c.name)}</span><small>${console_ ? esc(c.owner) + ', ' : ''}${c.photos}</small>`;
    b.title = (console_ ? `${c.owner}'s camera, ` : '') + `${c.photos} photo(s)`;
    b.onclick = () => { choose(c.id); goTo(c); };
    $('list').append(b);
  }
}
function choose(id) {
  closeSlotPick();
  selected = cameras.find(c => c.id === id) || null;
  $('moveto').disabled = !selected;
  $('finder').hidden = $('deck').hidden = !selected;
  list(); drawMarks(); panel(); deck(); preview(); photos(); islandIdle();
}

/** A dial: a slider with its value beside it, which can be typed into as well. */
const dial = (field, label, min, max, step, value, shownAs = v => Math.round(v)) =>
  `<div class="dial"><label for="f-${field}">${label}</label>`
  + `<input type="range" id="f-${field}" data-field="${field}" min="${min}" max="${max}" step="${step}" value="${value}">`
  + `<input class="num" id="n-${field}" data-num="${field}" value="${shownAs(value)}" aria-label="${label}"></div>`;
const FIELDS = {
  yaw: {show: v => Math.round(v), send: v => ({yaw: v, orbit: true})},
  pitch: {show: v => Math.round(v), send: v => ({pitch: v, orbit: true})},
  zoom: {show: v => zoomOf(v).toFixed(2), read: typed => sliderOf(Math.max(ZOOM_MIN, Number(typed))), send: v => ({zoom: zoomOf(v)})},
};
const fieldOf = name => FIELDS[name] || {show: v => Math.round(v), send: v => ({[name]: v})};
/** Wires every dial under root: the number follows while dragging, the value is sent when let go or typed. */
function wireDials(root) {
  for (const input of root.querySelectorAll('input[type=range]')) {
    fillRange(input);
    const name = input.dataset.field, f = fieldOf(name), num = root.querySelector(`[data-num="${name}"]`);
    input.oninput = () => { if (num) num.value = f.show(Number(input.value)); };
    input.onchange = () => change(f.send(Number(input.value)));
    if (num) num.onchange = () => {
      const v = f.read ? f.read(num.value) : Number(num.value);
      if (!Number.isFinite(v)) { num.value = f.show(Number(input.value)); return; }
      input.value = v; fillRange(input); change(f.send(Number(input.value)));
    };
  }
}

function panel() {
  const c = selected, p = $('panel');
  if (!c) { p.innerHTML = ''; return; }
  p.innerHTML = `
    <section class="card"><header><span class="caps">Aim</span><span class="grow"></span>
      <button type="button" class="small quiet" id="reset" title="Face where you look, default tilt, zoom 1">${ico('reset', 'ico')}Reset</button></header>
      ${dial('yaw', 'Facing', -180, 180, 1, ((c.yaw + 540) % 360) - 180, FIELDS.yaw.show)}
      ${dial('pitch', 'Tilt', -10, 90, 1, c.pitch, FIELDS.pitch.show)}
      ${dial('zoom', 'Zoom', -4.3, 4, 0.05, sliderOf(c.zoom), FIELDS.zoom.show)}
      <div class="xyz"><input id="px" aria-label="X"><input id="py" aria-label="Y"><input id="pz" aria-label="Z">
        <button type="button" id="go" title="Move the camera to these coordinates">Move</button></div>
    </section>
    <section class="card"><header><span class="caps">Modes</span></header><div class="chips" id="chips"></div></section>`;
  wireDials(p);
  $('reset').onclick = async () => {
    try { replace(await api(`cameras/${selected.id}/reset`, {method: 'POST'})); preview(); } catch (e) { failed(e); }
  };
  $('go').onclick = () => change({x: Number($('px').value), y: Number($('py').value), z: Number($('pz').value)});
  refresh();
}
$('thirdsbtn').onclick = () => selected && change({thirds: !selected.thirds});

/** Puts what the camera now is into the page without drawing it again, so open boxes and focus stay. */
function refresh() {
  const c = selected;
  if (!c || !$('f-yaw')) return;
  $('readout').textContent = `${Math.round(c.blocks)} blocks, ${Math.round(c.distance)} away`;
  const set = (name, value) => {
    const input = $(`f-${name}`), num = $(`n-${name}`);
    if (!input || document.activeElement === input || document.activeElement === num) return;
    input.value = value; fillRange(input); if (num) num.value = fieldOf(name).show(value);
  };
  set('yaw', ((c.yaw + 540) % 360) - 180); set('pitch', c.pitch); set('zoom', sliderOf(c.zoom));
  for (const [id, v] of [['px', c.x], ['py', c.y], ['pz', c.z]]) if (document.activeElement !== $(id)) $(id).value = v.toFixed(1);
  $('thirds').hidden = !c.thirds;

}

/* --- the modes: every setting as a chip with its value, each opening a box beside the side --- */
const sunMatters = () => options.sunShadow || (options.sunDrawn && selected.bodies);
const LOOKS = [
  {id: 'ratio', label: 'Ratio', value: c => c.ratio, box: c => listBox('ratios', 'ratio', c.ratio, 'Aspect ratio')},
  {id: 'style', label: 'Style', value: c => named('styles', c.style), box: c => listBox('styles', 'style', c.style, 'Style')},
  {id: 'filter', label: 'Color', value: c => named('filters', c.filter), box: c => listBox('filters', 'filter', c.filter, 'Color filter')},
  {id: 'sky', label: 'Sky', value: c => named('skies', c.sky), box: c => listBox('skies', 'sky', c.sky, 'Sky')},
  {id: 'sun', label: 'Sun', value: c => (c.bodies ? 'Sun, moon, stars' : 'Plain sky') + (sunMatters() ? `, ${Math.round(c.sunPitch)}° up` : ''),
    on: c => c.bodies, box: sunBox},
  {id: 'fog', label: 'Fog', value: c => c.fog ? `${Math.round(c.fogStart)} to ${Math.round(c.fogEnd)}` : 'Off', on: c => c.fog, box: fogBox},
  {id: 'focus', label: 'Depth of field', value: c => c.focus ? `${Math.round(c.focusDistance)} blocks` : 'Off', on: c => c.focus, box: focusBox},
];
let openLook = null;
function chips() {
  const root = $('chips');
  if (!root) return;
  if (!root.children.length) {
    root.innerHTML = LOOKS.map(l => `<button type="button" class="chip" data-look="${l.id}" aria-haspopup="true" aria-expanded="false"><small>${l.label}</small><span></span></button>`).join('');
    for (const b of root.children) b.onclick = () => openBox(b.dataset.look, b);
  }
  for (const l of LOOKS) {
    const b = root.querySelector(`[data-look="${l.id}"]`);
    b.querySelector('span').textContent = l.value(selected);
    b.classList.toggle('on', !!(l.on && l.on(selected)));
  }
  if (openLook) drawBox();
}
/**
 * Where a chip's box opens: beside the side, over the screen, level with the chip, so every other chip stays in
 * sight and in reach; under the chip where the side is under the screen. The same stand-in each time, so a second
 * click on the chip closes its box.
 */
function besideChip(chip) {
  return chip.besideAnchor || (chip.besideAnchor = {
    isConnected: true,
    contains: node => chip.contains(node),
    getBoundingClientRect() {
      const at = chip.getBoundingClientRect(), side = document.querySelector('.side').getBoundingClientRect();
      if (innerWidth <= 980) return at;
      return {left: side.left - 10, right: side.left - 10, top: at.top - 4, bottom: at.top - 4, width: 0, height: 0};
    },
  });
}
function openBox(id, chip) {
  const look = LOOKS.find(l => l.id === id);
  const box = floatBox(besideChip(chip), 'izpop', '', true, () => { openLook = null; chip.setAttribute('aria-expanded', 'false'); });
  if (!box.isConnected) return;
  chip.setAttribute('aria-expanded', 'true');
  openLook = {look, box};
  drawBox();
}
/** Draws the open box again only when what it says has changed: drawn under a press, it would swallow the click. */
function drawBox() {
  const {look, box} = openLook;
  if (!box.isConnected) { openLook = null; return; }
  const html = look.box(selected);
  if (html === openLook.html) return;
  openLook.html = html;
  const scroll = box.scrollTop;
  box.innerHTML = html;
  wireChoices(box); wireSwitches(box); wireDials(box);
  for (const b of box.querySelectorAll('[data-set]')) b.onclick = () => change(JSON.parse(b.dataset.set));
  for (const s of box.querySelectorAll('.switch input[data-toggle]')) s.onchange = () => change({[s.dataset.toggle]: s.checked});
  box.scrollTop = scroll;
}
const setAttr = fields => `data-set='${esc(JSON.stringify(fields))}'`;
/** A list of choices, the ones this player may not use shown shut, with why. */
function listBox(list, field, current, title) {
  return `<h4>${title}</h4><div class="opts">` + options[list].map(o =>
    `<button type="button" class="opt${o.id === current ? ' on' : ''}" ${o.allowed ? setAttr({[field]: o.id}) : 'disabled title="You do not have the permission for this"'}>`
    + `<span>${esc(o.name)}</span>${o.allowed ? '' : '<span class="lock">locked</span>'}</button>`).join('') + '</div>';
}
function toggleLine(field, label, on, allowed) {
  return `<div class="line">${switchField(null, on, `data-toggle="${field}"${allowed || on ? '' : ' disabled'}`)}<b>${label}</b>`
    + (allowed ? '' : '<span class="note">(no permission to turn it on)</span>') + '</div>';
}
function sunBox(c) {
  let html = '<h4>Sun</h4>' + toggleLine('bodies', 'Sun, moon and stars in the sky', c.bodies, options.may.bodies);
  if (sunMatters()) {
    html += dial('sunYaw', 'Direction', 0, 355, 5, c.sunYaw) + dial('sunPitch', 'Height', 1, 89, 1, c.sunPitch)
      + '<div class="suggest">'
      + (options.sunShadow ? `<button type="button" class="small" ${setAttr(c.suggest.sideLight)}>Side light</button>` : '')
      + (options.sunDrawn && c.bodies ? `<button type="button" class="small" ${setAttr(c.suggest.sunInFrame)}>Sun in the frame</button>` : '')
      + '</div>';
  } else html += '<p class="hint">With no shadows on this server and no sun in the sky, where the sun stands changes nothing.</p>';
  return html;
}
function depthHint(c) {
  const d = c.suggest.depth;
  return d ? `<p class="hint">In this frame the ground lies ${d.near} to ${d.far} blocks away, most of it around ${d.median} (${d.sky}% sky).</p>`
    : '<p class="hint">The viewfinder has not said yet how far this frame sees.</p>';
}
function fogBox(c) {
  let html = '<h4>Fog</h4>' + toggleLine('fog', 'On', c.fog, options.may.fog);
  if (c.sky === 'NONE') html += '<p class="hint">Fog takes the sky\'s color, and this sky is transparent: pick a sky for it to fade into.</p>';
  if (c.fog) {
    html += dial('fogStart', 'Begins', 0, c.depthLimit, 8, c.fogStart) + dial('fogEnd', 'Full', 8, c.depthLimit, 8, c.fogEnd) + depthHint(c);
    if (c.suggest.fog) html += `<div class="suggest"><button type="button" class="small" ${setAttr({fogStart: c.suggest.fog.start, fogEnd: c.suggest.fog.end})}>Use ${c.suggest.fog.start} to ${c.suggest.fog.end}</button></div>`;
  }
  return html;
}
function focusBox(c) {
  let html = '<h4>Depth of field</h4>' + toggleLine('focus', 'On', c.focus, options.may.focus);
  if (c.focus) {
    html += dial('focusDistance', 'Distance', 1, c.depthLimit, 1, c.focusDistance) + depthHint(c);
    const f = c.suggest.focus;
    if (f) html += '<div class="suggest">'
      + (f.center ? `<button type="button" class="small" ${setAttr({focusDistance: f.center})}>The middle (${f.center})</button>` : '')
      + `<button type="button" class="small" ${setAttr({focusDistance: f.near})}>Nearest (${f.near})</button>`
      + `<button type="button" class="small" ${setAttr({focusDistance: f.median})}>Most of it (${f.median})</button></div>`;
  }
  return html;
}

/** The camera as the server now has it, in place of the one the page held. */
function replace(updated) {
  const i = cameras.findIndex(c => c.id === updated.id);
  if (i >= 0) cameras[i] = updated;
  if (selected && selected.id === updated.id) selected = updated;
  drawMarks(); list(); refresh();
}
let changing = Promise.resolve();
/** Sends a change, one after another so two quick ones arrive in order, and redraws the viewfinder. */
function change(fields) {
  if (!selected) return;
  const id = selected.id, ratio = selected.ratio;
  changing = changing.then(async () => {
    try {
      replace(await api(`cameras/${id}`, {method: 'PATCH', body: fields}));
      if (selected && selected.ratio !== ratio) deck();
      preview();
    } catch (e) {
      failed(e);
      // Put the marks back where the server still has them.
      try { replace(await api(`cameras/${id}`)); } catch (ignored) {}
    }
  });
}

let previewTicket = 0;
async function preview() {
  if (!selected) return;
  const ticket = ++previewTicket;
  $('finder').classList.add('loading'); $('previewbusy').classList.add('on');
  const s = shotOf(selected);
  try {
    const blob = await api(`cameras/${selected.id}/preview?w=520` + (s.frame ? `&frame=${encodeURIComponent(s.frame)}&grid=${encodeURIComponent(s.grid)}` : ''), {raw: true});
    if (ticket !== previewTicket) return;
    const url = URL.createObjectURL(blob), image = $('previewimg');
    image.onload = () => URL.revokeObjectURL(url);
    image.src = url;
    // The preview is what the scene's depth is read off; the suggestions come with the camera.
    const fresh = await api(`cameras/${selected.id}`);
    if (ticket === previewTicket) replace(fresh);
  } catch (e) { failed(e); }
  finally { if (ticket === previewTicket) { $('finder').classList.remove('loading'); $('previewbusy').classList.remove('on'); } }
}

/* --- the deck: the last photo, the shutter, a layout and a frame, save and copy --- */
function frameChoices(empty) {
  return [['', empty]].concat(options.frames.filter(f => f.allowed).map(f => [f.id, f.name]));
}
function deck() {
  const c = selected;
  if (!c) return;
  const s = shotOf(c), grids = options.grids[c.ratio] || [];
  if (!grids.find(g => g.id === s.grid)) s.grid = (grids[0] || {}).id || '';
  $('gridfield').innerHTML = `<span class="caps">Layout</span>${select('grid', grids.map(g => [g.id, g.id, `${g.width}x${g.height}`]), s.grid)}`;
  $('framefield').innerHTML = `<span class="caps">Frame</span>${select('frame', frameChoices('None'), s.frame)}`;
  wireChoices($('deck'));
  $('photoname').value = s.name;
  $('grid').onchange = () => { s.grid = $('grid').value; islandIdle(); if (s.frame) preview(); };
  $('frame').onchange = () => { s.frame = $('frame').value; preview(); };
  $('photoname').oninput = () => { s.name = $('photoname').value; };
  $('saveshot').disabled = $('copyshot').disabled = !options.may.export;
  $('saveshot').title = options.may.export ? 'Shoot it at full size and save it as a PNG' : 'Saving takes the izomap.export permission';
  $('copyshot').title = options.may.export ? 'Shoot it at full size and copy the picture' : 'Copying takes the izomap.export permission';
}
$('shutter').onclick = takePhoto;
$('saveshot').onclick = () => {
  const s = shotOf(selected), shooting = shootFile();
  saveImage(busy($('saveshot'), shooting), fileName(s.name, s.grid), 'Saved');
};
$('copyshot').onclick = () => copyImage(busy($('copyshot'), shootFile()));
$('lastshot').onclick = () => openGallery(true);
$('closegallery').onclick = () => openGallery(false);
function openGallery(open) {
  $('gallery').classList.toggle('open', open);
  $('gallery').setAttribute('aria-hidden', String(!open));
}

function shootFile() {
  const c = selected, s = shotOf(c);
  const shooting = api(`cameras/${c.id}/export`, {method: 'POST', body: {grid: s.grid, frame: s.frame}, raw: true});
  follow(c.id, `Shooting ${s.grid}`, shooting);
  return shooting;
}
/** Marks a button busy while what it started runs, and hands that on. */
function busy(button, promise) {
  button.classList.add('busy');
  promise.finally(() => button.classList.remove('busy')).catch(() => {});
  return promise;
}
const fileName = (name, grid) => `${(name || 'photo').replace(/[^A-Za-z0-9._-]+/g, '-')}${grid ? '-' + grid : ''}.png`;
async function saveImage(promise, name) {
  try {
    const blob = await promise, url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
    flashScreen();
    islandDone('Saved', name, url);
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  } catch (e) { if (e.message !== 'ended') islandBad(e.message); }
}
/**
 * The picture goes to the clipboard as it arrives: the browser lets a page write to it only while the click that
 * asked is fresh, so the write starts at once and is handed the picture to come.
 */
function copyImage(promise) {
  if (!navigator.clipboard || typeof ClipboardItem === 'undefined') {
    promise.catch(() => {});
    return islandBad('This browser cannot copy pictures: use Save');
  }
  let refused = false, picture = null;
  promise.then(blob => { picture = URL.createObjectURL(blob); }, e => { refused = true; if (e.message !== 'ended') islandBad(e.message); });
  navigator.clipboard.write([new ClipboardItem({'image/png': promise})])
    .then(() => { flashScreen(); islandDone('Copied', 'to the clipboard', picture); setTimeout(() => picture && URL.revokeObjectURL(picture), 10000); },
      e => { if (!refused) islandBad('Could not copy: ' + e.message); });
}
async function takePhoto() {
  const c = selected, s = shotOf(c), button = $('shutter');
  button.classList.add('busy'); button.disabled = true;
  try {
    const before = c.photos;
    await api(`cameras/${c.id}/photo`, {method: 'POST', body: {name: $('photoname').value, grid: s.grid}});
    flashScreen();
    await follow(c.id, `Taking ${s.grid}`);
    const items = await api(`cameras/${c.id}/photos`);
    c.photos = items.length; list();
    if (selected && selected.id === c.id) drawPhotos(items);
    if (items.length > before) {
      const newest = items[items.length - 1];
      const picture = URL.createObjectURL(await api(`photos/${newest.id}/image?w=160`, {raw: true}));
      islandDone(`${newest.name}`, `in ${c.name}'s photos`, picture);
    } else islandBad('The photo was not taken: the game says why');
  } catch (e) { if (e.message !== 'ended') islandBad(e.message); }
  finally { button.classList.remove('busy'); button.disabled = false; }
}

/* --- the gallery: a picture of each photo, its frame, save and copy --- */
async function photos() {
  if (!selected) return;
  try { drawPhotos(await api(`cameras/${selected.id}/photos`)); } catch (e) { failed(e); }
}
function drawPhotos(items) {
  const root = $('photolist');
  $('photocount').textContent = items.length ? `(${items.length})` : '';
  const last = items[items.length - 1];
  $('lastname').textContent = last ? last.name : 'No photos yet';
  $('lastcount').textContent = `${items.length} photo${items.length === 1 ? '' : 's'}`;
  if (last) thumbnail(last, $('lastimg')); else $('lastimg').removeAttribute('src');
  if (!items.length) { root.innerHTML = '<div class="empty">None yet. Press the shutter; in the game the photo hangs from the camera\'s list.</div>'; return; }
  root.innerHTML = items.slice().reverse().map(p => `
    <div class="photo" data-photo="${p.id}">
      <img class="thumb" alt="">
      <div><b title="${esc(p.name)}">${esc(p.name)}</b><small>${p.grid}, ${p.width}x${p.height}${p.placed ? ', hanging' : ''}</small>
        <div class="acts">
          ${p.frameEditable ? select2(`data-reframe="${p.id}"`, frameChoices('No frame'), p.frame || '') : `<span class="note">Frame is part of it</span>`}
          ${iconButton('save', `data-save="${p.id}"${options.may.export ? '' : ' disabled'}`, '', 'Save PNG')}
          ${iconButton('copy', `data-copy="${p.id}"${options.may.export ? '' : ' disabled'}`, '', 'Copy')}
        </div></div>
    </div>`).join('');
  wireChoices(root);
  for (const item of items) thumbnail(item, root.querySelector(`[data-photo="${item.id}"] .thumb`));
  for (const pick of root.querySelectorAll('[data-reframe]')) pick.onchange = async () => {
    try { const p = await api(`photos/${pick.dataset.reframe}`, {method: 'PATCH', body: {frame: pick.value}}); thumbnail(p, root.querySelector(`[data-photo="${p.id}"] .thumb`)); }
    catch (e) { failed(e); }
  };
  for (const b of root.querySelectorAll('[data-save]')) b.onclick = () => {
    const p = items.find(i => i.id === b.dataset.save);
    saveImage(busy(b, api(`photos/${p.id}/image`, {raw: true})), fileName(p.name, p.grid));
  };
  for (const b of root.querySelectorAll('[data-copy]')) b.onclick = () => copyImage(busy(b, api(`photos/${b.dataset.copy}/image`, {raw: true})));
}
async function thumbnail(p, at) {
  if (!at) return;
  try {
    const url = URL.createObjectURL(await api(`photos/${p.id}/image?w=240`, {raw: true}));
    at.onload = () => URL.revokeObjectURL(url);
    at.src = url;
  } catch (e) { failed(e); }
}

/* --- keys --- */
const KEYS = [
  ['← →', 'Turn the camera (Shift: 15° at a time)'], ['↑ ↓', 'Tilt it'], ['+ −', 'Zoom the camera in and out'],
  ['Space', 'Take the photo'], ['T', 'Rule of thirds'], ['P', 'Place a camera'], ['A', 'Aim the chosen camera at a click'],
  ['G', 'The camera\'s photos'], ['[ ]', 'The previous or next camera'], ['?', 'This list'], ['Esc', 'Close a box, or stop placing'],
];
$('keyhelp').onclick = showKeys;
function showKeys() {
  dialog({title: 'Keyboard shortcuts', only: true, doneLabel: 'Close', body: `<div class="keys">${KEYS.map(([k, what]) => `<kbd>${esc(k)}</kbd><span>${esc(what)}</span>`).join('')}</div>`, done: () => {}});
}
let nudgeTimer = null, nudged = {};
/** Keys move the camera on the page at once and send the change once they stop. */
function nudge(fields) {
  const c = selected;
  if (fields.yaw !== undefined) turn(c, fields.yaw);
  Object.assign(c, fields);
  Object.assign(nudged, fields);
  drawMarks(); refresh();
  clearTimeout(nudgeTimer);
  nudgeTimer = setTimeout(() => { const send = nudged; nudged = {}; change({...send, ...(send.yaw !== undefined || send.pitch !== undefined ? {orbit: true} : {})}); }, 300);
}
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input, select, textarea, [contenteditable]')) return;
  if (dialogOpen || asking || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '?') { e.preventDefault(); return showKeys(); }
  if (e.key === 'Escape') { closeSlotPick(); openGallery(false); if (mode) setMode(mode); return; }
  if (e.key === 'p' || e.key === 'P') return setMode('place');
  if (!selected) return;
  const step = e.shiftKey ? 15 : 5;
  const keys = {
    ArrowLeft: () => nudge({yaw: Math.round(selected.yaw - step)}),
    ArrowRight: () => nudge({yaw: Math.round(selected.yaw + step)}),
    ArrowUp: () => nudge({pitch: Math.min(90, selected.pitch + (e.shiftKey ? 10 : 2))}),
    ArrowDown: () => nudge({pitch: Math.max(-10, selected.pitch - (e.shiftKey ? 10 : 2))}),
    '+': () => nudge({zoom: Math.min(ZOOM_MAX, selected.zoom * 1.25)}), '=': () => nudge({zoom: Math.min(ZOOM_MAX, selected.zoom * 1.25)}),
    '-': () => nudge({zoom: Math.max(ZOOM_MIN, selected.zoom / 1.25)}),
    ' ': () => { if (!$('shutter').disabled) takePhoto(); },
    t: () => change({thirds: !selected.thirds}), T: () => change({thirds: !selected.thirds}),
    g: () => openGallery(!$('gallery').classList.contains('open')), G: () => openGallery(!$('gallery').classList.contains('open')),
    a: () => setMode('move'), A: () => setMode('move'),
    '[': () => cameras.length && pickNext(-1),
    ']': () => cameras.length && pickNext(1),
  };
  if (keys[e.key]) { e.preventDefault(); keys[e.key](); }
});
function pickNext(by) {
  const next = cameras[(cameras.indexOf(selected) + by + cameras.length) % cameras.length];
  choose(next.id); goTo(next);
}

async function enter(world) {
  try {
    const state = await api('state' + (world ? `?world=${encodeURIComponent(world)}` : ''));
    options = state.options; cameras = state.cameras; me = {x: state.x, z: state.z};
    selected = null;
    worldKey = state.world;
    tiles.clear(); tileQueue = [];
    if (state.console) {
      console_ = {world: state.world, worlds: state.worlds, owners: state.owners, owner: console_ && console_.owner};
      $('who').textContent = 'Console in';
      $('worldpick').innerHTML = select('worldsel', state.worlds, state.world);
      wireChoices($('worldpick'));
      $('worldsel').onchange = () => enter($('worldsel').value);
    } else $('who').textContent = `${state.player} in ${state.world}`;
    $('panel').innerHTML = ''; $('finder').hidden = $('deck').hidden = true;
    view.x = me.x; view.z = me.z; view.size = 256;
    list(); islandIdle();
    if (cameras.length) { choose(cameras[0].id); goTo(cameras[0], true); } else redraw();
  } catch (e) { failed(e); }
}

if (!tunneled) enter();
else {
  let entered = false;
  relay.on('hello', () => { $('gate').classList.remove('on'); if (!entered) { entered = true; enter(); } });
  relay.on('lost', () => gate('Connecting', 'Waiting for your server...'));
  relay.on('back', () => $('gate').classList.remove('on'));
  relay.on('refused', text => gate('This link has ended', text));
  gate('Connecting', 'Waiting for your server...');
  relay.start();
}
</script>
