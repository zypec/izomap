<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Izomap editor</title>
<script>
try {
  const theme = localStorage.getItem('zypec-theme');
  if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
} catch (unavailable) {}
</script>
<link rel="stylesheet" href="kit/ui/ui.css">
<style>
/* The editor: the world from above on the left, the chosen camera on the right. The relay serves this page
   and carries its calls to the plugin through the editor kit's tunnel (kit/net/relay.js); with no relay, the
   plugin serves it and every call carries the session key from the link /izocam editor printed. Windows,
   dropdowns, switches, toasts and the theme are the kit's (kit/ui); this file only sets Izomap's colors. */
:root{--accent:#7a5600;--accent-soft:#7a560014;--on-accent:#fff;--sky:#ffd60a}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--accent:#e3b12a;--accent-soft:#e3b12a1c;--on-accent:#1a1300}}
:root[data-theme=dark]{--accent:#e3b12a;--accent-soft:#e3b12a1c;--on-accent:#1a1300}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans)}
h3{margin:0;font:600 11px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.app{display:grid;grid-template-columns:minmax(0,1fr) 400px;height:100vh}

/* the map */
.mapwrap{position:relative;overflow:hidden;background:#060607;cursor:grab;touch-action:none}
.mapwrap.dragging{cursor:grabbing}
.mapwrap.placing{cursor:crosshair}
.mapwrap img:not([src]){visibility:hidden}
.mapwrap img{position:absolute;left:0;top:0;transform-origin:0 0;image-rendering:pixelated;user-select:none;pointer-events:none}
.mapwrap canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.toolbar{position:absolute;top:14px;left:14px;display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(24,24,27,.72);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.12)}
.toolbar button{height:32px;padding:0 13px;border:0;border-radius:999px;background:transparent;color:#a1a1aa;
  font:500 12px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase}
.toolbar button:hover{color:#fff;background:transparent}
.toolbar button[aria-pressed=true]{background:var(--sky);color:#1a1500}
.toolbar button:disabled{opacity:.4}
.maptext{position:absolute;bottom:12px;font:500 11.5px/1 var(--mono);color:#a1a1aa;letter-spacing:.04em;text-shadow:0 1px 2px #000}
#coords{left:14px}#hint{right:14px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.2);border-top-color:var(--sky);
  animation:spin .8s linear infinite;opacity:0;transition:opacity .2s;pointer-events:none}
.spin.on{opacity:1}
#mapbusy{position:absolute;right:16px;top:22px}
@keyframes spin{to{transform:rotate(1turn)}}

/* the side */
.side{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--raise)}
.top{display:flex;align-items:center;gap:8px;padding:14px 16px 10px}
.top b{font-size:17px;letter-spacing:-.02em}
.top .who{color:var(--dim);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#worldpick .choicebtn{padding:2px 8px;font-size:12px}
.scroll{flex:1;overflow-y:auto;padding:0 16px 16px}
.cams{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:thin}
.cams button{flex:none;display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12.5px}
.cams button small{color:var(--faint);font:11px var(--mono)}
.cams button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.empty{color:var(--dim);font-size:13px;padding:6px 0 12px}

.viewer{position:relative;border-radius:10px;overflow:hidden;margin-bottom:6px;
  background:conic-gradient(#8881 25%,#8882 0 50%,#8881 0 75%,#8882 0) 0 0/18px 18px}
.viewer img:not([src]){visibility:hidden}
.viewer img{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;transition:opacity .25s}
.viewer.loading img{opacity:.55}
.viewer .spin{position:absolute;right:10px;top:10px}
.thirds{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,transparent calc(33.33% - .5px),#fff9 calc(33.33% - .5px) calc(33.33% + .5px),transparent 0,transparent calc(66.66% - .5px),#fff9 calc(66.66% - .5px) calc(66.66% + .5px),transparent 0),
  linear-gradient(transparent calc(33.33% - .5px),#fff9 calc(33.33% - .5px) calc(33.33% + .5px),transparent 0,transparent calc(66.66% - .5px),#fff9 calc(66.66% - .5px) calc(66.66% + .5px),transparent 0)}
.readout{display:flex;align-items:center;gap:6px;font:12px var(--mono);color:var(--dim);margin-bottom:12px}

.group{border-top:1px solid var(--line);padding:12px 0}
.group > header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.slider{display:grid;grid-template-columns:78px minmax(0,1fr) 62px;align-items:center;gap:10px;margin:4px 0}
.slider label{color:var(--dim);font-size:12.5px}
.slider input.num{padding:3px 6px;font:12px var(--mono);text-align:right}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.xyz{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:6px;margin-top:8px}
.xyz input{font:12px var(--mono);padding:5px 7px}

.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.chip{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:7px 10px;border-radius:8px;text-align:left;min-width:0}
.chip small{font:500 10.5px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.chip span{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chip.on span{color:var(--accent);font-weight:600}
.chip[aria-expanded=true]{border-color:var(--accent)}
.slotpick.izpop{width:300px}
.izpop h4{margin:2px 2px 8px;font-size:13px}
.izpop .slider{grid-template-columns:70px minmax(0,1fr) 54px}
.opts{display:grid;gap:2px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;border-color:transparent;background:transparent;padding:6px 8px}
.opt.on{color:var(--accent);font-weight:600;background:var(--accent-soft)}
.opt .lock{font:11px var(--mono);color:var(--faint)}
.hint{color:var(--dim);font-size:12px;margin:6px 2px}
.suggest{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.line{display:flex;align-items:center;gap:8px;margin:4px 0 8px}
.switch .word{display:none}

.photos{display:grid;gap:8px}
.photo{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;align-items:center}
.photo .thumb{width:76px;height:48px;border-radius:6px;background:var(--sunk);object-fit:contain;image-rendering:pixelated}
.photo .what{min-width:0}
.photo .what b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.photo .what small{color:var(--faint);font:11px var(--mono)}
.photo .acts{display:flex;align-items:center;gap:4px;margin-top:4px}
.photo .acts .choice{width:140px}
.photo .acts .choicebtn{padding:2px 8px;font-size:12px}

.shoot{border-top:1px solid var(--line);padding:12px 16px 14px;display:grid;gap:8px;background:var(--raise)}
.shoot .pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.shoot label{display:block;font:500 10.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
.shoot .go{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.shoot .out{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shoot .out button{display:inline-flex;align-items:center;justify-content:center}
button.busy{pointer-events:none;opacity:.7}

.gate{position:fixed;inset:0;display:none;place-items:center;background:var(--bg);text-align:center;padding:24px;z-index:50}
.gate.on{display:grid}
.gate p{color:var(--dim);max-width:460px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
@media (min-width:901px){#toasts{left:calc((100% - 400px) / 2);width:min(560px,calc(100vw - 460px))}}
@media (max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:52vh auto;height:auto}.side{border-left:0}.scroll{overflow:visible}}
</style>
</head>
<body>
<div class="gate" id="gate"><div><h2 id="gate-title">This link has ended</h2><p id="gate-why">Run <b>/izocam editor</b> in the game for a new one.</p></div></div>
<div class="app">
  <div class="mapwrap" id="map">
    <img id="mapimg" alt="The world from above">
    <canvas id="marks"></canvas>
    <div class="toolbar">
      <button type="button" id="place" aria-pressed="false" title="Then click the map where the camera should stand (P)">Place camera</button>
      <button type="button" id="moveto" aria-pressed="false" disabled title="Then click the map where the chosen camera should look (A)">Aim here</button>
      <button type="button" id="recentre" title="Back to where you stand">To me</button>
    </div>
    <span class="spin" id="mapbusy"></span>
    <div class="maptext" id="coords"></div>
    <div class="maptext" id="hint">Drag the yellow frame to aim, its handle to turn round it</div>
  </div>
  <aside class="side">
    <header class="top">
      <b>Izomap</b><span class="who" id="who"></span><span id="worldpick"></span><span class="grow"></span>
      <button type="button" class="themebtn quiet small" data-themebtn><span data-themetext></span></button>
      <button type="button" class="iconbtn" id="keyhelp" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">?</button>
    </header>
    <div class="scroll">
      <div class="cams" id="list"></div>
      <div id="panel"></div>
    </div>
    <div class="shoot" id="shoot" hidden></div>
  </aside>
</div>

<script src="kit/ui/base.js"></script>
<script src="kit/ui/icons.js"></script>
<script src="kit/ui/controls.js"></script>
<script src="kit/ui/popups.js"></script>
<script src="kit/ui/ask.js"></script>
<script src="kit/ui/dialog.js"></script>
<script src="kit/ui/toasts.js"></script>
<script src="kit/ui/theme.js"></script>
<script src="kit/net/relay.js"></script>
<script>
relay.configure({product: 'Izomap', command: '/izocam editor', api: 2, storage: 'izomap-relay'});
/** Through the relay when the link is one of its links, otherwise straight to the plugin that served the page. */
const tunneled = relay.linked() || (!location.hash && !!sessionStorage.getItem('izomap-relay'));
const key = tunneled ? '' : (location.hash || '').slice(1) || sessionStorage.getItem('izomap-editor') || '';
if (!tunneled && location.hash) { sessionStorage.setItem('izomap-editor', key); history.replaceState(null, '', location.pathname); }

function gate(title, why) {
  $('gate-title').textContent = title;
  $('gate-why').textContent = why;
  $('gate').classList.add('on');
}

async function api(path, options = {}) {
  const ask = tunneled ? relay.fetch : (url, init) => fetch(url, init);
  const response = await ask(`/api/${path}`, {
    method: options.method || 'GET',
    headers: {...(tunneled ? {} : {'X-Izomap-Session': key}), ...(options.body ? {'Content-Type': 'application/json'} : {})},
    body: options.body ? JSON.stringify(options.body) : undefined,
  });
  if (response.status === 401) { gate('This link has ended', 'Run /izocam editor in the game for a new one.'); throw new Error('ended'); }
  if (options.raw) {
    if (!response.ok) throw new Error((await response.json()).error);
    return new Blob([await response.arrayBuffer()], {type: 'image/png'});
  }
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || 'The server said no.');
  return data;
}
const said = (text, lines) => toast('ok', text, lines);
const failed = e => { if (e && e.message !== 'ended') toast('bad', e.message || String(e)); };

/* --- the map: a top-down picture the plugin renders, north up, and the cameras drawn over it --- */
const view = {x: 0, z: 0, size: 256};
/** How far from a camera, on screen, the handle that turns it sits. */
const HANDLE = 58;
const shown = {x: 0, z: 0, size: 256};
const wrap = $('map'), img = $('mapimg'), marks = $('marks');
let cameras = [], selected = null, mode = null, options = null, me = {x: 0, z: 0};
/** The console's editor: every player's cameras, in a world it picks, put up for a player it names. */
let console_ = null;

function toScreen(x, z) {
  const w = wrap.clientWidth, h = wrap.clientHeight, scale = Math.min(w, h) / view.size;
  return [w / 2 + (x - view.x) * scale, h / 2 + (z - view.z) * scale];
}
function toWorld(sx, sy) {
  const w = wrap.clientWidth, h = wrap.clientHeight, scale = Math.min(w, h) / view.size;
  return [view.x + (sx - w / 2) / scale, view.z + (sy - h / 2) / scale];
}
/** The last picture, moved and scaled to where the view now is, so panning answers before the new one comes. */
function placeImage() {
  const w = wrap.clientWidth, h = wrap.clientHeight, scale = Math.min(w, h) / view.size;
  const [left, top] = toScreen(shown.x - shown.size / 2, shown.z - shown.size / 2);
  img.style.width = `${shown.size * scale}px`; img.style.height = `${shown.size * scale}px`;
  img.style.transform = `translate(${left}px, ${top}px)`;
  drawMarks();
}
function drawMarks() {
  const dpr = devicePixelRatio || 1;
  marks.width = wrap.clientWidth * dpr; marks.height = wrap.clientHeight * dpr;
  const g = marks.getContext('2d'); g.scale(dpr, dpr);
  // Others first and faint, the chosen one on top: its frame is what the photo will show.
  for (const c of [...cameras.filter(c => !selected || c.id !== selected.id), ...(selected ? [selected] : [])]) {
    const on = selected && c.id === selected.id, [sx, sy] = toScreen(c.x, c.z), [tx, ty] = toScreen(c.target.x, c.target.z);
    if (c.frame.length === 4) {
      g.beginPath();
      c.frame.forEach(([x, z], i) => { const [px, py] = toScreen(x, z); i ? g.lineTo(px, py) : g.moveTo(px, py); });
      g.closePath();
      g.fillStyle = on ? 'rgba(255,214,10,.16)' : 'rgba(255,255,255,.06)'; g.fill();
      g.lineWidth = on ? 2 : 1; g.strokeStyle = on ? '#ffd60a' : 'rgba(255,255,255,.35)'; g.stroke();
    }
    g.setLineDash([4, 4]); g.beginPath(); g.moveTo(sx, sy); g.lineTo(tx, ty);
    g.strokeStyle = on ? 'rgba(255,214,10,.7)' : 'rgba(255,255,255,.3)'; g.lineWidth = 1.5; g.stroke(); g.setLineDash([]);
    if (on) {
      g.strokeStyle = '#ffd60a'; g.lineWidth = 2;
      g.beginPath(); g.moveTo(tx - 9, ty); g.lineTo(tx + 9, ty); g.moveTo(tx, ty - 9); g.lineTo(tx, ty + 9); g.stroke();
      const [hx, hy] = handleAt(c);
      g.beginPath(); g.moveTo(tx, ty); g.lineTo(hx, hy); g.strokeStyle = 'rgba(255,214,10,.8)'; g.stroke();
      g.beginPath(); g.arc(hx, hy, 7, 0, Math.PI * 2); g.fillStyle = '#ffd60a'; g.fill(); g.strokeStyle = '#000'; g.stroke();
    }
    g.beginPath(); g.arc(sx, sy, on ? 6 : 5, 0, Math.PI * 2);
    g.fillStyle = on ? '#fff' : 'rgba(255,255,255,.7)'; g.fill(); g.lineWidth = 2; g.strokeStyle = '#000'; g.stroke();
    g.font = '500 11px ui-monospace,Menlo,monospace'; g.fillStyle = '#fff'; g.shadowColor = '#000'; g.shadowBlur = 3;
    g.fillText(c.name, sx + 10, sy - 8); g.shadowBlur = 0;
  }
}
/** The turning handle sits beyond the frame, the way the camera looks, so dragging it round turns the shot. */
function handleAt(c) {
  const [tx, ty] = toScreen(c.target.x, c.target.z), yaw = c.yaw * Math.PI / 180;
  let reach = HANDLE;
  for (const [x, z] of c.frame) { const [px, py] = toScreen(x, z); reach = Math.max(reach, Math.hypot(px - tx, py - ty) + 18); }
  return [tx - Math.sin(yaw) * reach, ty + Math.cos(yaw) * reach];
}
function inFrame(c, sx, sy) {
  if (c.frame.length !== 4) { const [tx, ty] = toScreen(c.target.x, c.target.z); return Math.hypot(tx - sx, ty - sy) < 14; }
  let inside = false;
  const pts = c.frame.map(([x, z]) => toScreen(x, z));
  for (let i = 0, j = 3; i < 4; j = i++) {
    const [xi, yi] = pts[i], [xj, yj] = pts[j];
    if ((yi > sy) !== (yj > sy) && sx < (xj - xi) * (sy - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
/** Moves a camera's marks by a world offset, so a drag answers before the server does. */
function shift(c, dx, dz) {
  c.x += dx; c.z += dz; c.target.x += dx; c.target.z += dz;
  c.frame = c.frame.map(([x, z]) => [x + dx, z + dz]);
}
/** Turns a camera's marks round its target, for the same reason. */
function turn(c, yaw) {
  const by = (yaw - c.yaw) * Math.PI / 180, cos = Math.cos(by), sin = Math.sin(by), {x: ox, z: oz} = c.target;
  const rot = (x, z) => [ox + (x - ox) * cos - (z - oz) * sin, oz + (x - ox) * sin + (z - oz) * cos];
  [c.x, c.z] = rot(c.x, c.z);
  c.frame = c.frame.map(([x, z]) => rot(x, z));
  c.yaw = yaw;
}
let mapTimer, mapTicket = 0;
function loadMap() {
  clearTimeout(mapTimer);
  mapTimer = setTimeout(async () => {
    const ticket = ++mapTicket, want = {...view};
    $('mapbusy').classList.add('on');
    try {
      const blob = await api(`map?x=${want.x.toFixed(1)}&z=${want.z.toFixed(1)}&size=${Math.round(want.size)}` + worldQuery('&'), {raw: true});
      if (ticket !== mapTicket) return;
      const url = URL.createObjectURL(blob);
      img.onload = () => { Object.assign(shown, want); placeImage(); URL.revokeObjectURL(url); };
      img.src = url;
    } catch (e) { failed(e); }
    finally { if (ticket === mapTicket) $('mapbusy').classList.remove('on'); }
  }, 220);
}

/* Pressing the map pans it, unless the press lands on a camera (which then follows the pointer and is moved
   where it is let go) or on the chosen camera's handle (which turns it). A press that does not move is a click:
   it places a camera, moves the chosen one there, or picks the camera under it. */
let drag = null;
const local = e => { const r = wrap.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
function cameraAt(sx, sy) {
  return cameras.find(c => { const [cx, cy] = toScreen(c.x, c.z); return Math.hypot(cx - sx, cy - sy) < 12; });
}
function onHandle(sx, sy) {
  if (!selected) return false;
  const [hx, hy] = handleAt(selected);
  return Math.hypot(hx - sx, hy - sy) < 12;
}
wrap.addEventListener('pointerdown', e => {
  if (e.target.closest('.toolbar')) return;
  const [sx, sy] = local(e);
  let kind = 'pan', camera = null;
  if (onHandle(sx, sy)) { kind = 'turn'; camera = selected; }
  else if ((camera = cameraAt(sx, sy))) { kind = 'move'; if (!selected || selected.id !== camera.id) choose(camera.id); }
  else if (selected && inFrame(selected, sx, sy)) { kind = 'aim'; camera = selected; }
  const [wx, wz] = toWorld(sx, sy);
  drag = {kind, camera, x: e.clientX, y: e.clientY, vx: view.x, vz: view.z, wx, wz, moved: false};
  wrap.setPointerCapture(e.pointerId);
});
wrap.addEventListener('pointermove', e => {
  const [sx, sy] = local(e), [wx, wz] = toWorld(sx, sy);
  $('coords').textContent = `X ${Math.floor(wx)}   Z ${Math.floor(wz)}   ${Math.round(view.size)} blocks across`;
  if (!drag) { wrap.style.cursor = mode ? '' : onHandle(sx, sy) || cameraAt(sx, sy) ? 'pointer' : ''; return; }
  if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 4) { drag.moved = true; wrap.classList.add('dragging'); }
  if (!drag.moved) return;
  if (drag.kind === 'pan') {
    const scale = Math.min(wrap.clientWidth, wrap.clientHeight) / view.size;
    view.x = drag.vx - (e.clientX - drag.x) / scale; view.z = drag.vz - (e.clientY - drag.y) / scale; placeImage();
  } else if (drag.kind === 'move' || drag.kind === 'aim') {
    shift(drag.camera, wx - drag.wx, wz - drag.wz); drag.wx = wx; drag.wz = wz; drawMarks();
  } else {
    const [tx, ty] = toScreen(drag.camera.target.x, drag.camera.target.z);
    turn(drag.camera, Math.round(Math.atan2(-(sx - tx), sy - ty) * 180 / Math.PI)); drawMarks();
  }
});
wrap.addEventListener('pointerup', async e => {
  const d = drag; drag = null; wrap.classList.remove('dragging');
  if (!d) return;
  if (d.moved) {
    if (d.kind === 'pan') loadMap();
    else if (d.kind === 'move') change({x: d.camera.x, z: d.camera.z});
    else if (d.kind === 'aim') change({targetX: d.camera.target.x, targetZ: d.camera.target.z});
    else change({yaw: d.camera.yaw, orbit: true});
    return;
  }
  const [sx, sy] = local(e), [wx, wz] = toWorld(sx, sy);
  if (mode === 'place') { setMode(null); return placeAt(wx, wz); }
  if (mode === 'move' && selected) { setMode(null); return change({targetX: wx, targetZ: wz}); }
  if (d.camera) choose(d.camera.id);
});
wrap.addEventListener('wheel', e => {
  e.preventDefault();
  view.size = Math.max(32, Math.min(1024, view.size * (e.deltaY > 0 ? 1.15 : 1 / 1.15)));
  placeImage(); loadMap();
}, {passive: false});
addEventListener('resize', placeImage);

function setMode(next) {
  mode = mode === next ? null : next;
  $('place').setAttribute('aria-pressed', String(mode === 'place'));
  $('moveto').setAttribute('aria-pressed', String(mode === 'move'));
  wrap.classList.toggle('placing', !!mode);
}

const worldQuery = join => console_ ? `${join}world=${encodeURIComponent(console_.world)}` : '';

async function placeAt(x, z) {

/* --- the chosen camera --- */
const zoomOf = slider => Math.pow(2, slider);
const sliderOf = zoom => Math.log2(zoom);
const named = (list, id) => ((options[list] || []).find(o => o.id === id) || {name: id}).name;
/** What the shutter bar was last set to, per camera: a layout and a frame. */
const shot = {};
const shotOf = c => shot[c.id] || (shot[c.id] = {grid: ((options.grids[c.ratio] || [])[0] || {}).id || '', frame: '', name: c.name});

/** Brings a camera's frame into the middle of the map. */
function goTo(c) {

/** A slider with its value beside it, which can be typed into as well. */
const slider = (field, label, min, max, step, value, shownAs = v => Math.round(v)) =>
  `<div class="slider"><label for="f-${field}">${label}</label>`
  + `<input type="range" id="f-${field}" data-field="${field}" min="${min}" max="${max}" step="${step}" value="${value}">`
  + `<input class="num" id="n-${field}" data-num="${field}" value="${shownAs(value)}" aria-label="${label}"></div>`;

/** What a slider's number reads as, and what a typed number sends. */
const FIELDS = {
  yaw: {show: v => Math.round(v), send: v => ({yaw: v, orbit: true})},
  pitch: {show: v => Math.round(v), send: v => ({pitch: v, orbit: true})},
  zoom: {show: v => zoomOf(v).toFixed(2), read: typed => sliderOf(Math.max(0.05, Number(typed))), send: v => ({zoom: zoomOf(v)})},
};
const fieldOf = name => FIELDS[name] || {show: v => Math.round(v), send: v => ({[name]: v})};

/** Wires every slider under root: the number follows while dragging, the value is sent when let go or typed. */
function wireSliders(root) {
  for (const input of root.querySelectorAll('input[type=range]')) {
    fillRange(input);
    const name = input.dataset.field, f = fieldOf(name), num = root.querySelector(`[data-num="${name}"]`);
    input.oninput = () => { if (num) num.value = f.show(Number(input.value)); };
    input.onchange = () => change(f.send(Number(input.value)));
    if (num) num.onchange = () => {
      const v = f.read ? f.read(num.value) : Number(num.value);
      if (!Number.isFinite(v)) { num.value = f.show(Number(input.value)); return; }
      input.value = v; fillRange(input); change(f.send(Number(input.value)));
    };
  }
}

function panel() {
  const c = selected, p = $('panel');
  if (!c) { p.innerHTML = ''; return; }
  p.innerHTML = `
    <div class="viewer" id="viewer" style="aspect-ratio:${c.ratio.replace(':', ' / ')}">
      <img id="previewimg" alt="What ${esc(c.name)} sees"><div class="thirds" id="thirds" ${c.thirds ? '' : 'hidden'}></div><span class="spin" id="previewbusy"></span>
    </div>
    <div class="readout"><span id="readout"></span><span class="grow"></span>
      ${iconButton('grid', 'id="thirdsbtn"', c.thirds ? 'on' : '', 'Rule of thirds (T)')}</div>
    <section class="group"><header><h3>Aim</h3><span class="grow"></span>
      <button type="button" class="small quiet" id="reset" title="Face where you look, default tilt, zoom 1">${ico('reset', 'ico')}Reset aim</button></header>
      ${slider('yaw', 'Facing', -180, 180, 1, ((c.yaw + 540) % 360) - 180, FIELDS.yaw.show)}
      ${slider('pitch', 'Tilt', -10, 90, 1, c.pitch, FIELDS.pitch.show)}
      ${slider('zoom', 'Zoom', -4.3, 4, 0.05, sliderOf(c.zoom), FIELDS.zoom.show)}
      <div class="xyz"><input id="px" aria-label="X"><input id="py" aria-label="Y"><input id="pz" aria-label="Z">
        <button type="button" id="go" title="Move the camera to these coordinates">Move</button></div>

    <section class="group"><header><h3>Photos</h3><span class="note" id="photocount"></span></header><div class="photos" id="photolist"></div></section>`;
  wireSliders(p);

/** Puts what the camera now is into the panel without drawing it again, so open boxes and focus stay. */
function refresh() {
  const c = selected;
  if (!c || !$('readout')) return;
  $('readout').textContent = `${Math.round(c.blocks)} blocks across, ${Math.round(c.distance)} away`;
  const set = (name, value) => {
    const input = $(`f-${name}`), num = $(`n-${name}`);
    if (!input || document.activeElement === input || document.activeElement === num) return;
    input.value = value; fillRange(input); if (num) num.value = fieldOf(name).show(value);
  };
  set('yaw', ((c.yaw + 540) % 360) - 180); set('pitch', c.pitch); set('zoom', sliderOf(c.zoom));
  for (const [id, v] of [['px', c.x], ['py', c.y], ['pz', c.z]]) if (document.activeElement !== $(id)) $(id).value = v.toFixed(1);

/* --- the look: every setting as a chip with its value, each opening a box of its own --- */
const sunMatters = () => options.sunShadow || (options.sunDrawn && selected.bodies);
const LOOKS = [
  {id: 'ratio', label: 'Ratio', value: c => c.ratio, box: c => listBox('ratios', 'ratio', c.ratio, 'Aspect ratio')},
  {id: 'style', label: 'Style', value: c => named('styles', c.style), box: c => listBox('styles', 'style', c.style, 'Style')},
  {id: 'filter', label: 'Color', value: c => named('filters', c.filter), box: c => listBox('filters', 'filter', c.filter, 'Color filter')},
  {id: 'sky', label: 'Sky', value: c => named('skies', c.sky), box: c => listBox('skies', 'sky', c.sky, 'Sky')},
  {id: 'sun', label: 'Sun', value: c => (c.bodies ? 'Sun, moon, stars' : 'Plain sky') + (sunMatters() ? `, ${Math.round(c.sunPitch)}° up` : ''),
    on: c => c.bodies, box: sunBox},
  {id: 'fog', label: 'Fog', value: c => c.fog ? `${Math.round(c.fogStart)} to ${Math.round(c.fogEnd)}` : 'Off', on: c => c.fog, box: fogBox},
  {id: 'focus', label: 'Depth of field', value: c => c.focus ? `${Math.round(c.focusDistance)} blocks` : 'Off', on: c => c.focus, box: focusBox},
];
let openLook = null;

function chips() {
  const root = $('chips');

  if (!root.children.length) {
    root.innerHTML = LOOKS.map(l => `<button type="button" class="chip" data-look="${l.id}" aria-haspopup="true" aria-expanded="false"><small>${l.label}</small><span></span></button>`).join('');
    for (const b of root.children) b.onclick = () => openBox(b.dataset.look, b);
  }
  for (const l of LOOKS) {
    const b = root.querySelector(`[data-look="${l.id}"]`);

/**
 * Where a chip's box opens: beside the panel, over the map, level with the chip, so every other chip stays
 * in sight and in reach; under the chip where the panel is under the map. The same stand-in each time, so a
 * second click on the chip closes its box.
 */
function besideChip(chip) {
  return chip.besideAnchor || (chip.besideAnchor = {
    isConnected: true,
    contains: node => chip.contains(node),
    getBoundingClientRect() {
      const at = chip.getBoundingClientRect(), side = document.querySelector('.side').getBoundingClientRect();
      if (side.left < 300) return at;
      return {left: side.left - 8, right: side.left - 8, top: at.top - 4, bottom: at.top - 4, width: 0, height: 0};
    },
  });
}
function openBox(id, chip) {
  const look = LOOKS.find(l => l.id === id);
  const box = floatBox(besideChip(chip), 'izpop', '', true, () => { openLook = null; chip.setAttribute('aria-expanded', 'false'); });
  if (!box.isConnected) return;
  chip.setAttribute('aria-expanded', 'true');

}
/** Draws the open box again only when what it says has changed: drawn under a press, it would swallow the click. */
function drawBox() {
  const {look, box} = openLook;
  if (!box.isConnected) { openLook = null; return; }
  const html = look.box(selected);
  if (html === openLook.html) return;
  openLook.html = html;
  const scroll = box.scrollTop;
  box.innerHTML = html;
  wireChoices(box); wireSwitches(box); wireSliders(box);
  for (const b of box.querySelectorAll('[data-set]')) b.onclick = () => change(JSON.parse(b.dataset.set));
  for (const s of box.querySelectorAll('.switch input[data-toggle]')) s.onchange = () => change({[s.dataset.toggle]: s.checked});
  box.scrollTop = scroll;
}
const setAttr = fields => `data-set='${esc(JSON.stringify(fields))}'`;

/** A list of choices, the ones this player may not use shown shut, with why. */
function listBox(list, field, current, title) {
  return `<h4>${title}</h4><div class="opts">` + options[list].map(o =>
    `<button type="button" class="opt${o.id === current ? ' on' : ''}" ${o.allowed ? setAttr({[field]: o.id}) : 'disabled title="You do not have the permission for this"'}>`
    + `<span>${esc(o.name)}</span>${o.allowed ? '' : '<span class="lock">locked</span>'}</button>`).join('') + '</div>';
}
function toggleLine(field, label, on, allowed) {
  return `<div class="line">${switchField(null, on, `data-toggle="${field}"${allowed || on ? '' : ' disabled'}`)}<b>${label}</b>`
    + (allowed ? '' : '<span class="note">(no permission to turn it on)</span>') + '</div>';
}
function sunBox(c) {
  let html = '<h4>Sun</h4>' + toggleLine('bodies', 'Sun, moon and stars in the sky', c.bodies, options.may.bodies);
  if (sunMatters()) {
    html += slider('sunYaw', 'Direction', 0, 355, 5, c.sunYaw) + slider('sunPitch', 'Height', 1, 89, 1, c.sunPitch)
      + '<div class="suggest">'
      + (options.sunShadow ? `<button type="button" class="small" ${setAttr(c.suggest.sideLight)}>Side light</button>` : '')
      + (options.sunDrawn && c.bodies ? `<button type="button" class="small" ${setAttr(c.suggest.sunInFrame)}>Sun in the frame</button>` : '')
      + '</div>';
  } else html += '<p class="hint">With no shadows on this server and no sun in the sky, where the sun stands changes nothing.</p>';

}
function depthHint(c) {
  const d = c.suggest.depth;
  return d ? `<p class="hint">In this frame the ground lies ${d.near} to ${d.far} blocks away, most of it around ${d.median} (${d.sky}% sky).</p>`
    : '<p class="hint">The preview has not said yet how far this frame sees.</p>';
}
function fogBox(c) {
  let html = '<h4>Fog</h4>' + toggleLine('fog', 'On', c.fog, options.may.fog);
  if (c.sky === 'NONE') html += '<p class="hint">Fog takes the sky\'s color, and this sky is transparent: pick a sky for it to fade into.</p>';
  if (c.fog) {
    html += slider('fogStart', 'Begins', 0, c.depthLimit, 8, c.fogStart) + slider('fogEnd', 'Full', 8, c.depthLimit, 8, c.fogEnd) + depthHint(c);
    if (c.suggest.fog) html += `<div class="suggest"><button type="button" class="small" ${setAttr({fogStart: c.suggest.fog.start, fogEnd: c.suggest.fog.end})}>Use ${c.suggest.fog.start} to ${c.suggest.fog.end}</button></div>`;
  }

}

  let html = '<h4>Depth of field</h4>' + toggleLine('focus', 'On', c.focus, options.may.focus);
  if (c.focus) {
    html += slider('focusDistance', 'Distance', 1, c.depthLimit, 1, c.focusDistance) + depthHint(c);
    const f = c.suggest.focus;
    if (f) html += '<div class="suggest">'
      + (f.center ? `<button type="button" class="small" ${setAttr({focusDistance: f.center})}>The middle (${f.center})</button>` : '')
      + `<button type="button" class="small" ${setAttr({focusDistance: f.near})}>Nearest (${f.near})</button>`
      + `<button type="button" class="small" ${setAttr({focusDistance: f.median})}>Most of it (${f.median})</button></div>`;
  }

}

/** The camera as the server now has it, in place of the one the page held. */
function replace(updated) {
  const i = cameras.findIndex(c => c.id === updated.id);
  if (i >= 0) cameras[i] = updated;
  if (selected && selected.id === updated.id) selected = updated;
  drawMarks(); list(); refresh();
}

let changing = Promise.resolve();
/** Sends a change, one after another so two quick ones arrive in order, and redraws the preview. */
function change(fields) {
  if (!selected) return;
  const id = selected.id, ratio = selected.ratio;
  changing = changing.then(async () => {
    try {
      replace(await api(`cameras/${id}`, {method: 'PATCH', body: fields}));
      if (selected && selected.ratio !== ratio) shootBar();
      preview();
    } catch (e) {
      failed(e);
      // Put the marks back where the server still has them.
      try { const state = await api('state'); cameras = state.cameras; selected = cameras.find(c => c.id === id) || null; drawMarks(); refresh(); } catch (ignored) {}
    }
  });
}

let previewTicket = 0;
async function preview() {
  if (!selected) return;
  const ticket = ++previewTicket, box = $('viewer');
  box.classList.add('loading'); $('previewbusy').classList.add('on');
  const s = shotOf(selected);
  try {
    const blob = await api(`cameras/${selected.id}/preview?w=480` + (s.frame ? `&frame=${encodeURIComponent(s.frame)}&grid=${encodeURIComponent(s.grid)}` : ''), {raw: true});
    if (ticket !== previewTicket) return;
    const url = URL.createObjectURL(blob), image = $('previewimg');
    image.onload = () => URL.revokeObjectURL(url);
    image.src = url;
    // The preview is what the scene's depth is read off; the suggestions come with the camera.
    const fresh = await api(`cameras/${selected.id}`);
    if (ticket === previewTicket) replace(fresh);
  } catch (e) { failed(e); }
  finally { if (ticket === previewTicket && $('viewer')) { $('viewer').classList.remove('loading'); $('previewbusy').classList.remove('on'); } }
}

/* --- the shutter bar: a layout, a frame, take the photo, or save or copy it --- */
function frameChoices(empty) {
  return [['', empty]].concat(options.frames.filter(f => f.allowed).map(f => [f.id, f.name]));
}
function shootBar() {
  const c = selected, bar = $('shoot');

  if (!c) return;
  const s = shotOf(c), grids = options.grids[c.ratio] || [];
  if (!grids.find(g => g.id === s.grid)) s.grid = (grids[0] || {}).id || '';
  bar.innerHTML = `
    <div class="pair">
      <div><label>Layout</label>${select('grid', grids.map(g => [g.id, `${g.id}`, `${g.width}x${g.height}`]), s.grid)}</div>

    </div>

    <div class="out">
      <button type="button" id="saveshot" title="Shoot it at full size and save it as a PNG">${ico('save', 'ico')}Save PNG</button>
      <button type="button" id="copyshot" title="Shoot it at full size and copy the picture">${ico('copy', 'ico')}Copy</button>
    </div>

  wireChoices(bar);

  $('frame').onchange = () => { s.frame = $('frame').value; preview(); };

  $('saveshot').disabled = $('copyshot').disabled = !options.may.export;
  $('saveshot').onclick = () => saveImage(busy($('saveshot'), shootFile()), fileName(s.name, s.grid));
  $('copyshot').onclick = () => copyImage(busy($('copyshot'), shootFile()));
}
function shootFile() {
  const s = shotOf(selected);
  toast('ok', `Shooting ${s.grid}`, ['It waits in line with the game\'s photos; a wide one takes a while.'], 4000);
  return api(`cameras/${selected.id}/export`, {method: 'POST', body: {grid: s.grid, frame: s.frame}, raw: true});
}
/** Marks a button busy while what it started runs, and hands that on. */
function busy(button, promise) {
  button.classList.add('busy');
  promise.finally(() => button.classList.remove('busy')).catch(() => {});
  return promise;
}
const fileName = (name, grid) => `${(name || 'photo').replace(/[^A-Za-z0-9._-]+/g, '-')}${grid ? '-' + grid : ''}.png`;
async function saveImage(promise, name) {
  try {
    const blob = await promise, url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    said(`Saved ${name}`);
  } catch (e) { failed(e); }
}
/**
 * The picture goes to the clipboard as it arrives: the browser lets a page write to it only while the click

 */
function copyImage(promise) {
  if (!navigator.clipboard || typeof ClipboardItem === 'undefined') {
    promise.catch(() => {});
    return toast('bad', 'This browser cannot copy pictures', ['Use Save PNG instead.']);
  }
  let refused = false;
  promise.catch(e => { refused = true; failed(e); });
  navigator.clipboard.write([new ClipboardItem({'image/png': promise})])
    .then(() => said('Copied to the clipboard'), e => { if (!refused) failed(new Error('Could not copy: ' + e.message)); });
}
async function takePhoto() {
  const c = selected, s = shotOf(c);
  try {
    const r = await api(`cameras/${c.id}/photo`, {method: 'POST', body: {name: $('photoname').value, grid: s.grid}});
    said('Taking the photo', [r.message]);
    const before = c.photos;
    for (let i = 0; i < 60; i++) {
      await new Promise(go => setTimeout(go, 3000));
      if (!selected || selected.id !== c.id) return;
      const list = await api(`cameras/${c.id}/photos`);
      if (list.length > before) { c.photos = list.length; list.length && drawPhotos(list); return refreshCount(); }
    }
  } catch (e) { failed(e); }
}

/* --- the camera's photos: a picture each, its frame, save and copy --- */
async function photos() {
  if (!selected) return;
  try { drawPhotos(await api(`cameras/${selected.id}/photos`)); } catch (e) { failed(e); }
}
function refreshCount() { list(); }
function drawPhotos(items) {
  const root = $('photolist');
  if (!root) return;
  $('photocount').textContent = items.length ? `(${items.length})` : '';
  if (!items.length) { root.innerHTML = '<div class="empty">None yet. Take one below; in the game it hangs from the camera\'s list.</div>'; return; }
  root.innerHTML = items.slice().reverse().map(p => `
    <div class="photo" data-photo="${p.id}">
      <img class="thumb" alt="">
      <div class="what"><b title="${esc(p.name)}">${esc(p.name)}</b><small>${p.grid}, ${p.width}x${p.height}${p.placed ? ', hanging' : ''}</small>
        <div class="acts">
          ${p.frameEditable ? select2(`data-reframe="${p.id}"`, frameChoices('No frame'), p.frame || '') : `<span class="note">Frame is part of it</span>`}
          ${iconButton('save', `data-save="${p.id}"${options.may.export ? '' : ' disabled'}`, '', 'Save PNG')}
          ${iconButton('copy', `data-copy="${p.id}"${options.may.export ? '' : ' disabled'}`, '', 'Copy')}
        </div></div>
    </div>`).join('');
  wireChoices(root);
  for (const item of items) thumbnail(item);
  for (const pick of root.querySelectorAll('[data-reframe]')) pick.onchange = async () => {
    try { const p = await api(`photos/${pick.dataset.reframe}`, {method: 'PATCH', body: {frame: pick.value}}); thumbnail(p); }
    catch (e) { failed(e); }
  };
  for (const b of root.querySelectorAll('[data-save]')) b.onclick = () => {
    const p = items.find(i => i.id === b.dataset.save);
    saveImage(busy(b, api(`photos/${p.id}/image`, {raw: true})), fileName(p.name, p.grid));
  };
  for (const b of root.querySelectorAll('[data-copy]')) b.onclick = () => copyImage(busy(b, api(`photos/${b.dataset.copy}/image`, {raw: true})));
}
async function thumbnail(p) {
  const at = document.querySelector(`[data-photo="${p.id}"] .thumb`);
  if (!at) return;
  try {
    const url = URL.createObjectURL(await api(`photos/${p.id}/image?w=160`, {raw: true}));
    at.onload = () => URL.revokeObjectURL(url);
    at.src = url;
  } catch (e) { failed(e); }
}

/* --- keys --- */
const KEYS = [
  ['← →', 'Turn the camera (Shift: 15° at a time)'], ['↑ ↓', 'Tilt it'], ['+ −', 'Zoom in and out'],
  ['T', 'Rule of thirds'], ['P', 'Place a camera'], ['A', 'Aim the chosen camera at a click'],
  ['[ ]', 'The previous or next camera'], ['?', 'This list'], ['Esc', 'Close a box, or stop placing'],
];
$('keyhelp').onclick = showKeys;
function showKeys() {
  dialog({title: 'Keyboard shortcuts', only: true, doneLabel: 'Close', body: `<div class="keys">${KEYS.map(([k, what]) => `<kbd>${esc(k)}</kbd><span>${esc(what)}</span>`).join('')}</div>`, done: () => {}});
}
let nudgeTimer = null, nudged = {};
/** Keys move the camera on the page at once and send the change once they stop. */
function nudge(fields) {
  const c = selected;
  if (fields.yaw !== undefined) turn(c, fields.yaw);
  Object.assign(c, fields);
  Object.assign(nudged, fields);
  drawMarks(); refresh();
  clearTimeout(nudgeTimer);
  nudgeTimer = setTimeout(() => { const send = nudged; nudged = {}; change({...send, ...(send.yaw !== undefined || send.pitch !== undefined ? {orbit: true} : {})}); }, 300);
}
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input, select, textarea, [contenteditable]')) return;
  if (dialogOpen || asking || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '?') { e.preventDefault(); return showKeys(); }
  if (e.key === 'Escape') { closeSlotPick(); if (mode) setMode(mode); return; }
  if (e.key === 'p' || e.key === 'P') return setMode('place');
  if (!selected) return;
  const step = e.shiftKey ? 15 : 5;
  const keys = {
    ArrowLeft: () => nudge({yaw: Math.round(selected.yaw - step)}),
    ArrowRight: () => nudge({yaw: Math.round(selected.yaw + step)}),
    ArrowUp: () => nudge({pitch: Math.min(90, selected.pitch + (e.shiftKey ? 10 : 2))}),
    ArrowDown: () => nudge({pitch: Math.max(-10, selected.pitch - (e.shiftKey ? 10 : 2))}),
    '+': () => nudge({zoom: Math.min(16, selected.zoom * 1.25)}), '=': () => nudge({zoom: Math.min(16, selected.zoom * 1.25)}),
    '-': () => nudge({zoom: Math.max(0.05, selected.zoom / 1.25)}),
    t: () => change({thirds: !selected.thirds}), T: () => change({thirds: !selected.thirds}),
    a: () => setMode('move'), A: () => setMode('move'),
    '[': () => cameras.length && choose(cameras[(cameras.indexOf(selected) - 1 + cameras.length) % cameras.length].id),
    ']': () => cameras.length && choose(cameras[(cameras.indexOf(selected) + 1) % cameras.length].id),
  };
  if (keys[e.key]) { e.preventDefault(); keys[e.key](); }
});

async function enter(world) {
  try {
    const state = await api('state' + (world ? `?world=${encodeURIComponent(world)}` : ''));
    options = state.options; cameras = state.cameras; me = {x: state.x, z: state.z};
    selected = null;
    if (state.console) {
      console_ = {world: state.world, worlds: state.worlds, owners: state.owners, owner: console_ && console_.owner};
      $('who').textContent = 'Console in';
      $('worldpick').innerHTML = select('worldsel', state.worlds, state.world);
      wireChoices($('worldpick'));
      $('worldsel').onchange = () => enter($('worldsel').value);
    } else $('who').textContent = `${state.player} in ${state.world}`;
    $('panel').innerHTML = ''; $('shoot').hidden = true;
    // The console stands nowhere: it starts at the first camera, or at the world's spawn.
    if (console_ && cameras.length) me = {x: cameras[0].target.x, z: cameras[0].target.z};
    view.x = me.x; view.z = me.z; Object.assign(shown, view);
    list(); placeImage(); loadMap();
    if (cameras.length) choose(cameras[0].id);
  } catch (e) { failed(e); }
}

if (!tunneled) enter();
else {
  let entered = false;
  relay.on('hello', () => { $('gate').classList.remove('on'); if (!entered) { entered = true; enter(); } });
  relay.on('lost', () => gate('Connecting', 'Waiting for your server...'));
  relay.on('back', () => $('gate').classList.remove('on'));
  relay.on('refused', text => gate('This link has ended', text));
  gate('Connecting', 'Waiting for your server...');
  relay.start();
}
</script>
