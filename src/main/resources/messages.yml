# Izomap messages, in MiniMessage: https://docs.advntr.dev/minimessage/format.html
# Placeholders and how to translate this file: https://zypec.github.io/izomap/wiki/#messages

prefix: "<gradient:#5e60ce:#48bfe3><bold>Izomap</bold></gradient> <dark_gray>»</dark_gray> "

general:
  player-only: "<prefix> <red>Only players can use this command."
  reloaded: "<prefix> <green>Configuration reloaded."
  # Shown beside the command in /help, as plain text.
  command-description: "Izomap camera commands"

camera:
  created: "<prefix> <green>Camera created: <white><name></white>"
  removed: "<prefix> <yellow>Camera removed: <white><name></white>"
  removed-all: "<prefix> <yellow>Removed <count> camera(s)."
  orphans-cleaned: "<prefix> <yellow>Cleaned up <count> orphaned camera model(s). <gray>(Entities left in the world after their record was deleted; only loaded chunks are searched.)"
  moved: "<prefix> <green>Camera moved: <white><name></white>"
  not-found: "<prefix> <red>Camera not found."
  limit-reached: "<prefix> <red>You have reached the maximum number of cameras (<limit>)."
  given-item: "<prefix> <green>A camera item was added to your inventory."
  item-dropped: "<prefix> <yellow>Your inventory is full; the camera item was dropped at your feet."
  reset: "<prefix> <yellow>Camera aim reset: <white><name></white> <gray>(zoom, direction and tilt are back to their defaults)"
  # <count> is the number of photos deleted with the camera.
  picked-up: "<prefix> <green>Camera picked up: <white><name></white> <gray>(item returned, <count> photo(s) deleted)"
  picked-up-no-item: "<prefix> <yellow>Camera taken down: <white><name></white> <gray>(it was made by command, so there is no item to return; <count> photo(s) deleted)"
  name-taken: "<prefix> <red>You already have a camera called <white><name></white>."
  # Clicking somebody else's camera: anyone may watch it, only its owner may adjust it.
  view-only: "<prefix> <gray><white><name></white> is <white><owner></white>'s camera: you can watch it, not adjust it."
  list-header: "<prefix> <gray>Cameras (<count>):"
  list-entry: "<prefix> <dark_gray>› <white><name></white> <gray>(<ratio>, zoom <scale>x)"
  list-empty: "<prefix> <gray>You have no cameras yet."
  shallow-pitch: "<prefix> <yellow>The camera is looking almost level (<pitch>°). For an isometric shot tilt it between <white>20 and 45°</white>, or half the photo will be sky and half a cross-section of the ground."
  # Sent after the line above, only to a player with izomap.focus who has not turned focus on.
  shallow-pitch-focus: "<prefix> <gray>This is the framing depth shows best in: the <white>Focus</white> button on the capture screen keeps one distance sharp and blurs the rest."
  item-name: "<gradient:#5e60ce:#48bfe3>Izomap Camera</gradient>"
  item-lore:
    - "<gray><white>Right-click</white> a block to place a camera."
  # The hologram above a camera, one line per entry; an empty list leaves it blank.
  # Placeholders: <name> <owner> <ratio> <zoom> <blocks> <yaw> <pitch> <filter> <style> <sky> <photos>
  hologram:
    # Added below the lines while a photo is being taken. <percent> and <bar> work here.
    capturing: "<gold>◉ Taking a photo <bar> <percent>%"
    lines:
      - "<aqua><name>"
      - "<white><ratio> <gray>·</gray> <zoom>x <gray>(<blocks> blocks)</gray>"
      - "<yellow>Facing <yaw>° <dark_gray>·</dark_gray> Tilt <pitch>°"
      - "<gray><photos> photo(s) · <filter> · <style>"

# The live preview: one map per camera, any number of viewers, one editor.
preview:
  started: "<prefix> <green>Preview open: <white><camera></white> <gray>(the map in your off hand is the live view; close it with <white>/izocam preview stop</white>)"
  already: "<prefix> <gray>You are already watching this camera."
  offhand-full: "<prefix> <red>Your off hand has to be empty for the preview."
  not-active: "<prefix> <gray>You have no preview open."
  busy: "<prefix> <yellow><white><editor></white> is adjusting this camera right now; you joined as a viewer."
  ended-self: "<prefix> <gray>Preview closed."
  ended-dropped: "<prefix> <gray>You let go of the map, so the preview closed."
  ended-died: "<prefix> <gray>The preview closed because you died."
  ended-camera-removed: "<prefix> <yellow>The preview closed because the camera was removed: <white><camera></white>"
  # Refreshed every second. <entries> is the entry templates below, joined by the separator;
  # the property being adjusted uses entry-active.
  actionbar: "<entries>"
  actionbar-rendering: "<entries><dark_gray>  ·  </dark_gray><yellow>⟳ Updating</yellow>"
  # While a photo is being taken. <percent> is how much is done, <bar> a ten-box bar.
  actionbar-capturing: "<entries><dark_gray>  ·  </dark_gray><gold><bold>◉ Shooting <bar> <percent>%</bold></gold>"
  actionbar-separator: "<dark_gray>  ·  </dark_gray>"
  entry: "<gray><label> <white><value></white></gray>"
  entry-active: "<yellow><bold><label> <value></bold></yellow>"
  value-angle: "<deg>°"
  value-zoom: "<zoom>x <gray>(<blocks> blocks)</gray>"
  value-position: "<x>, <y>, <z>"
  property:
    YAW: "Facing"
    PITCH: "Tilt"
    ZOOM: "Zoom"
    MOVE: "Move"

# Decoration frame names, by their id in frames.yml. A frame with no name here shows its id.
frame:
  WOOD: "<#7A5A32>Wood"
  GOLD: "<#E5C34C>Gold"
  BLACK: "<dark_gray>Black"
  MAT: "<white>Mat"
  STONE: "<gray>Stone"
  ROPE: "<#B08D57>Rope"
  ORNATE: "<#D4AF37>Ornate"
  applied: "<prefix> <green>Frame added: <frame> <gray>(<name>)"
  applied-embedded: "<prefix> <green>Frame added: <frame> <gray>(<name>). It is now part of the photo and can no longer be changed."
  removed: "<prefix> <green>Frame removed: <white><name></white>"
  locked: "<prefix> <yellow>This photo's frame is part of the photo; it cannot be changed."
  unknown: "<prefix> <red>There is no frame called <white><frame></white>."
  not-allowed: "<prefix> <red>You cannot use this frame: <frame>"
  none-allowed: "<prefix> <yellow>There is no frame you can use."
  failed: "<prefix> <red>The frame could not be applied. The server log has the details."

# Setting names, used to say which setting a missing permission blocks.
setting:
  style: "<white>Style"
  filter: "<white>Color filter"
  sky: "<white>Sky"
  sky-bodies: "<white>Sun, moon and stars"
  ratio: "<white>Aspect ratio"
  focus: "<white>Depth of field"

# The value of setting.focus and setting.sky-bodies in that same message. The key is quoted:
# a bare on is read as the boolean true.
focus:
  "on": "<green>On"

sky-bodies:
  "on": "<green>On"

# Color filter names, by their id in filters.yml. A filter with no name here shows its id.
filter:
  ORIGINAL: "<white>Original"
  WARM: "<gold>Warm"
  COOL: "<aqua>Cool"
  GRAYSCALE: "<gray>Black and white"
  SEPIA: "<#C0955F>Sepia"
  VIVID: "<green>Vivid"
  NOIR: "<dark_gray>Noir"

sky:
  NONE: "<gray>Transparent"
  WORLD: "<white>Game time"
  DAWN: "<#FF9E6B>Dawn"
  DAY: "<aqua>Day"
  DUSK: "<#FF7A4D>Dusk"
  NIGHT: "<blue>Night"

style:
  SHARP: "<white>Sharp"
  FAST: "<yellow>Fast"

# Placing a photo: a ghost shows where it will hang until it is confirmed.
placement:
  started: "<prefix> <green>Placing <white><name></white>. <gray>Aim the ghost where you want it, <white>right-click</white> to confirm, <white>shift + right-click</white> to cancel."
  # Put in the off hand while placing. Not decoration: the client sends no right-click for an
  # empty hand, so confirming depends on this item.
  item-name: "<gradient:#5e60ce:#48bfe3>Placing</gradient> <dark_gray>·</dark_gray> <white><name></white>"
  item-lore:
    - "<gray><white>Right-click</white> to confirm."
    - "<gray><white>Shift + right-click</white> to cancel."
  actionbar: "<green>Right-click: place</green> <dark_gray>·</dark_gray> <gray>Shift + right-click: cancel"
  actionbar-blocked: "<red>It does not fit here</red> <dark_gray>·</dark_gray> <gray>Frames need empty space with something solid behind"
  blocked: "<prefix> <red>It cannot go here; look somewhere else until the ghost turns green."
  not-active: "<prefix> <gray>You are not placing anything."
  ended-self: "<prefix> <gray>Placement cancelled."
  ended-timeout: "<prefix> <gray>Placement timed out."
  ended-died: "<prefix> <gray>Placement cancelled because you died."
  ended-world-change: "<prefix> <gray>Placement cancelled because you changed worlds."
  ended-photo-removed: "<prefix> <yellow>Placement cancelled because the photo was deleted."

photo:
  capturing: "<prefix> <gray>Taking the photo, please wait..."
  captured: "<prefix> <green>Photo taken: <white><name></white> <gray>[<id>] (<ms> ms). Hang it from the camera's Photos list."
  failed: "<prefix> <red>The photo could not be taken."
  too-large: "<prefix> <red>The frame is too wide: it needs <white><required></white> chunks and the limit is <white><budget></white> <gray>(settings.max-capture-area)</gray>. Zoom in."
  exporting: "<prefix> <gray>Writing the photo to a file: <white><name></white>..."
  saved: "<prefix> <green>Photo saved: <white><file></white> <gray>(<width>x<height>, <size> KB, <ms> ms)"
  export-failed: "<prefix> <red>The photo could not be exported. The server log has the details."
  ratio-set: "<prefix> <green>Aspect ratio set: <white><ratio></white>"
  invalid-ratio: "<prefix> <red>That is not an aspect ratio. Choose 1:1, 16:9 or 4:3."
  # The limit is per camera and counts photos that are not hung too.
  limit-reached: "<prefix> <red>This camera can hold at most <limit> photo(s). <gray>Delete one from its list to take another."
  # The camera has a setting the player has no permission for, usually set by someone else.
  setting-not-allowed: "<prefix> <red>You cannot take a photo with <setting> set to <value>. <gray>Change it on the capture screen and try again."
  grid-not-allowed: "<prefix> <red>A <grid> grid takes <white><tiles></white> maps and your limit is <white><limit></white>. <gray>Choose a smaller grid."

map:
  invalid-grid: "<prefix> <red>That grid does not fit this aspect ratio. <gray>For <ratio>: <white><grids></white></gray>"
  created: "<prefix> <green><count> map(s) made (<grid>) and added to your inventory. <gray>(<ms> ms)</gray>"
  inventory-full: "<prefix> <yellow>Some maps did not fit in your inventory and were dropped."
  placed: "<prefix> <green>Photo hung: <white><name></white> <gray>(<count> maps)"
  place-blocked: "<prefix> <red>The photo could not be hung: the spot is no longer free. Look somewhere else and try again."
  still-loading: "<prefix> <yellow>This photo is still loading; try again in a moment."
  orphan-frame: "<prefix> <gray>Removed an Izomap item frame that belonged to no photo."
  orphan-frames-cleaned: "<prefix> <yellow>Cleaned up <count> orphaned photo frame(s). <gray>(Frames no record claims; only loaded chunks are searched.)"
  name-taken: "<prefix> <red>You already have a photo called <white><name></white>."
  photos-header: "<prefix> <gray>Photos (<count>):"
  photos-entry: "<prefix> <dark_gray>› <white><name></white> <gray>[<id>] <camera>, <grid> <dark_gray>· not hung"
  photos-entry-placed: "<prefix> <dark_gray>› <white><name></white> <gray>[<id>] <camera>, <grid> <green>· hung"
  photos-empty: "<prefix> <gray>You have no photos yet."
  photo-taken-down: "<prefix> <yellow>Photo taken off the wall: <white><name></white> <gray>(it stays in the list, so you can hang it again)"
  photo-not-placed: "<prefix> <gray>This photo is not on a wall: <white><name></white>"
  photo-deleted: "<prefix> <yellow>Photo deleted: <white><name></white>"
  photos-removed-all: "<prefix> <yellow>Deleted <count> photo(s)."
  photo-not-found: "<prefix> <red>Photo not found."
  cleaned: "<prefix> <green><count> photo(s) had lost their frames and are now listed as not hung."
  photo-retaken: "<prefix> <green>Photo retaken: <white><name></white> <gray>(camera <camera>, <ms> ms)"
  photo-no-source: "<prefix> <red>This photo cannot be retaken: the camera <white><camera></white> is gone and the photo has no capture settings saved. <gray>Name a camera to shoot it with: <white>/izocam retake with &lt;camera&gt; &lt;camera/photo&gt;</white>"

dialog:
  title: "<gradient:#5e60ce:#48bfe3>Izomap Photo</gradient>"
  # The camera's current settings; they are changed by clicking the camera, not here.
  # Placeholders: <camera> <ratio> <scale> <blocks> <yaw> <pitch>
  info: "<gray>Camera: <white><camera></white>  •  Ratio: <white><ratio></white>  •  Zoom: <white><scale></white>x <dark_gray>(<blocks> blocks)</dark_gray>  •  Facing: <white><yaw></white>°  •  Tilt: <white><pitch></white>°"
  name-label: "Photo name"
  grid-label: "Layout (grid)"
  # Each click moves to the next value. <value> is its name under filter., style. or sky.
  filter-button: "Color: <value>"
  style-button: "Style: <value>"
  sky-button: "Sky: <value>"
  sky-title: "<gradient:#5e60ce:#48bfe3>Sky</gradient>"
  sky-body: "<gray>Which sky goes behind the photo? <white>Game time</white> freezes the hour the photo is taken at."
  sky-body-none: "<gray>A transparent sky leaves a hole wherever a ray hits nothing, so the photo can hang without a background. The sun, moon and stars need a sky to be drawn on."
  sky-option: "<value>"
  sky-option-active: "<value> <green>✔"
  sky-bodies: "Sun, moon and stars: <gray>Off"
  sky-bodies-active: "Sun, moon and stars: <green>On ✔"
  sky-back: "Back"
  grid-option: "<grid> · <count> maps (<wpx>x<hpx> px)"
  capture-full: "<red>Limit reached (<limit>)"
  pickup-button: "<red>Pick up camera"
  # Undoes only what clicking the camera sets: zoom, direction and tilt.
  reset-button: "<red>Reset aim"
  pickup-title: "<gradient:#5e60ce:#48bfe3>Pick up camera</gradient>"
  pickup-body: "<white><name></white> will be taken down, and the <white><count></white> photo(s) it took will be deleted with it. Photos belong to their camera and cannot be retaken without it."
  pickup-body-empty: "<white><name></white> will be taken down and its item returned to your inventory."
  pickup-confirm: "Pick up"
  pickup-cancel: "Cancel"
  ratio-button: "<gray>Ratio: <ratio>"
  ratio-button-active: "<bold><white>Ratio: <ratio> ✔</white></bold>"
  # Depth of field is part of the photo. The slider shows only while it is on, and its value
  # reaches the server when a button on the screen is pressed.
  focus-button: "Focus: <gray>Off"
  focus-button-active: "Focus: <green>On ✔"
  focus-label: "Focus distance (blocks)"
  # A 3x3 guide drawn on the preview only, never on the photo.
  thirds-button: "Rule of thirds: <gray>Off"
  thirds-button-active: "Rule of thirds: <green>On ✔"
  # Takes the photo without hanging it; hanging is done from the Photos list.
  capture: "<bold><green>Take photo</green></bold>"
  photos-button: "Photos (<count>)"
  cancel: "Cancel"

  photos-title: "<gradient:#5e60ce:#48bfe3>Photos</gradient>"
  photos-body: "<gray><white><count></white> photo(s) taken with <camera>. The buttons on each row: rename, hang or take down, delete, retake."
  photos-empty: "<gray>You have not taken a photo with <camera> yet."
  photos-back: "← Capture screen"
  photos-truncated: "<dark_gray><count> more photo(s); <white>/izocam list photos</white> shows them all."
  photo-name: "<name>"
  photo-place: "⬛ Hang"
  photo-unplace: "⇩ Take down"
  photo-delete: "✖ Delete"
  photo-retake: "⟳ Retake"

  rename-title: "Rename photo"
  rename-body: "<gray>Current name: <white><name></white>"
  rename-confirm: "Save"

  delete-title: "Delete photo"
  delete-body: "<gray><white><name></white> will be deleted for good: its image, its capture settings and, if it is hung, its frames. This cannot be undone."
  delete-confirm: "✖ Delete"
  # The screen a right-click on a hung photo opens.
  wall-title: "<white>Photo: <name>"
  wall-body: "<gray>Camera: <white><camera></white> · Grid: <white><grid></white>"
  wall-frame-none: "<gray>Frame: <white>none"
  wall-frame-current: "<gray>Frame: <frame>"
  wall-frame-locked: "<gray>Frame: <frame> <dark_gray>(part of the photo, cannot be changed)"
  wall-retake: "<yellow>Retake"
  wall-frame: "<aqua>Add a frame"
  wall-frame-change: "<aqua>Change the frame"
  wall-take-down: "<red>Take off the wall"
  frame-title: "<white>Choose a frame"
  frame-body: "<gray>The frame is drawn around the edge of the photo; you can change or remove it at any time."
  frame-body-embed: "<gray>On this server a frame becomes <white>part of the photo</white>: once added it cannot be changed."
  frame-option: "<white><frame>"
  frame-option-active: "<green>✔ <frame>"
  frame-remove: "<red>Remove the frame"
  frame-back: "<gray>Back"
  delete-cancel: "Cancel"

# Lines written to the server log. <reason> carries Java's own error text.
log:
  enabled: "Izomap enabled."
  disabled: "Izomap disabled."
  no-reason: "no reason given"

  cameras-loaded: "Loaded <count> camera(s)."
  photos-loaded: "Loaded <count> photo(s)."
  frames-loaded: "Loaded <count> frame(s) from frames.yml."
  frame-ring-invalid: "Frame <frame> has an invalid ring (color or width); that ring was skipped."
  frame-art-invalid: "Frame <frame> has invalid edge rows (empty or of different lengths); the frame was not loaded."
  frame-corner-invalid: "Frame <frame> has a corner that is not square or not as deep as its edge; the corner was skipped."
  frame-texture-missing: "Could not read the PNG of frame <frame>: frames/<file>"
  frame-texture-inset: "Frame <frame> has an invalid inset (it must be above 0 and below half the shorter side); the frame was not loaded."
  frame-failed: "Could not draw the frame onto photo <name>: <reason>"
  photo-refresh-failed: "Could not refresh the maps of photo <name>: <reason>"
  filters-loaded: "Loaded <count> color filter(s)."
  filter-unknown-op: "<file>: unknown operation '<op>' in filter '<filter>', skipped."
  block-colors-ready: "Map base colors ready for <count> blocks."
  state-colors-ready: "<count> block(s) change color as they grow; each state was read on its own."
  block-colors-corrected: "Replaced the map color of <count> block(s) with one closer to their texture."
  block-colors-overridden: "Overrode the color of <count> block(s)."
  coverage-ready: "<count> block(s) do not fill their cell; rays will see past them and blend."
  biome-tints-ready: "Read grass, foliage and water colors for <count> biome(s) from the server."
  biome-tints-overridden: "Overrode the color of <count> biome(s) (biome-tints.yml)."
  camera-world-missing: "Skipped camera '<camera>': its world is not loaded (<world>)."

  risky-frame-shift: "<yellow>photo.frame-shift = <value> moves the frame above the camera. With a level or upward camera no ray reaches the ground and photos come out EMPTY. 0.0 is recommended (the point the camera looks at becomes the center of the frame)."
  invalid-item-display-transform: "camera.item-display-transform = '<value>' is not valid; using NONE. Valid values: <options>"
  invalid-hologram-billboard: "camera.hologram.billboard = '<value>' is not valid; using CENTER. Valid values: <options>"
  invalid-hologram-background: "camera.hologram.background = '<value>' is not valid; using the vanilla background. Expected 'default', 'none' or #AARRGGBB."
  unknown-base-colors: "<count> block(s) reported an unknown map base color and were matched to the nearest one. (The MapBaseColor table needs updating.)"
  override-unknown-block: "<file>: unknown block '<block>', skipped."
  override-invalid-color: "<file>: invalid color '<color>' for '<block>', skipped."
  coverage-invalid: "<file>: invalid coverage '<value>' for '<block>', skipped (it must be a number from 0.0 to 1.0)."
  tint-channel-invalid: "<file>: invalid tint channel '<channel>' for '<block>', skipped. Expected GRASS, FOLIAGE, WATER or NONE."
  biome-tint-unknown: "<file>: unknown biome '<biome>', skipped."
  biome-tint-invalid: "<file>: invalid color '<color>' for '<biome>', skipped."
  biome-tint-unavailable: "<yellow>Could not read biome colors from the server, so biome tint is off: <reason>"
  biome-tint-no-reference: "<yellow>The reference biome '<biome>' was not found, so biome tint is off."

  # A missing chunk copy leaves a chunk-sized transparent hole in the photo.
  chunks-incomplete: "<missing> of the <requested> chunks in the frame could not be copied (<world>); those parts of the photo will be transparent. Most likely the chunks were never generated (settings.generate-missing-chunks is off) or settings.load-missing-chunks is off."
  # Written on every capture while settings.render-timing is on.
  render-timing: "Render <width>x<height>, <samples>x sampling, <chunks> chunks: copy <copy> ms, ray walk <render> ms."
  map-render-failed: "Map render failed (<camera>): <reason>"
  photo-render-failed: "Photo render failed (<camera>): <reason>"
  photo-recapture-failed: "Could not retake photo '<name>': <reason>"
  photo-unrestorable: "Photo '<name>' (<id>) is neither cached nor has capture settings; its maps were left as they were."
  photo-unplaceable: "Could not hang photo '<name>', its image is unavailable: <reason>"
  # A frame that was not found may still be in the world; /izocam cleanup collects it.
  frames-missing: "<missing> of the <total> frames of photo '<name>' (<id>) were not found while taking it down; they may still be in the world."
  photo-export-failed: "Could not export photo (<id>): <reason>"

  data-file-create-failed: "Could not create data file <file> (<reason>)"
  data-file-save-failed: "Could not save data file <file> (<reason>)"
  data-file-save-failed-sync: "Could not save data file <file> synchronously (<reason>)"
  photo-cache-write-failed: "Could not write the photo cache (<photo>): <reason>"
  photo-cache-read-failed: "Could not read the photo cache (<photo>): <reason>. It will be retaken from its settings."
  photo-cache-delete-failed: "Could not delete the photo cache (<photo>): <reason>"
  photo-cache-scan-failed: "Could not scan the photo cache: <reason>"
  photo-cache-swept: "Deleted <count> orphaned photo cache file(s)."
