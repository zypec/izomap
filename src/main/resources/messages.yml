# ============================================================
#  Izomap - Mesajlar (MiniMessage formatı)
#  Renk/format için: https://docs.advntr.dev/minimessage/format.html
# ============================================================

prefix: "<gradient:#5e60ce:#48bfe3><bold>Izomap</bold></gradient> <dark_gray>»</dark_gray> "

general:
  player-only: "<prefix> <red>Bu komut yalnızca oyuncular tarafından kullanılabilir."
  reloaded: "<prefix> <green>Yapılandırma yeniden yüklendi."
  # /help listesinde komutun yanında görünür; renk etiketi kullanma, düz metne çevrilir.
  command-description: "Izomap kamera komutları"

camera:
  created: "<prefix> <green>Kamera oluşturuldu: <white><name></white>"
  removed: "<prefix> <yellow>Kamera silindi: <white><name></white>"
  removed-all: "<prefix> <yellow><count> kamera silindi."
  orphans-cleaned: "<prefix> <yellow><count> sahipsiz kamera modeli temizlendi. <gray>(Kaydı silinmiş ama dünyada kalmış entity'ler; yalnızca yüklü chunk'lar taranır.)"
  moved: "<prefix> <green>Kamera taşındı: <white><name></white>"
  not-found: "<prefix> <red>Kamera bulunamadı."
  limit-reached: "<prefix> <red>Maksimum kamera sayısına ulaştın (<limit>)."
  given-item: "<prefix> <green>Kamera yerleştirme eşyası envanterine eklendi."
  item-dropped: "<prefix> <yellow>Envanterin dolu; kamera eşyası yere düştü."
  # <count> = kamerayla birlikte silinen fotoğraf sayısı.
  reset: "<prefix> <yellow>Kameranın nişanı sıfırlandı: <white><name></white> <gray>(zoom, yön ve eğim varsayılana döndü)"
  picked-up: "<prefix> <green>Kamera toplandı: <white><name></white> <gray>(eşya geri verildi, <count> fotoğrafı silindi)"
  picked-up-no-item: "<prefix> <yellow>Kamera söküldü: <white><name></white> <gray>(komutla oluşturulduğu için geri verilecek eşyası yok; <count> fotoğrafı silindi)"
  name-taken: "<prefix> <red>Bu isimde bir kameran zaten var: <white><name></white>"
  list-header: "<prefix> <gray>Kameralar (<count>):"
  list-entry: "<prefix> <dark_gray>› <white><name></white> <gray>(<ratio>, zoom <scale>x)"
  list-empty: "<prefix> <gray>Henüz bir kameran yok."
  # Ortografik projeksiyonda ışınlar paraleldir: yatay bakan bir kamera arazi
  # yüzeyini göremez, yalnızca gökyüzü ile toprak kesitini görür.
  shallow-pitch: "<prefix> <yellow>Kamera neredeyse yatay bakıyor (<pitch>°). İzometrik bir kare için eğimi <white>20-45°</white> arasına al; aksi halde fotoğrafın yarısı gökyüzü, yarısı toprak kesiti olur."
  item-name: "<gradient:#5e60ce:#48bfe3>Izomap Kamerası</gradient>"
  item-lore:
    - "<gray>Bir bloğa <white>sağ tık</white> ile kamera yerleştir."
  # Kameranın üstünde duran hologram. Satırlar sırayla yazılır: bir satırı silmek onu
  # hologramdan kaldırır, listeyi tamamen boşaltmak hologramı boş bırakır (kapatmak
  # için config.yml -> camera.hologram.enabled kullan).
  # Yer tutucular: <name> <owner> <ratio> <zoom> <blocks> <yaw> <pitch> <filter> <style>
  #                <sky> <photos>
  hologram:
    # Yalnızca çekim sürerken, yapılandırılmış satırların ALTINA eklenir.
    # <percent> ve <bar> burada da kullanılabilir.
    capturing: "<gold>◉ Fotoğraf çekiliyor <bar> %<percent>"
    lines:
      - "<aqua><name>"
      - "<white><ratio> <gray>·</gray> <zoom>x <gray>(<blocks> blok)</gray>"
      - "<yellow>Yön <yaw>° <dark_gray>·</dark_gray> Eğim <pitch>°"
      - "<gray><photos> fotoğraf · <filter> · <style>"

# Canlı önizleme: kamera başına tek harita, birden çok izleyici, tek "editör".
# Editör kamerayı tık ile ayarlayan kişidir; diğerleri yalnızca izler.
preview:
  started: "<prefix> <green>Önizleme açıldı: <white><camera></white> <gray>(sol elindeki harita canlı görüntüdür; <white>/izocam preview stop</white> ile kapat)"
  already: "<prefix> <gray>Bu kameranın önizlemesini zaten izliyorsun."
  offhand-full: "<prefix> <red>Önizleme için sol elin (offhand) boş olmalı."
  not-active: "<prefix> <gray>Açık bir önizlemen yok."
  busy: "<prefix> <yellow>Bu kamerayı şu an <white><editor></white> ayarlıyor; sen izleyici olarak eklendin."
  ended-self: "<prefix> <gray>Önizleme kapatıldı."
  ended-dropped: "<prefix> <gray>Haritayı bıraktın, önizleme kapatıldı."
  ended-died: "<prefix> <gray>Öldüğün için önizleme kapatıldı."
  ended-camera-removed: "<prefix> <yellow>Kamera silindiği için önizleme kapatıldı: <white><camera></white>"
  # Önizleme boyunca saniyede bir yenilenen action bar satırı. <entries>, aşağıdaki
  # entry/entry-active şablonlarının ayraçla birleştirilmiş hâlidir; ayarlanmakta olan
  # özellik entry-active ile yazılır.
  actionbar: "<entries>"
  # Render bitene kadar action bar'da bunun yerine bu satır durur. Preview'ın
  # yenilenmesi bir tık kadar sürmez; işareti olmayınca tık boşa gitmiş gibi görünür.
  actionbar-rendering: "<entries><dark_gray>  ·  </dark_gray><yellow>⟳ Güncelleniyor</yellow>"
  # Fotoğraf çekimi sürerken; preview render'ından uzun sürer ve satırı o kapar.
  # <percent> = tamamlanan yüzde, <bar> = 10 kutuluk çubuk. İkisi de ışın yürüyüşünü
  # sayar; chunk kopyalama ondan önce gelir ve o sırada değer 0'da bekler.
  actionbar-capturing: "<entries><dark_gray>  ·  </dark_gray><gold><bold>◉ Çekiliyor <bar> %<percent></bold></gold>"
  actionbar-separator: "<dark_gray>  ·  </dark_gray>"
  entry: "<gray><label> <white><value></white></gray>"
  entry-active: "<yellow><bold><label> <value></bold></yellow>"
  value-angle: "<deg>°"
  value-zoom: "<zoom>x <gray>(<blocks> blok)</gray>"
  value-position: "<x>, <y>, <z>"
  # Etiketler EditProperty adlarına göre aranır; eksik anahtar action bar'da görünür.
  property:
    YAW: "Yön"
    PITCH: "Eğim"
    ZOOM: "Zoom"
    MOVE: "Hareket"

# Renk efekti adları; anahtar ColorFilter sabitinin adıdır. Diske yalnızca sabit adı
# yazılır, dolayısıyla buradaki metni değiştirmek kayıtlı kameraları etkilemez.
# Buradaki renk, Dialog'daki "Renk: <değer>" butonunda da kullanılır: değerin rengini
# değiştirmek istersen adının başındaki etiketi değiştir.
# Filtre TANIMLARI filters.yml'dedir; burada yalnızca görünen adları durur. Oraya yeni
# bir filtre eklersen adını da buraya ekle; eklemezsen ekranda kimliğiyle görünür.
# Çerçeve adları; anahtar frames.yml'deki kimliktir. Karşılığı olmayan çerçeve
# kimliğiyle görünür.
frame:
  WOOD: "<#7A5A32>Ahşap"
  GOLD: "<#E5C34C>Altın"
  BLACK: "<dark_gray>Siyah"
  MAT: "<white>Paspartu"
  STONE: "<gray>Taş"
  # Çerçeve işlemlerinin sonuçları.
  applied: "<prefix> <green>Çerçeve takıldı: <frame> <gray>(<name>)"
  applied-embedded: "<prefix> <green>Çerçeve takıldı: <frame> <gray>(<name>) — bu çerçeve fotoğrafa işlendi, artık değiştirilemez."
  removed: "<prefix> <green>Çerçeve kaldırıldı: <white><name></white>"
  locked: "<prefix> <yellow>Bu fotoğrafın çerçevesi fotoğrafa işlenmiş; değiştirilemez."
  unknown: "<prefix> <red>Böyle bir çerçeve yok: <white><frame></white>"
  not-allowed: "<prefix> <red>Bu çerçeveyi kullanamazsın: <frame>"
  none-allowed: "<prefix> <yellow>Kullanabileceğin bir çerçeve yok."
  failed: "<prefix> <red>Çerçeve uygulanamadı. Ayrıntı için sunucu log'una bak."

# Ayar adları; izin yetmediğinde hangi ayarın engellediğini söylemek için kullanılır.
setting:
  style: "<white>Stil"
  filter: "<white>Renk filtresi"
  sky: "<white>Gökyüzü"
  ratio: "<white>En-boy oranı"

filter:
  ORIGINAL: "<white>Orijinal"
  WARM: "<gold>Sıcak"
  COOL: "<aqua>Soğuk"
  GRAYSCALE: "<gray>Siyah-Beyaz"
  SEPIA: "<#C0955F>Sepya"
  VIVID: "<green>Canlı"
  NOIR: "<dark_gray>Noir"

# Gökyüzü seçenekleri; anahtar SkyOption sabitinin adıdır. Oyuncu HANGİ gökyüzünü
# istediğini seçer, NASIL çizildiği config.yml -> photo.sky altındadır.
sky:
  NONE: "<gray>Şeffaf"
  WORLD: "<white>Oyun saati"
  DAWN: "<#FF9E6B>Şafak"
  DAY: "<aqua>Gündüz"
  DUSK: "<#FF7A4D>Gün batımı"
  NIGHT: "<blue>Gece"

# Çekim stili adları; anahtar PhotoStyle sabitinin adıdır. Stil, fotoğrafın ne kadarının
# gerçekten ışınla çizildiğini belirler; şiddeti config.yml -> photo.style altındadır.
style:
  SHARP: "<white>Keskin"
  FAST: "<yellow>Hızlı"

# Hayalet yerleştirme modu: fotoğraf asılmadan önce nereye asılacağı seçilir.
placement:
  started: "<prefix> <green>Yerleştirme modu: <white><name></white> <gray>— hayaleti istediğin yere getir, <white>sağ tık</white> ile onayla, <white>shift + sağ tık</white> ile vazgeç."
  # Yerleştirme boyunca sol ele konan eşya. Sadece görsel değil: istemci boş ele sağ tık
  # paketini göndermiyor, dolayısıyla onayın çalışması bu eşyaya bağlı.
  item-name: "<gradient:#5e60ce:#48bfe3>Yerleştiriliyor</gradient> <dark_gray>—</dark_gray> <white><name></white>"
  item-lore:
    - "<gray><white>Sağ tık</white> ile onayla."
    - "<gray><white>Shift + sağ tık</white> ile vazgeç."
  actionbar: "<green>Sağ tık: yerleştir</green> <dark_gray>·</dark_gray> <gray>Shift + sağ tık: iptal"
  actionbar-blocked: "<red>Buraya sığmıyor</red> <dark_gray>·</dark_gray> <gray>Çerçevelerin yeri boş, arkası dolu olmalı"
  blocked: "<prefix> <red>Buraya yerleştirilemez; hayalet yeşile dönene kadar başka bir yere bak."
  not-active: "<prefix> <gray>Açık bir yerleştirmen yok."
  ended-self: "<prefix> <gray>Yerleştirme iptal edildi."
  ended-timeout: "<prefix> <gray>Yerleştirme zaman aşımına uğradı."
  ended-died: "<prefix> <gray>Öldüğün için yerleştirme iptal edildi."
  ended-world-change: "<prefix> <gray>Dünya değiştirdiğin için yerleştirme iptal edildi."
  ended-photo-removed: "<prefix> <yellow>Fotoğraf silindiği için yerleştirme iptal edildi."

photo:
  capturing: "<prefix> <gray>Fotoğraf çekiliyor, lütfen bekle..."
  captured: "<prefix> <green>Fotoğraf çekildi: <white><name></white> <gray>[<id>] (<ms>ms) — kameranın Fotoğraflar listesinden yerleştirebilirsin."
  failed: "<prefix> <red>Fotoğraf çekimi başarısız oldu."
  too-large: "<prefix> <red>Kadraj çok geniş: <white><required></white> chunk gerekiyor, sınır <white><budget></white> <gray>(settings.max-capture-area)</gray>. Yakınlaştırmayı (zoom) artır."
  exporting: "<prefix> <gray>Fotoğraf dosyaya yazılıyor: <white><name></white>..."
  saved: "<prefix> <green>Fotoğraf kaydedildi: <white><file></white> <gray>(<width>x<height>, <size> KB, <ms>ms)"
  export-failed: "<prefix> <red>Fotoğraf dışa aktarılamadı. Ayrıntı için sunucu log'una bak."
  ratio-set: "<prefix> <green>En-boy oranı ayarlandı: <white><ratio></white>"
  invalid-ratio: "<prefix> <red>Geçersiz en-boy oranı. Seçenekler: 1:1, 16:9, 4:3"
  # Limit kamera başınadır ve asılı olmayan fotoğrafları da sayar.
  limit-reached: "<prefix> <red>Bu kamerayla en fazla <limit> fotoğrafın olabilir. <gray>Yenisini çekmek için listeden birini sil."
  # Kamerada, oyuncunun iznine sahip olmadığı bir ayar duruyor (çoğunlukla başkası
  # ayarlamıştır). Çekim ekranındaki butondan değiştirilebilir.
  setting-not-allowed: "<prefix> <red>Bu ayarla fotoğraf çekemezsin: <setting> = <value>. <gray>Çekim ekranından değiştirip tekrar dene."
  grid-not-allowed: "<prefix> <red><grid> ızgarası <white><tiles></white> harita eder; senin sınırın <white><limit></white>. <gray>Daha küçük bir ızgara seç."

map:
  invalid-grid: "<prefix> <red>Bu en-boy oranı için geçersiz grid. <gray><ratio> için seçenekler: <white><grids></white></gray>"
  created: "<prefix> <green><count> harita oluşturuldu (<grid>) ve envanterine eklendi. <gray>(<ms>ms)</gray>"
  inventory-full: "<prefix> <yellow>Bazı haritalar envantere sığmadı ve yere düştü."
  placed: "<prefix> <green>Fotoğraf yerleştirildi: <white><name></white> <gray>(<count> harita)"
  place-blocked: "<prefix> <red>Yerleştirme başarısız: hedef alan artık boş değil. Başka bir yere bakarak tekrar dene."
  still-loading: "<prefix> <yellow>Bu fotoğraf hâlâ yükleniyor; birazdan tekrar dene."
  orphan-frame: "<prefix> <gray>Kaydı bulunmayan bir Izomap çerçevesi kaldırıldı."
  orphan-frames-cleaned: "<prefix> <yellow><count> sahipsiz fotoğraf çerçevesi temizlendi. <gray>(Hiçbir kaydın sahiplenmediği çerçeveler; yalnızca yüklü chunk'lar taranır.)"
  name-taken: "<prefix> <red>Bu isimde bir fotoğrafın zaten var: <white><name></white>"
  photos-header: "<prefix> <gray>Fotoğraflar (<count>):"
  photos-entry: "<prefix> <dark_gray>› <white><name></white> <gray>[<id>] <camera>, <grid> <dark_gray>— asılı değil"
  photos-entry-placed: "<prefix> <dark_gray>› <white><name></white> <gray>[<id>] <camera>, <grid> <green>— asılı"
  photos-empty: "<prefix> <gray>Henüz fotoğrafın yok."
  photo-taken-down: "<prefix> <yellow>Fotoğraf duvardan indirildi: <white><name></white> <gray>(listede duruyor, yeniden asabilirsin)"
  photo-not-placed: "<prefix> <gray>Bu fotoğraf zaten asılı değil: <white><name></white>"
  photo-deleted: "<prefix> <yellow>Fotoğraf silindi: <white><name></white>"
  photos-removed-all: "<prefix> <yellow><count> fotoğraf silindi."
  photo-not-found: "<prefix> <red>Fotoğraf bulunamadı."
  cleaned: "<prefix> <green><count> fotoğrafın çerçeveleri kayıp; asılı olmayanlara alındı."
  photo-retaken: "<prefix> <green>Fotoğraf yeniden çekildi: <white><name></white> <gray>(kamera: <camera>, <ms>ms)"
  photo-no-source: "<prefix> <red>Bu fotoğraf yeniden çekilemez: <white><camera></white> kamerası yok ve fotoğrafın kayıtlı çekim parametreleri de bulunmuyor. <gray>Bir kamera adı vererek dene: <white>/izocam retake with &lt;kamera&gt; &lt;kamera/foto&gt;</white>"

dialog:
  title: "<gradient:#5e60ce:#48bfe3>Izomap Fotoğraf</gradient>"
  # Kameranın o anki ayarları; hepsi kameraya tıklayarak değiştirilir, buradan değil.
  # Yer tutucular: <camera> <ratio> <scale> <blocks> <yaw> <pitch>
  info: "<gray>Kamera: <white><camera></white>  •  Oran: <white><ratio></white>  •  Zoom: <white><scale></white>x <dark_gray>(<blocks> blok)</dark_gray>  •  Yön: <white><yaw></white>°  •  Eğim: <white><pitch></white>°"
  name-label: "Fotoğraf adı"
  grid-label: "Yerleşim (grid)"
  # Ayar butonları: tıklayınca sıradaki değere geçer. <value>, ilgili değerin
  # filter./style./sky. altındaki adıdır ve rengini oradan alır.
  filter-button: "Renk: <value>"
  style-button: "Stil: <value>"
  sky-button: "Gökyüzü: <value>"
  grid-option: "<grid> — <count> harita (<wpx>x<hpx>px)"
  capture-full: "<red>Limit dolu (<limit>)"
  pickup-button: "<red>Kamerayı Topla"
  # Yalnızca tık ile ayarlananları geri alır: zoom, yön, eğim.
  reset-button: "<red>Ayarları Sıfırla"
  pickup-title: "<gradient:#5e60ce:#48bfe3>Kamerayı Topla</gradient>"
  pickup-body: "<white><name></white> sökülecek ve bu kamerayla çekilmiş <white><count></white> fotoğraf da silinecek. Fotoğraflar kameralarına bağlıdır; kamera gidince yeniden çekilemezler."
  pickup-body-empty: "<white><name></white> sökülecek ve yerleştirme eşyası envanterine geri verilecek."
  pickup-confirm: "Topla"
  pickup-cancel: "Vazgeç"
  ratio-button: "<gray>Oran: <ratio>"
  ratio-button-active: "<bold><white>Oran: <ratio> ✔</white></bold>"
  # Üçler kuralı: yalnızca önizlemeye çizilen 3x3 kadraj kılavuzu, fotoğrafa girmez.
  thirds-button: "Üçler kuralı: <gray>Kapalı"
  thirds-button-active: "Üçler kuralı: <green>Açık ✔"
  # Çekim yapar ama duvara asmaz; asma işi Fotoğraflar listesinden yapılır.
  capture: "<bold><green>Fotoğraf Çek</green></bold>"
  photos-button: "Fotoğraflar (<count>)"
  cancel: "İptal"

  # --- fotoğraf listesi ---
  photos-title: "<gradient:#5e60ce:#48bfe3>Fotoğraflar</gradient>"
  photos-body: "<gray><camera> kamerasıyla çekilen <white><count></white> fotoğraf. Satırdaki butonlar sırayla: yeniden adlandır, as/indir, sil, yeniden çek."
  photos-empty: "<gray><camera> ile henüz fotoğraf çekmedin."
  photos-back: "← Çekim ekranı"
  photos-truncated: "<dark_gray><count> fotoğraf daha var; onlara <white>/izocam list photos</white> ile ulaşabilirsin."
  # Butonlar dar olduğu için simge kullanılıyor; istediğin metni yazabilirsin.
  photo-name: "<name>"
  photo-place: "⬛ As"
  photo-unplace: "⇩ İndir"
  photo-delete: "✖ Sil"
  photo-retake: "⟳ Yeniden çek"

  rename-title: "Fotoğrafı yeniden adlandır"
  rename-body: "<gray>Şu anki ad: <white><name></white>"
  rename-confirm: "Kaydet"

  delete-title: "Fotoğrafı sil"
  delete-body: "<gray><white><name></white> kalıcı olarak silinecek: görüntüsü, çekim parametreleri ve asılıysa çerçeveleri. Geri alınamaz."
  delete-confirm: "✖ Sil"
  # Duvardaki fotoğrafa sağ tıklayınca açılan ekran.
  wall-title: "<white>Fotoğraf: <name>"
  wall-body: "<gray>Kamera: <white><camera></white> · Izgara: <white><grid></white>"
  wall-frame-none: "<gray>Çerçeve: <white>yok"
  wall-frame-current: "<gray>Çerçeve: <frame>"
  wall-frame-locked: "<gray>Çerçeve: <frame> <dark_gray>(fotoğrafa işlenmiş, değiştirilemez)"
  wall-retake: "<yellow>Yeniden çek"
  wall-frame: "<aqua>Çerçeve tak"
  wall-frame-change: "<aqua>Çerçeveyi değiştir"
  wall-take-down: "<red>Duvardan kaldır"
  frame-title: "<white>Çerçeve seç"
  frame-body: "<gray>Çerçeve fotoğrafın dış kenarına çizilir; istediğin zaman değiştirebilir ya da kaldırabilirsin."
  frame-body-embed: "<gray>Bu sunucuda çerçeve fotoğrafa <white>işlenir</white>: taktıktan sonra değiştiremezsin."
  frame-option: "<white><frame>"
  frame-option-active: "<green>✔ <frame>"
  frame-remove: "<red>Çerçeveyi kaldır"
  frame-back: "<gray>Geri"
  delete-cancel: "Vazgeç"

# ============================================================
#  Konsol
#  Sunucu log'una yazılan satırlar. MiniMessage burada da geçerlidir; konsol renk
#  desteklemiyorsa etiketler görmezden gelinir. <reason>, bir işlem başarısız olduğunda
#  Java'nın kendi hata metnini taşır ve çevrilemez.
# ============================================================
log:
  enabled: "Izomap etkinleştirildi."
  disabled: "Izomap devre dışı bırakıldı."
  no-reason: "sebep bildirilmedi"

  # --- yükleme ---
  cameras-loaded: "<count> kamera yüklendi."
  photos-loaded: "<count> fotoğraf yüklendi."
  frames-loaded: "<count> çerçeve yüklendi (frames.yml)."
  frame-ring-invalid: "<frame> çerçevesinde geçersiz bir halka var (renk ya da kalınlık); o halka atlandı."
  frame-failed: "<name> fotoğrafına çerçeve işlenemedi: <reason>"
  photo-refresh-failed: "<name> fotoğrafının haritaları yenilenemedi: <reason>"
  filters-loaded: "<count> renk filtresi yüklendi."
  filter-unknown-op: "<file>: '<filter>' filtresindeki '<op>' işlemi tanınmadı, atlandı."
  block-colors-ready: "<count> blok için harita temel rengi hazır."
  # Olgunlaştıkça rengi değişen bloklar (buğday gibi); liste sunucuya sorularak bulunur.
  state-colors-ready: "<count> bloğun rengi büyüme durumuna göre değişiyor; her durumu ayrı okundu."
  # Vanilla'nın bloğa benzemeyen renkleri (settings.correct-vanilla-colors).
  block-colors-corrected: "<count> bloğun harita rengi dokusuna daha yakın olanla değiştirildi."
  block-colors-overridden: "<count> blok rengi override edildi."
