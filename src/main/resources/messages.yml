  failed: "<red>Fotoğraf çekimi başarısız oldu."
  too-large: "<red>Kadraj çok geniş: <white><required></white> chunk gerekiyor, sınır <white><budget></white>. Yakınlaştırmayı (zoom) artır."
  saved: "<green>Fotoğraf kaydedildi: <white><file></white> <gray>(<width>x<height>, <ms>ms)"
