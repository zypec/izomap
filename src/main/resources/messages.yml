# ============================================================
#  Izomap - Mesajlar (MiniMessage formatı)
#  Renk/format için: https://docs.advntr.dev/minimessage/format.html
# ============================================================

prefix: "<gradient:#5e60ce:#48bfe3><bold>Izomap</bold></gradient> <dark_gray>»</dark_gray> "

general:
  player-only: "<red>Bu komut yalnızca oyuncular tarafından kullanılabilir."
  reloaded: "<green>Yapılandırma yeniden yüklendi."
  # /help listesinde komutun yanında görünür; renk etiketi kullanma, düz metne çevrilir.
  command-description: "Izomap kamera komutları"

camera:
  created: "<green>Kamera oluşturuldu: <white><name></white>"
  removed: "<yellow>Kamera silindi: <white><name></white>"
  removed-all: "<yellow><count> kamera silindi."
  orphans-cleaned: "<yellow><count> sahipsiz kamera modeli temizlendi. <gray>(Kaydı silinmiş ama dünyada kalmış entity'ler; yalnızca yüklü chunk'lar taranır.)"
  moved: "<green>Kamera taşındı: <white><name></white>"
  not-found: "<red>Kamera bulunamadı."
  limit-reached: "<red>Maksimum kamera sayısına ulaştın (<limit>)."
  given-item: "<green>Kamera yerleştirme eşyası envanterine eklendi."
  name-taken: "<red>Bu isimde bir kameran zaten var: <white><name></white>"
  list-header: "<gray>Kameralar (<count>):"
  list-entry: "<dark_gray>› <white><name></white> <gray>(<ratio>, zoom <scale>x)"
  list-empty: "<gray>Henüz bir kameran yok."
  # Ortografik projeksiyonda ışınlar paraleldir: yatay bakan bir kamera arazi
  # yüzeyini göremez, yalnızca gökyüzü ile toprak kesitini görür.
  shallow-pitch: "<yellow>Kamera neredeyse yatay bakıyor (<pitch>°). İzometrik bir kare için eğimi <white>20-45°</white> arasına al; aksi halde fotoğrafın yarısı gökyüzü, yarısı toprak kesiti olur."
  item-name: "<gradient:#5e60ce:#48bfe3>Izomap Kamerası</gradient>"
  item-lore:
    - "<gray>Bir bloğa <white>sağ tık</white> ile kamera yerleştir."
  # Kameranın üstünde duran hologram. Satırlar sırayla yazılır: bir satırı silmek onu
  # hologramdan kaldırır, listeyi tamamen boşaltmak hologramı boş bırakır (kapatmak
  # için config.yml -> camera.hologram.enabled kullan).
  # Yer tutucular: <name> <owner> <ratio> <zoom> <blocks> <yaw> <pitch> <filter> <photos>
  hologram:
    lines:
      - "<gradient:#5e60ce:#48bfe3><name></gradient>"
      - "<gray><ratio> <dark_gray>·</dark_gray> <zoom>x <dark_gray>(<blocks> blok)</dark_gray>"
      - "<gray>Yön <yaw>° <dark_gray>·</dark_gray> Eğim <pitch>°"
      - "<dark_gray><photos> fotoğraf · <filter>"

# Canlı önizleme: kamera başına tek harita, birden çok izleyici, tek "editör".
# Editör kamerayı tık ile ayarlayan kişidir; diğerleri yalnızca izler.
preview:
  started: "<green>Önizleme açıldı: <white><camera></white> <gray>(sol elindeki harita canlı görüntüdür; <white>/izocam preview stop</white> ile kapat)"
  already: "<gray>Bu kameranın önizlemesini zaten izliyorsun."
  offhand-full: "<red>Önizleme için sol elin (offhand) boş olmalı."
  not-active: "<gray>Açık bir önizlemen yok."
  busy: "<yellow>Bu kamerayı şu an <white><editor></white> ayarlıyor; sen izleyici olarak eklendin."
  ended-self: "<gray>Önizleme kapatıldı."
  ended-dropped: "<gray>Haritayı bıraktın, önizleme kapatıldı."
  ended-died: "<gray>Öldüğün için önizleme kapatıldı."
  ended-camera-removed: "<yellow>Kamera silindiği için önizleme kapatıldı: <white><camera></white>"
  # Önizleme boyunca saniyede bir yenilenen action bar satırı. <entries>, aşağıdaki
  # entry/entry-active şablonlarının ayraçla birleştirilmiş hâlidir; ayarlanmakta olan
  # özellik entry-active ile yazılır.
  actionbar: "<entries>"
  actionbar-separator: "<dark_gray>  ·  </dark_gray>"
  entry: "<gray><label> <white><value></white></gray>"
  entry-active: "<yellow><bold><label> <value></bold></yellow>"
  value-angle: "<deg>°"
  value-zoom: "<zoom>x <gray>(<blocks> blok)</gray>"
  value-position-xz: "<x>, <z>"
  value-position-y: "<y>"
  # Etiketler EditProperty adlarına göre aranır; eksik anahtar action bar'da görünür.
  property:
    YAW: "Yön"
    PITCH: "Eğim"
    ZOOM: "Zoom"
    MOVE_X: "Hareket(x)"
    MOVE_Y: "Hareket(y)"

# Renk efekti adları; anahtar ColorFilter sabitinin adıdır. Diske yalnızca sabit adı
# yazılır, dolayısıyla buradaki metni değiştirmek kayıtlı kameraları etkilemez.
filter:
  ORIGINAL: "Orijinal"
  WARM: "Sıcak"
  COOL: "Soğuk"
  GRAYSCALE: "Siyah-Beyaz"

# Hayalet yerleştirme modu: fotoğraf asılmadan önce nereye asılacağı seçilir.
placement:
  started: "<green>Yerleştirme modu: <white><name></white> <gray>— hayaleti istediğin yere getir, <white>sağ tık</white> ile onayla, <white>shift + sağ tık</white> ile vazgeç."
  actionbar: "<green>Sağ tık: yerleştir</green> <dark_gray>·</dark_gray> <gray>Shift + sağ tık: iptal"
  actionbar-blocked: "<red>Buraya sığmıyor</red> <dark_gray>·</dark_gray> <gray>Çerçevelerin yeri boş, arkası dolu olmalı"
  blocked: "<red>Buraya yerleştirilemez; hayalet yeşile dönene kadar başka bir yere bak."
  not-active: "<gray>Açık bir yerleştirmen yok."
  ended-self: "<gray>Yerleştirme iptal edildi."
  ended-timeout: "<gray>Yerleştirme zaman aşımına uğradı."
  ended-died: "<gray>Öldüğün için yerleştirme iptal edildi."
  ended-world-change: "<gray>Dünya değiştirdiğin için yerleştirme iptal edildi."
  ended-photo-removed: "<yellow>Fotoğraf silindiği için yerleştirme iptal edildi."

photo:
  capturing: "<gray>Fotoğraf çekiliyor, lütfen bekle..."
  captured: "<green>Fotoğraf çekildi: <white><name></white> <gray>[<id>] (<ms>ms) — kameranın Fotoğraflar listesinden yerleştirebilirsin."
  failed: "<red>Fotoğraf çekimi başarısız oldu."
  too-large: "<red>Kadraj çok geniş: <white><required></white> chunk gerekiyor, sınır <white><budget></white> <gray>(settings.max-capture-area)</gray>. Yakınlaştırmayı (zoom) artır."
  exporting: "<gray>Fotoğraf dosyaya yazılıyor: <white><name></white>..."
  saved: "<green>Fotoğraf kaydedildi: <white><file></white> <gray>(<width>x<height>, <size> KB, <ms>ms)"
  export-failed: "<red>Fotoğraf dışa aktarılamadı. Ayrıntı için sunucu log'una bak."
  ratio-set: "<green>En-boy oranı ayarlandı: <white><ratio></white>"
  invalid-ratio: "<red>Geçersiz en-boy oranı. Seçenekler: 1:1, 16:9, 4:3"

map:
  invalid-grid: "<red>Bu en-boy oranı için geçersiz grid. <gray><ratio> için seçenekler: <white><grids></white></gray>"
  created: "<green><count> harita oluşturuldu (<grid>) ve envanterine eklendi. <gray>(<ms>ms)</gray>"
  inventory-full: "<yellow>Bazı haritalar envantere sığmadı ve yere düştü."
  placed: "<green>Fotoğraf yerleştirildi: <white><name></white> <gray>(<count> harita)"
  place-blocked: "<red>Yerleştirme başarısız: hedef alan artık boş değil. Başka bir yere bakarak tekrar dene."
  still-loading: "<yellow>Bu fotoğraf hâlâ yükleniyor; birazdan tekrar dene."
  orphan-frame: "<gray>Kaydı bulunmayan bir Izomap çerçevesi kaldırıldı."
  name-taken: "<red>Bu isimde bir fotoğrafın zaten var: <white><name></white>"
  photos-header: "<gray>Fotoğraflar (<count>):"
  photos-entry: "<dark_gray>› <white><name></white> <gray>[<id>] <camera>, <grid> <dark_gray>— asılı değil"
  photos-entry-placed: "<dark_gray>› <white><name></white> <gray>[<id>] <camera>, <grid> <green>— asılı"
  photos-empty: "<gray>Henüz fotoğrafın yok."
  photo-taken-down: "<yellow>Fotoğraf duvardan indirildi: <white><name></white> <gray>(listede duruyor, yeniden asabilirsin)"
  photo-not-placed: "<gray>Bu fotoğraf zaten asılı değil: <white><name></white>"
  photo-deleted: "<yellow>Fotoğraf silindi: <white><name></white>"
  photos-removed-all: "<yellow><count> fotoğraf silindi."
  photo-not-found: "<red>Fotoğraf bulunamadı."
  cleaned: "<green><count> fotoğrafın çerçeveleri kayıp; asılı olmayanlara alındı."
  photo-retaken: "<green>Fotoğraf yeniden çekildi: <white><name></white> <gray>(kamera: <camera>, <ms>ms)"
  photo-no-source: "<red>Bu fotoğraf yeniden çekilemez: <white><camera></white> kamerası yok ve fotoğrafın kayıtlı çekim parametreleri de bulunmuyor. <gray>Bir kamera adı vererek dene: <white>/izocam retake [id] [kamera]</white>"

dialog:
  title: "<gradient:#5e60ce:#48bfe3>Izomap Fotoğraf</gradient>"
  info: "<gray>Kamera: <white><camera></white>  •  Oran: <white><ratio></white>  •  Zoom: <white><scale></white>x"
  name-label: "Fotoğraf adı"
  scale-label: "Yakınlaştırma (kadraj genişliği)"
  filter-label: "Renk efekti"
  grid-label: "Yerleşim (grid)"
  grid-option: "<grid> — <count> harita (<wpx>x<hpx>px)"
  ratio-button: "Oran: <ratio>"
  ratio-button-active: "Oran: <ratio> ✔"
  # Üçler kuralı: yalnızca önizlemeye çizilen 3x3 kadraj kılavuzu, fotoğrafa girmez.
  thirds-button: "Üçler kuralı: Kapalı"
  thirds-button-active: "Üçler kuralı: Açık ✔"
  # Çekim yapar ama duvara asmaz; asma işi Fotoğraflar listesinden yapılır.
  capture: "Fotoğraf Çek"
  photos-button: "Fotoğraflar (<count>)"
  cancel: "İptal"

  # --- fotoğraf listesi ---
  photos-title: "<gradient:#5e60ce:#48bfe3>Fotoğraflar</gradient>"
  photos-body: "<gray><camera> kamerasıyla çekilen <white><count></white> fotoğraf. Satırdaki butonlar sırayla: yeniden adlandır, as/indir, sil, yeniden çek."
  photos-empty: "<gray><camera> ile henüz fotoğraf çekmedin."
  photos-back: "← Çekim ekranı"
  photos-truncated: "<dark_gray><count> fotoğraf daha var; onlara <white>/izocam list photos</white> ile ulaşabilirsin."
  # Butonlar dar olduğu için simge kullanılıyor; istediğin metni yazabilirsin.
  photo-name: "<name>"
  photo-place: "⬛ As"
  photo-unplace: "⇩ İndir"
  photo-delete: "✖ Sil"
  photo-retake: "⟳ Yeniden çek"

  rename-title: "Fotoğrafı yeniden adlandır"
  rename-body: "<gray>Şu anki ad: <white><name></white>"
  rename-confirm: "Kaydet"

  delete-title: "Fotoğrafı sil"
  delete-body: "<gray><white><name></white> kalıcı olarak silinecek: görüntüsü, çekim parametreleri ve asılıysa çerçeveleri. Geri alınamaz."
  delete-confirm: "✖ Sil"
  delete-cancel: "Vazgeç"

# ============================================================
#  Konsol
#  Sunucu log'una yazılan satırlar. MiniMessage burada da geçerlidir; konsol renk
#  desteklemiyorsa etiketler görmezden gelinir. <reason>, bir işlem başarısız olduğunda
#  Java'nın kendi hata metnini taşır ve çevrilemez.
# ============================================================
log:
  enabled: "Izomap etkinleştirildi."
  disabled: "Izomap devre dışı bırakıldı."
  no-reason: "sebep bildirilmedi"

  # --- yükleme ---
  cameras-loaded: "<count> kamera yüklendi."
  photos-loaded: "<count> fotoğraf yüklendi."
  photos-migrated: "<count> fotoğraf <file> dosyasından alındı ve photos.yml'e taşındı. Eski dosya silinmedi; bir sorun çıkarsa oradan geri dönülebilir."
  block-colors-ready: "<count> blok için harita temel rengi hazır."
  block-colors-overridden: "<count> blok rengi override edildi."
  camera-world-missing: "Kamera '<camera>' atlandı: dünya yüklü değil (<world>)."

  # --- yapılandırma ---
  risky-frame-shift: "<yellow>photo.frame-shift = <value>: kadraj kameranın üstüne kaydırılmış. Eğimi düşük (yatay ya da yukarı bakan) kameralarda hiçbir ışın araziye inmez ve fotoğraflar BOŞ çıkar. Önerilen değer 0.0 (kameranın baktığı nokta kadrajın merkezi olur)."
  invalid-item-display-transform: "camera.item-display-transform = '<value>' geçersiz; FIXED kullanılıyor. Geçerli değerler: <options>"
  invalid-hologram-billboard: "camera.hologram.billboard = '<value>' geçersiz; CENTER kullanılıyor. Geçerli değerler: <options>"
  invalid-hologram-background: "camera.hologram.background = '<value>' geçersiz; vanilla arka plan kullanılıyor. Beklenen: 'default', 'none' ya da #AARRGGBB."
  unknown-base-colors: "<count> blok, bilinmeyen bir harita temel rengi bildirdi; en yakın renge eşlendi. (MapBaseColor tablosu güncellenmeli.)"
  override-unknown-block: "<file>: bilinmeyen blok '<block>' atlandı."
  override-invalid-color: "<file>: '<block>' için geçersiz renk '<color>' atlandı."
  block-colors-backup-failed: "<file> eski sürümde ve yedeklenemedi; override'lar yok sayıldı."
  block-colors-upgraded: "<file> eski sürümdeydi; <backup> olarak yedeklendi ve yeni varsayılan yazıldı."

  # --- render ---
  # Eksik chunk kopyası, fotoğrafta chunk boyunda şeffaf bir delik bırakır.
  chunks-incomplete: "Kadraja giren <requested> chunk'ın <missing> tanesinin kopyası alınamadı (<world>); o bölgeler fotoğrafta şeffaf kalacak. Muhtemel sebep: chunk hiç üretilmemiş (settings.generate-missing-chunks kapalı) ya da settings.load-missing-chunks kapalı."
  # settings.render-timing açıkken her çekimde yazılır.
  render-timing: "Render <width>x<height>, <samples>x örnekleme, <chunks> chunk — kopyalama <copy> ms, ışın yürüyüşü <render> ms."
  map-render-failed: "Harita render'ı başarısız (<camera>): <reason>"
  photo-render-failed: "Fotoğraf render'ı başarısız (<camera>): <reason>"
  photo-recapture-failed: "Fotoğraf '<name>' yeniden çekilemedi: <reason>"
  photo-unrestorable: "Fotoğraf '<name>' (<id>) ne ön bellekte var ne de çekim parametreleri kayıtlı; haritalar son hâlinde bırakıldı."
  photo-unplaceable: "Fotoğraf '<name>' asılamadı, görüntüsü elde edilemedi: <reason>"
  photo-export-failed: "Fotoğraf dışa aktarılamadı (<id>): <reason>"

  # --- disk ---
  data-file-create-failed: "Veri dosyası oluşturulamadı: <file> (<reason>)"
  data-file-save-failed: "Veri dosyası kaydedilemedi: <file> (<reason>)"
  data-file-save-failed-sync: "Veri dosyası (sync) kaydedilemedi: <file> (<reason>)"
  photo-cache-write-failed: "Fotoğraf ön belleği yazılamadı (<photo>): <reason>"
  photo-cache-read-failed: "Fotoğraf ön belleği okunamadı (<photo>): <reason> — parametrelerden yeniden çekilecek."
  photo-cache-delete-failed: "Fotoğraf ön belleği silinemedi (<photo>): <reason>"
  photo-cache-scan-failed: "Fotoğraf ön belleği taranamadı: <reason>"
  photo-cache-swept: "Sahipsiz <count> fotoğraf ön bellek dosyası silindi."
