# The views every picture in this folder was shot from, on the development server
# (./gradlew runServer). Copy this file to run/plugins/Izomap/dev-shots.yml and run
# /izodev shots in the console; the PNGs land in run/plugins/Izomap/exports/.
#
# The server's config.yml had settings.max-capture-area: 2048, settings.render-threads: 8 and
# photo.shading.sun-shadow, ambient-occlusion and block-light on. Everything else at its default,
# except fog: photo.fog.enabled is on for the fog shot only.
