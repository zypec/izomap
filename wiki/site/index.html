<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Izomap</title>
<meta name="description" content="Isometric photography for Minecraft servers: place a camera, aim it with a live preview, and print what it sees onto maps.">
<meta property="og:title" content="Izomap">
<meta property="og:description" content="Isometric photography for Minecraft servers, printed onto maps.">
<meta property="og:image" content="https://zypec.github.io/izomap/gallery/fog.png">
<link rel="icon" href="icon.svg">
<script>
try {
  const theme = localStorage.getItem('zypec-theme') || localStorage.getItem('pp-theme');
  if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
} catch (unavailable) {}
</script>
<link rel="stylesheet" href="kit/front.css">
<link rel="stylesheet" href="accent.css">
<style>
.hero{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:48px;align-items:center;padding:64px 0 40px}
/* The name in ink, underlined in film yellow like a word marked on a contact sheet. As the page opens
   the word comes into focus and the band is drawn under it from left to right, the stroke of a
   marker; with reduced motion both are simply there. */
.brand{font-size:76px;font-weight:700;letter-spacing:-.045em;line-height:1;margin:0 0 18px;width:fit-content;color:var(--ink);
  background:linear-gradient(transparent 60%,#e3b12a 60% 90%,transparent 90%) no-repeat 0 0 / 100% 100%;
  animation:brandin .7s cubic-bezier(.16,1,.3,1) .1s both,marker .85s cubic-bezier(.65,0,.25,1) .5s both}
@keyframes brandin{from{opacity:0;filter:blur(8px);transform:translateY(.12em)}to{opacity:1;filter:none;transform:none}}
@keyframes marker{from{background-size:0% 100%}to{background-size:100% 100%}}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.shot{margin:0;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);background:var(--stage);position:relative}
.shot img{width:100%;height:auto;display:block}
/* The other picture lies over the first, so switching is a fade with nothing to wait for. */
.shot img.other{position:absolute;inset:0;opacity:0;transition:opacity .3s}
.shot.off img.other{opacity:1}
.shot figcaption{position:absolute;left:12px;bottom:12px;display:flex;gap:8px;align-items:center}
.pill{border:1px solid #ffffff38;background:#0007;color:#f2f2f6;border-radius:999px;padding:6px 14px;cursor:pointer;
  font:inherit;font-size:13px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pill:hover{background:#000a}
.pill[aria-pressed=true]{border-color:#fff9}
.pill b{font-weight:600}
.soonbadge{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;font-weight:600;
  font-size:15px;color:var(--accent-ink);background:var(--accent-soft);border:1px dashed var(--accent-line)}
.soonbadge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.features{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:20px}
.feature{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:22px}
.feature b{display:block;font-size:16.5px;letter-spacing:-.01em;margin-bottom:6px}
.feature p{margin:0;color:var(--ink-2);font-size:14.5px;line-height:1.6}
.feature .icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);
  color:var(--accent-ink);margin-bottom:12px}
.feature .icon svg{width:18px;height:18px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:20px;counter-reset:step}
.step{padding:22px;border-radius:var(--r);background:var(--sunk);border:1px solid var(--line)}
.step::before{counter-increment:step;content:counter(step);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;
  background:var(--accent);color:var(--on-accent);font-weight:700;font-size:14px;margin-bottom:12px}
.step b{display:block;margin-bottom:4px}
.step p{margin:0;color:var(--ink-2);font-size:14.5px}
.step code,.feature code{font-family:var(--mono);font-size:.88em;background:var(--panel);padding:1px 6px;border-radius:5px}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}
.gallery figure{margin:0;cursor:zoom-in}
.gallery img{width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block;
  background:var(--stage)}
.gallery figcaption{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5}
.filters{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:center;margin-top:16px}
.filters figure{margin:0}
.filters img{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chips button{border:1px solid var(--line-2);background:var(--panel);color:var(--ink-2);border-radius:999px;padding:6px 14px;
  font:inherit;font-size:14px;cursor:pointer}
.chips button[aria-pressed=true]{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
/* A photo is a grid of map pixels: opened large, it stays one. */
dialog.lightbox img{image-rendering:pixelated}
@media (max-width:900px){
  .hero{grid-template-columns:1fr;gap:28px;padding-top:36px}
  .brand{font-size:56px}
  .features,.steps{grid-template-columns:1fr}
  .gallery{grid-template-columns:repeat(2,minmax(0,1fr))}
  .filters{grid-template-columns:1fr}
}
@media (max-width:520px){.gallery{grid-template-columns:1fr}}
.content-error{color:var(--muted);padding:48px 0}
.lede p,.notice p{margin:0}.lede p+p{margin-top:12px}
/* The words under a section's heading, before what it shows, read as a note. */
section>.prose p{margin:0;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<header>
  <a class="home" href="./"><img src="icon.svg" alt="" width="16" height="16">Izomap</a>
  <nav>
    <a class="roomy" href="#gallery">Gallery</a>
    <a href="wiki/">Docs</a>
    <a href="../">Portfolio</a>
    <button id="theme" type="button" aria-live="polite"><span class="icon" aria-hidden="true"></span><span class="text"></span></button>
  </nav>
</header>
<script src="kit/island.js"></script>

<!-- What this page says is in content.md beside it; this file only draws it. -->
<main data-content="content.md"></main>

<footer>
  <span>Izomap by <a href="../">zypec</a></span>
  <a href="wiki/">Docs</a>
  <a href="wiki/#getting-started">Getting started</a>
  <a href="wiki/#faq">FAQ</a>
  <span>Version __VERSION__</span>
</footer>

<script src="kit/content.js"></script>
<script src="kit/lightbox.js"></script>
<script>
const {escape, inline} = Content;

/** The icons a feature can name in content.md, by the name it gives. */
const ICONS = {
  camera: '<rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/>',
  cube: '<path d="M12 3 20 7.5 12 12 4 7.5z"/><path d="M4 7.5V16.5L12 21V12M20 7.5V16.5L12 21"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  focus: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 3v5M12 16v5"/>',
  wall: '<rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M9 5v14M15 5v14M3 12h18"/>',
  sliders: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
};
const button = ([words, href, primary]) =>
  `<a class="btn${primary ? ' primary' : ''}" href="${escape(href)}">${inline(words)}</a>`;

Content.kind('hero', block => {
  const [src, alt] = block.pairs('image')[0] || [];
  const [name, other, otherAlt] = block.pairs('toggle')[0] || [];
  return `<section class="hero"><div><p class="kicker">${inline(block.one('kicker'))}</p><h1 class="brand">${inline(block.one('title'))}</h1>`
    + `<div class="lede">${block.html}</div><div class="cta">`
    + (block.one('badge') ? `<span class="soonbadge">${inline(block.one('badge'))}</span>` : '')
    + block.pairs('button').map(button).join('') + '</div>'
    + (block.one('note') ? `<p class="note" style="margin-top:14px">${inline(block.one('note'))}</p>` : '') + '</div>'
    + (src ? `<figure class="shot" id="hero"><img src="${escape(src)}" alt="${escape(alt || '')}" width="2048" height="1152">`
      + (other ? `<img class="other" src="${escape(other)}" alt="${escape(otherAlt || '')}" width="2048" height="1152" aria-hidden="true">`
        + `<figcaption><button class="pill" type="button" id="toggle" aria-pressed="true">${inline(name)}: <b>On</b></button></figcaption>` : '')
      + '</figure>' : '') + '</section>';
});

Content.kind('feature', block => `<div class="feature">`
  + (ICONS[block.one('icon')] ? `<span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[block.one('icon')]}</svg></span>` : '')
  + `<b>${inline(block.one('name'))}</b>${block.html}</div>`, 'features');

Content.kind('step', block => `<div class="step"><b>${inline(block.one('name'))}</b>${block.html}</div>`, 'steps');

Content.kind('gallery', block => `<div class="gallery" id="pictures">` + block.pairs('picture').map(([src, caption]) =>
  `<figure><img src="${escape(src)}" alt="${escape(caption || '')}" loading="lazy" width="1024" height="640">`
  + (caption ? `<figcaption>${inline(caption)}</figcaption>` : '') + '</figure>').join('') + '</div>');

Content.kind('filters', block => {
  const filters = block.pairs('filter'), folder = block.one('folder');
  const [first, firstName] = filters[0] || [];
  const [words, href] = block.pairs('link')[0] || [];
  return `<div class="filters" data-folder="${escape(folder)}"><figure><img id="filtered" src="${escape(folder + first + '.png')}"`
    + ` alt="A lake and its shores through the ${escape(firstName || '')} filter" width="512" height="384"></figure>`
    + `<div><div class="lede" style="font-size:17px">${block.html}</div><div class="chips" id="filterchips" role="group" aria-label="Filter">`
    + filters.map(([id, name], i) => `<button type="button" data-f="${escape(id)}" aria-pressed="${i === 0}">${inline(name)}</button>`).join('')
    + `</div>${href ? `<a href="${escape(href)}">${inline(words)}</a>` : ''}</div></div>`;
});

Content.kind('notice', block => `<div class="notice">${block.html}</div>`);

/** What only works once the words are on the page: the hero's switch, the filters and the lightbox. */
document.addEventListener('contentready', () => {
  const toggle = document.getElementById('toggle');
  if (toggle) toggle.onclick = () => {
    const hero = document.getElementById('hero');
    const [first, other] = hero.querySelectorAll('img');
    const on = hero.classList.toggle('off') === false;
    toggle.setAttribute('aria-pressed', String(on));
    toggle.querySelector('b').textContent = on ? 'On' : 'Off';
    // Only the picture on show is read out.
    first.toggleAttribute('aria-hidden', !on);
    other.toggleAttribute('aria-hidden', on);
  };

  const filtered = document.getElementById('filtered');
  const folder = filtered && filtered.closest('.filters').dataset.folder;
  document.querySelectorAll('#filterchips button').forEach(button => {
    button.onclick = () => {
      document.querySelectorAll('#filterchips button').forEach(other => other.setAttribute('aria-pressed', String(other === button)));
      filtered.src = `${folder}${button.dataset.f}.png`;
      filtered.alt = `A lake and its shores through the ${button.textContent} filter`;
    };
    // Every filter at once, so switching never waits on the network.
    new Image().src = `${folder}${button.dataset.f}.png`;
  });

  Lightbox.wire('#pictures figure');
});
</script>
<script src="kit/theme.js"></script>
</body>
</html>
