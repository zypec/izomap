<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Izomap</title>
<meta name="description" content="Isometric photography for Minecraft servers: place a camera, aim it with a live preview, and print what it sees onto maps.">
<meta property="og:title" content="Izomap">
<meta property="og:description" content="Isometric photography for Minecraft servers, printed onto maps.">
<meta property="og:image" content="https://zypec.github.io/izomap/gallery/fog.png">
<link rel="icon" href="icon.svg">
<script>
try {
  const theme = localStorage.getItem('zypec-theme') || localStorage.getItem('pp-theme');
  if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
} catch (unavailable) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit/front.css">
<link rel="stylesheet" href="accent.css">
<style>
/* Izomap's page is drawn as the camera it is: the hero is a viewfinder, with the photo's settings written
   over it the way a camera writes its own, the gallery is a strip of film with its frames numbered along
   the edge, and each feature is a button marked as a camera marks its buttons. The bar, the type, the
   buttons and the colors are the kit's, so it is still one of the house's pages. */
:root{--hud:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  /* The film's base and the orange of what is printed along its edge. */
  --film:#16110a;--film-edge:#e8a33a;--film-hole:#f3eee4}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--film:#0d0a06;--film-hole:#4a4136}}
:root[data-theme=dark]{--film:#0d0a06;--film-hole:#4a4136}

.hero{display:grid;grid-template-columns:minmax(0,.78fr) minmax(0,1.22fr);gap:48px;align-items:center;padding:64px 0 40px}
/* The name in ink, underlined in film yellow like a word marked on a contact sheet. As the page opens
   the word comes into focus and the band is drawn under it from left to right, the stroke of a
   marker; with reduced motion both are simply there. */
.brand{font-size:76px;font-weight:700;letter-spacing:-.045em;line-height:1;margin:0 0 18px;width:fit-content;color:var(--ink);
  background:linear-gradient(transparent 60%,#e3b12a 60% 90%,transparent 90%) no-repeat 0 0 / 100% 100%;
  animation:brandin .7s cubic-bezier(.16,1,.3,1) .1s both,marker .85s cubic-bezier(.65,0,.25,1) .5s both}
@keyframes brandin{from{opacity:0;filter:blur(8px);transform:translateY(.12em)}to{opacity:1;filter:none;transform:none}}
@keyframes marker{from{background-size:0% 100%}to{background-size:100% 100%}}
.cta{display:flex;gap:10px;flex-wrap:wrap}
/* What is not out yet sits beside the button as words, underlined with dots, since it leads nowhere yet. */
.soonbadge{display:inline-flex;align-items:center;height:44px;padding:0 10px;font-weight:600;font-size:15px;color:var(--muted);
  text-decoration:underline dotted;text-decoration-color:var(--line-2);text-decoration-thickness:2px;text-underline-offset:6px;cursor:default}

/* ── The viewfinder: the photo, the camera's corners and its readouts over it. ── */
.viewfinder{margin:0;position:relative;border-radius:18px;overflow:hidden;background:var(--stage);
  box-shadow:0 0 0 1px var(--line),0 30px 60px -34px #000a}
.viewfinder img{width:100%;height:auto;display:block}
/* The other picture lies over the first, so switching is a fade with nothing to wait for. */
.viewfinder img.other{position:absolute;inset:0;opacity:0;transition:opacity .3s}
.viewfinder.off img.other{opacity:1}
/* Where the photo is cut into maps: one square for each map it is printed on. */
.viewfinder .maps{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;
  background-image:linear-gradient(to right,#fff6 1px,transparent 1px),linear-gradient(to bottom,#fff6 1px,transparent 1px);
  background-size:calc(100% / var(--across)) 100%,100% calc(100% / var(--down))}
.viewfinder.grid .maps{opacity:1}
/* The four corners of the frame and the focus mark at its middle, white with a shadow so they read on
   any sky. */
.viewfinder .corner{position:absolute;width:26px;height:26px;border:2px solid #fff;filter:drop-shadow(0 1px 2px #0008);pointer-events:none}
.viewfinder .tl{top:44px;left:18px;border-right:0;border-bottom:0}
.viewfinder .tr{top:44px;right:18px;border-left:0;border-bottom:0}
.viewfinder .bl{bottom:50px;left:18px;border-right:0;border-top:0}
.viewfinder .br{bottom:50px;right:18px;border-left:0;border-top:0}
.viewfinder .af{position:absolute;left:50%;top:50%;width:46px;height:32px;margin:-16px 0 0 -23px;border:1.5px solid #fff;border-radius:3px;
  filter:drop-shadow(0 1px 2px #0008);pointer-events:none}
.hud{position:absolute;left:0;right:0;display:flex;align-items:center;gap:18px;padding:10px 16px;font:500 12px/1 var(--hud);
  letter-spacing:.04em;color:#fff;text-shadow:0 1px 2px #000c;pointer-events:none}
.hud.top{top:0;background:linear-gradient(#000a,transparent)}
.hud.foot{bottom:0;background:linear-gradient(transparent,#000b)}
.hud .read{display:flex;gap:6px;white-space:nowrap}
.hud .read span{color:#ffffffa6;text-transform:uppercase}
.hud .spring{flex:1}
/* The camera's function buttons: lit in film yellow while on. */
.hud button{pointer-events:auto;font:500 11.5px/1 var(--hud);letter-spacing:.06em;text-transform:uppercase;color:#fff;
  background:#0006;border:1px solid #ffffff5c;border-radius:6px;padding:7px 9px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hud button:hover{background:#000a}
.hud button[aria-pressed=true]{color:#1b1406;background:#e3b12a;border-color:#e3b12a;text-shadow:none}
.hud button:focus-visible{outline:2px solid #fff;outline-offset:2px}
/* As the page opens the camera finds its focus: the picture sharpens, the focus mark closes in on it and
   goes yellow for a moment, and the frame flashes as the shutter falls. */
.viewfinder img:first-child{animation:sharpen .7s cubic-bezier(.2,.8,.3,1) .15s both}
.viewfinder .af{animation:lock .7s cubic-bezier(.2,.8,.3,1) .15s both}
.viewfinder::after{content:"";position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;animation:shutter .5s ease-out .85s both}
@keyframes sharpen{from{filter:blur(7px) brightness(.85)}to{filter:none}}
@keyframes lock{0%{transform:scale(1.7);opacity:0}60%{transform:scale(1);opacity:1;border-color:#fff}75%,90%{border-color:#e3b12a}100%{border-color:#fff}}
@keyframes shutter{0%{opacity:.55}100%{opacity:0}}

/* ── Features: each one a camera button, marked with its letters. ── */
.features{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:20px}
.feature{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:22px}
.feature b{display:block;font-size:16.5px;letter-spacing:-.01em;margin-bottom:6px}
.feature p{margin:0;color:var(--ink-2);font-size:14.5px;line-height:1.6}
.feature .code{display:inline-grid;place-items:center;min-width:44px;height:30px;padding:0 10px;margin-bottom:14px;border-radius:8px;
  font:500 13px/1 var(--hud);letter-spacing:.08em;color:var(--ink);background:var(--sunk);
  box-shadow:inset 0 1px 0 #ffffff80,inset 0 -2px 0 #0000001a,0 0 0 1px var(--line-2)}
.feature .code::before{content:"";width:6px;height:6px;border-radius:50%;background:#e3b12a;margin-right:8px;box-shadow:0 0 6px #e3b12a99}
.feature .code{grid-auto-flow:column}

/* ── Steps, counted the way a camera counts its frames. ── */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:20px;counter-reset:step}
.step{padding:22px;border-radius:var(--r);background:var(--sunk);border:1px solid var(--line)}
.step::before{counter-increment:step;content:counter(step,decimal-leading-zero);display:inline-block;margin-bottom:12px;padding:5px 9px 5px 22px;
  font:500 14px/1 var(--hud);letter-spacing:.06em;color:#f3e3b8;background:#1b1406 no-repeat 8px 50%/8px 9px;border-radius:6px;
  background-image:linear-gradient(135deg,#e3b12a 50%,transparent 50%),linear-gradient(45deg,transparent 50%,#e3b12a 50%)}
.step b{display:block;margin-bottom:4px}
.step p{margin:0;color:var(--ink-2);font-size:14.5px}
.step code,.feature code{font-family:var(--mono);font-size:.88em;background:var(--panel);padding:1px 6px;border-radius:5px}

/* ── The gallery: frames on a strip of film. Frames side by side touch, so each row is one strip, its
   holes running along both edges and its frame numbers printed between them. ── */
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:0;row-gap:22px;margin-top:16px;counter-reset:frame}
.gallery figure{margin:0;cursor:zoom-in;min-width:0}
.gallery .frame{position:relative;background:var(--film);padding:22px 7px 34px}
/* The holes: a row of rounded squares along the top and the foot. */
.gallery .frame::before,.gallery .frame::after{content:"";position:absolute;left:0;right:0;height:9px;
  background:radial-gradient(circle at 50% 50%,var(--film-hole) 0 2.6px,transparent 3px) 0 0/16px 9px repeat-x;opacity:.9}
.gallery .frame::before{top:6px}
.gallery .frame::after{bottom:5px}
.gallery img{width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;display:block;border-radius:3px;background:#000;position:relative}
/* What the film's edge says: its name and the frame's number, as a film prints them. */
.gallery .edge{position:absolute;left:10px;right:10px;bottom:18px;display:flex;justify-content:space-between;font:500 8.5px/1 var(--hud);
  letter-spacing:.14em;color:var(--film-edge);opacity:.85}
.gallery .edge .n::before{counter-increment:frame;content:"\25B8 " counter(frame) "A"}
.gallery figcaption{padding:10px 12px 0 2px;font-size:13px;color:var(--muted);line-height:1.5}
.gallery figcaption .shot{display:block;margin-top:3px;font:500 11.5px var(--hud);letter-spacing:.03em;color:var(--ink-2)}
.gallery figure:hover img{filter:brightness(1.06)}

/* ── Filters: the picture styles of a camera, the photo framed as in the viewfinder. ── */
.filters{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:center;margin-top:16px}
.filters figure{margin:0;position:relative;border-radius:12px;overflow:hidden;background:var(--stage);box-shadow:0 0 0 1px var(--line)}
.filters img{width:100%;height:auto;display:block}
.filters figure .hud{top:0;background:linear-gradient(#0009,transparent)}
/* The filters are one island of glass, as the bar is: each filter an icon, the chosen one with its name
   beside it on film yellow. Choosing another slides the yellow over to it while its name opens and the
   last one's closes. */
.filters>*{min-width:0}
.filterisland{position:relative;display:flex;width:fit-content;align-items:center;gap:2px;margin:16px 0;padding:5px;max-width:100%;border-radius:999px;
  overflow-x:auto;scrollbar-width:none;background:var(--glass);backdrop-filter:var(--glass-filter);-webkit-backdrop-filter:var(--glass-filter);
  box-shadow:inset 0 1px 0 var(--glass-rim),inset 0 0 0 1px color-mix(in srgb,var(--glass-rim) 28%,transparent),var(--glass-shadow)}
.filterisland::-webkit-scrollbar{display:none}
.filterisland .glide{position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:999px;background:#e3b12a;
  box-shadow:0 4px 14px -6px #b07f0099;pointer-events:none}
.filterisland button{position:relative;display:inline-flex;align-items:center;height:40px;padding:0 11px;border:0;border-radius:999px;
  background:none;color:var(--ink-2);cursor:pointer;flex:none;transition:color .3s}
.filterisland button:hover{color:var(--ink)}
.filterisland button[aria-pressed=true]{color:#1b1406}
.filterisland button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.filterisland svg{width:18px;height:18px;flex:none}
.filterisland .label{max-width:0;opacity:0;overflow:hidden;white-space:nowrap;font:500 12.5px/1 var(--hud);letter-spacing:.05em;
  text-transform:uppercase;transition:max-width .42s var(--spring),opacity .25s,margin .42s var(--spring)}
.filterisland button[aria-pressed=true] .label{max-width:var(--w);opacity:1;margin-left:8px;transition-delay:0s,.08s,0s}
@media (prefers-reduced-motion:reduce){.filterisland .label,.filterisland button{transition:none}}
@media (max-width:560px){.filterisland button{height:36px;padding:0 9px}.filterisland svg{width:17px;height:17px}.filterisland .label{font-size:11.5px}}

/* ── What is coming, on the camera's screen. ── */
.notice{display:flex;gap:14px;align-items:flex-start;padding:18px 20px;border-radius:var(--r);background:var(--stage);color:#ece6d6;
  font-size:15px;line-height:1.6}
.notice::before{content:"";flex:none;width:10px;height:10px;margin-top:7px;border-radius:50%;background:#e3b12a;box-shadow:0 0 10px #e3b12a;
  animation:blink 1.6s steps(1) infinite}
.notice a{color:#f0c75a}
@keyframes blink{50%{opacity:.25}}

/* A photo is a grid of map pixels: opened large, it stays one. */
dialog.lightbox img{image-rendering:pixelated}
@media (max-width:900px){
  .hero{grid-template-columns:1fr;gap:28px;padding-top:36px}
  .brand{font-size:56px}
  .features,.steps{grid-template-columns:1fr}
  .gallery{grid-template-columns:repeat(2,minmax(0,1fr))}
  .filters{grid-template-columns:1fr}
}
@media (max-width:560px){
  .gallery{grid-template-columns:1fr}
  .hud{gap:10px;padding:8px 10px;font-size:10.5px}
  .hud .read.extra{display:none}
  .viewfinder .tl,.viewfinder .tr{top:34px}
  .viewfinder .bl,.viewfinder .br{bottom:42px}
  .viewfinder .corner{width:18px;height:18px}
}
@media (prefers-reduced-motion:reduce){
  .viewfinder img:first-child,.viewfinder .af,.viewfinder::after,.notice::before{animation:none}
}
.content-error{color:var(--muted);padding:48px 0}
.lede p,.notice p{margin:0}.lede p+p{margin-top:12px}
/* The words under a section's heading, before what it shows, read as a note. */
section>.prose p{margin:0;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<header>
  <a class="home" href="./"><img src="icon.svg" alt="" width="16" height="16">Izomap</a>
  <nav>
    <a class="roomy" href="#gallery">Gallery</a>
    <a href="wiki/">Docs</a>
    <a href="../">Portfolio</a>
    <button id="theme" type="button" aria-live="polite"><span class="icon" aria-hidden="true"></span><span class="text"></span></button>
  </nav>
</header>
<script src="kit/island.js"></script>

<!-- What this page says is in content.md beside it; this file only draws it. -->
<main data-content="content.md"></main>

<footer>
  <span>Izomap by <a href="../">zypec</a></span>
  <a href="wiki/">Docs</a>
  <a href="wiki/#getting-started">Getting started</a>
  <a href="wiki/#faq">FAQ</a>
  <span>Version __VERSION__</span>
</footer>

<script src="kit/content.js"></script>
<script src="kit/lightbox.js"></script>
<script>
const {escape, inline} = Content;

const button = ([words, href, primary]) =>
  `<a class="btn${primary ? ' primary' : ''}" href="${escape(href)}">${inline(words)}</a>`;
const read = ([label, value], extra) => `<span class="read${extra ? ' extra' : ''}"><span>${inline(label)}</span>${inline(value)}</span>`;

/**
 * The hero: the words, and the photo in a viewfinder. Its readouts go along the top and the foot, the
 * second of each pair dropped on a phone, and its function buttons sit at the foot: the toggle (Fog) and
 * Grid, which shows the maps the photo is cut into.
 */
Content.kind('hero', block => {
  const [src, alt, maps] = block.pairs('image')[0] || [];
  const [name, other, otherAlt] = block.pairs('toggle')[0] || [];
  const [across, down] = (maps || '1x1').split('x').map(Number);
  const readouts = block.pairs('readout'), half = Math.ceil(readouts.length / 2);
  const row = list => list.map((pair, i) => read(pair, i % 2 === 1)).join('');
  return `<section class="hero"><div><p class="kicker">${inline(block.one('kicker'))}</p><h1 class="brand">${inline(block.one('title'))}</h1>`
    + `<div class="lede">${block.html}</div><div class="cta">`
    + block.pairs('button').map(button).join('')
    + (block.one('badge') ? `<span class="soonbadge">${inline(block.one('badge'))}</span>` : '') + '</div>'
    + (block.one('note') ? `<p class="note" style="margin-top:14px">${inline(block.one('note'))}</p>` : '') + '</div>'
    + (src ? `<figure class="viewfinder" id="hero" style="--across:${across};--down:${down}"><img src="${escape(src)}" alt="${escape(alt || '')}" width="2048" height="1152">`
      + (other ? `<img class="other" src="${escape(other)}" alt="${escape(otherAlt || '')}" width="2048" height="1152" aria-hidden="true">` : '')
      + '<span class="maps" aria-hidden="true"></span><span class="corner tl"></span><span class="corner tr"></span>'
      + '<span class="corner bl"></span><span class="corner br"></span><span class="af"></span>'
      + `<div class="hud top">${row(readouts.slice(0, half))}</div>`
      + `<div class="hud foot">${row(readouts.slice(half))}<span class="spring"></span>`
      + (other ? `<button type="button" id="toggle" aria-pressed="true">${inline(name)}</button>` : '')
      + `<button type="button" id="grid" aria-pressed="false" aria-label="Show the ${across * down} maps the photo is printed on">Grid</button></div>`
      + '</figure>' : '') + '</section>';
});

Content.kind('feature', block => `<div class="feature">`
  + (block.one('code') ? `<span class="code" aria-hidden="true">${inline(block.one('code'))}</span>` : '')
  + `<b>${inline(block.one('name'))}</b>${block.html}</div>`, 'features');

Content.kind('step', block => `<div class="step"><b>${inline(block.one('name'))}</b>${block.html}</div>`, 'steps');

Content.kind('gallery', block => `<div class="gallery" id="pictures">` + block.pairs('picture').map(([src, caption, shot]) =>
  `<figure><div class="frame"><img src="${escape(src)}" alt="${escape(caption || '')}" loading="lazy" width="1024" height="640">`
  + '<span class="edge" aria-hidden="true"><span>IZOMAP 128</span><span class="n"></span></span></div>'
  + (caption ? `<figcaption>${inline(caption)}${shot ? `<span class="shot">${inline(shot)}</span>` : ''}</figcaption>` : '') + '</figure>').join('') + '</div>');

/** What each shipped filter does to a picture, drawn small. */
const FILTER_ICONS = {
  original: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.5"/>',
  warm: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/>',
  cool: '<path d="M12 2.5v19M3.8 7.2l16.4 9.6M3.8 16.8l16.4-9.6"/><path d="m9.5 4 2.5 2 2.5-2M9.5 20l2.5-2 2.5 2"/>',
  vivid: '<path d="M12 3c3.5 4.2 6 7.4 6 10.5a6 6 0 0 1-12 0C6 10.4 8.5 7.2 12 3z"/><path d="M9.5 14a2.5 2.5 0 0 0 2.5 2.5"/>',
  sepia: '<path d="M7 3h10M7 21h10M8 3c0 4 8 5 8 9s-8 5-8 9M16 3c0 4-8 5-8 9"/>',
  grayscale: '<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/>',
  noir: '<path d="M19.5 14.5A8 8 0 1 1 9.5 4.5a6.5 6.5 0 0 0 10 10z"/>',
};

Content.kind('filters', block => {
  const filters = block.pairs('filter'), folder = block.one('folder');
  const [first, firstName] = filters[0] || [];
  const [words, href] = block.pairs('link')[0] || [];
  return `<div class="filters" data-folder="${escape(folder)}"><figure><img id="filtered" src="${escape(folder + first + '.png')}"`
    + ` alt="A lake and its shores through the ${escape(firstName || '')} filter" width="512" height="384">`
    + `<div class="hud top"><span class="read"><span>Filter</span><b id="filtername" style="font-weight:500">${inline(firstName || '')}</b></span></div></figure>`
    + `<div><div class="lede" style="font-size:17px">${block.html}</div><div class="filterisland" id="filterchips" role="group" aria-label="Filter">`
    + '<span class="glide" aria-hidden="true"></span>'
    + filters.map(([id, name], i) => `<button type="button" data-f="${escape(id)}" aria-pressed="${i === 0}" aria-label="${escape(name)}" title="${escape(name)}">`
      + `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${FILTER_ICONS[id] || FILTER_ICONS.original}</svg>`
      + `<span class="label" aria-hidden="true">${inline(name)}</span></button>`).join('')
    + `</div>${href ? `<a href="${escape(href)}">${inline(words)}</a>` : ''}</div></div>`;
});

Content.kind('notice', block => `<div class="notice"><div>${block.html}</div></div>`);

/** What only works once the words are on the page: the viewfinder's buttons, the filters and the lightbox. */
document.addEventListener('contentready', () => {
  const hero = document.getElementById('hero');
  const toggle = document.getElementById('toggle');
  if (toggle) toggle.onclick = () => {
    const [first, other] = hero.querySelectorAll('img');
    const on = hero.classList.toggle('off') === false;
    toggle.setAttribute('aria-pressed', String(on));
    // Only the picture on show is read out.
    first.toggleAttribute('aria-hidden', !on);
    other.toggleAttribute('aria-hidden', on);
  };
  const grid = document.getElementById('grid');
  if (grid) grid.onclick = () => grid.setAttribute('aria-pressed', String(hero.classList.toggle('grid')));

  const filtered = document.getElementById('filtered');
  const island = document.getElementById('filterchips');
  const folder = filtered && filtered.closest('.filters').dataset.folder;
  if (island) {
    const buttons = [...island.querySelectorAll('button')], glide = island.querySelector('.glide');
    // Each name opens to its own width, so it is measured once it is drawn.
    for (const label of island.querySelectorAll('.label')) label.style.setProperty('--w', `${label.scrollWidth}px`);
    const place = () => {
      const on = island.querySelector('[aria-pressed=true]');
      glide.style.transform = `translateX(${on.offsetLeft}px)`;
      glide.style.width = `${on.offsetWidth}px`;
    };
    // While the names open and close the buttons change width, so the yellow follows the chosen one frame
    // by frame until they settle.
    let until = 0, chosen = null;
    const reveal = () => chosen?.scrollIntoView({block: 'nearest', inline: 'nearest',
      behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
    // Once the name has opened, the island scrolls to show all of it where it is narrower than the filters.
    const follow = () => { place(); if (performance.now() < until) requestAnimationFrame(follow); else reveal(); };
    place();
    addEventListener('resize', place);
    buttons.forEach(button => {
      button.onclick = () => {
        buttons.forEach(other => other.setAttribute('aria-pressed', String(other === button)));
        const name = button.getAttribute('aria-label');
        filtered.src = `${folder}${button.dataset.f}.png`;
        filtered.alt = `A lake and its shores through the ${name} filter`;
        document.getElementById('filtername').textContent = name;
        chosen = button;
        until = performance.now() + 520;
        requestAnimationFrame(follow);
      };
      // Every filter at once, so switching never waits on the network.
      new Image().src = `${folder}${button.dataset.f}.png`;
    });
  }

  Lightbox.wire('#pictures figure');
});
</script>
<script src="kit/theme.js"></script>
</body>
</html>
